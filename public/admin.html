<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0d2a3f">
<title>Admin – FX Flytt</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/admin.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FX Admin">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{--navy:#0d2a3f;--navy2:#16384f;--accent:#ff7a1a;--accent2:#e8650a;--ink:#14212b;--muted:#5d6d7a;--line:#e2e8ee;--line2:#cfd9e2;--bg:#f3f6f9;--card:#fff;--green:#1f8a4c;--red:#b42318;--blue:#1f5fae;--side:236px;
    --sh:0 1px 2px rgba(13,42,63,.06),0 2px 8px rgba(13,42,63,.04);--sh2:0 12px 32px rgba(13,42,63,.16)}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:var(--navy)}
  [hidden]{display:none!important}
  svg.i{width:20px;height:20px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  /* ---------- shell: sidebar (desktop) / bottom bar (mobile) ---------- */
  #side{position:fixed;top:0;bottom:0;left:0;width:var(--side);background:var(--navy);color:#c4d5e2;display:flex;flex-direction:column;padding:20px 12px 16px;z-index:20}
  .brand{display:block;padding:2px 10px 22px}.brand img{height:34px;display:block}
  #side a.nav{position:relative;display:flex;align-items:center;gap:12px;padding:10px 12px;margin:1px 0;border-radius:10px;color:#c4d5e2;text-decoration:none;font-weight:600;font-size:14.5px}
  #side a.nav:hover{background:rgba(255,255,255,.06);color:#fff}
  #side a.nav.on{background:rgba(255,255,255,.13);color:#fff}
  #side a.nav.on::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
  #side .ct{margin-left:auto;background:var(--accent);color:#fff;font-size:11px;font-weight:800;border-radius:999px;min-width:20px;height:20px;line-height:20px;text-align:center;padding:0 6px}
  #side a.newbtn{display:flex;align-items:center;justify-content:center;gap:8px;margin:18px 4px 0;background:var(--accent);color:#fff;text-decoration:none;font-weight:800;border-radius:12px;padding:11px;font-size:14.5px}
  #side a.newbtn:hover{background:var(--accent2)}
  #side a.newbtn.sec{margin-top:8px;background:none;border:1.5px solid #3a5a72;color:#e6eef4;padding:9px;font-size:14px}#side a.newbtn.sec:hover{background:rgba(255,255,255,.06)}
  #side .lbl-m{display:none}
  body.office .own{display:none!important}
  .side-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid rgba(255,255,255,.1);font-size:12px;color:#8fa6b8}
  .side-foot button{background:none;border:0;color:#c4d5e2;font:inherit;font-weight:600;padding:6px 0;cursor:pointer;display:flex;align-items:center;gap:8px}
  #wrap{margin-left:var(--side);min-height:100vh}
  #top{position:sticky;top:0;z-index:10;background:rgba(243,246,249,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:flex;align-items:center;gap:10px;padding:14px 32px;border-bottom:1px solid var(--line)}
  #top h1{flex:1;margin:0;font-size:21px;letter-spacing:-.01em;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #top .ib{position:relative;display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--line2);background:#fff;color:var(--navy);cursor:pointer}
  #bellN{position:absolute;top:-6px;right:-6px;background:#e5484d;color:#fff;border-radius:999px;font-size:11px;font-weight:800;min-width:18px;height:18px;line-height:18px;padding:0 4px;text-align:center}
  #mlogout{display:none}
  main{max-width:1200px;margin:0 auto;padding:24px 32px 60px}
  body.out #side,body.out #top{display:none}
  body.out #wrap{margin-left:0}
  @media (max-width:899px){
    #side{top:auto;right:0;width:auto;height:calc(62px + env(safe-area-inset-bottom));flex-direction:row;padding:0 2px env(safe-area-inset-bottom);border-top:1px solid #0a2232;box-shadow:0 -4px 16px rgba(13,42,63,.12)}
    .brand,.side-foot,#side .lbl-long{display:none}#side .lbl-m{display:inline}
    #side a.nav{flex:1;flex-direction:column;justify-content:center;gap:3px;padding:6px 2px;margin:0;font-size:10.5px;border-radius:0}
    #side a.nav.on{background:none;color:#fff}#side a.nav.on::before{left:30%;right:30%;top:0;bottom:auto;width:auto;height:3px;border-radius:0 0 3px 3px}
    #side .ct{position:absolute;top:4px;left:calc(50% + 6px);margin:0;min-width:17px;height:17px;line-height:17px;font-size:10px;padding:0 4px}
    #side a.newbtn{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));margin:0;width:56px;height:56px;border-radius:18px;padding:0;box-shadow:0 8px 22px rgba(232,101,10,.45)}
    #side a.newbtn span{display:none}#side a.newbtn svg{width:26px;height:26px}#side a.newbtn.sec{display:none}
    #side a.nav{font-size:10px}
    body.v-new #side a.newbtn,body.v-detail #side a.newbtn{display:none}
    #wrap{margin-left:0;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
    #top{padding:10px 16px}#top h1{font-size:18px}
    #mlogout{display:inline-flex}
    main{padding:14px 14px 40px}
  }

  /* ---------- notices ---------- */
  #npanel{position:fixed;top:64px;right:16px;left:16px;max-width:420px;margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh2);z-index:30;max-height:70vh;overflow:auto}
  #npanel .ev{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:#fff;padding:12px 16px;font:inherit;color:var(--ink);cursor:pointer}
  #npanel .ev{position:relative}#npanel .ev.unread{background:#fff7ef;font-weight:700;padding-left:28px}#npanel .ev.read{color:#5d6d7a}
  #npanel .ndot{position:absolute;left:12px;top:18px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
  #npanel .nhead{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:8px;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;font-size:13px}#npanel .nhead span{color:var(--muted)}
  #npanel .nhead button{margin-left:auto;border:0;background:none;color:var(--navy);font:inherit;font-weight:800;text-decoration:underline;cursor:pointer;padding:4px 0}
  #npanel .ev.unread small{font-weight:400}#npanel .ev .nb{display:block;font-weight:400;font-size:13px;color:#47525c;margin-top:1px}#npanel .ev small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
  #toast{display:flex;align-items:center;gap:12px;position:fixed;left:16px;right:16px;bottom:24px;max-width:440px;margin:0 auto;background:var(--navy);color:#fff;border-radius:14px;padding:13px 16px;z-index:40;box-shadow:var(--sh2);font-weight:600;cursor:pointer}
  @media (max-width:899px){#toast{bottom:calc(84px + env(safe-area-inset-bottom))}}

  /* ---------- building blocks ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:var(--sh)}
  .card h3{margin:0 0 12px;font-size:15px;color:var(--navy);display:flex;align-items:center;gap:8px}
  .card h3 .sub{margin-left:auto;font-size:13px;font-weight:600;color:var(--muted)}
  .sec-h{display:flex;align-items:baseline;gap:10px;margin:6px 2px 10px}.sec-h h2{margin:0;font-size:16px;color:var(--navy)}.sec-h .muted{margin-left:auto}
  .cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
  @media (max-width:1099px){.cols{grid-template-columns:minmax(0,1fr)}}
  .muted{color:var(--muted);font-size:13px}
  .st{font-size:11px;font-weight:800;border-radius:999px;padding:4px 10px;white-space:nowrap;text-transform:uppercase;letter-spacing:.02em;justify-self:end}
  .st.new{background:#fff1e6;color:#c2560a}.st.sent{background:#e8f0fb;color:var(--blue)}.st.signed{background:#e6f5ec;color:var(--green)}
  .st.declined,.st.cancelled{background:#fdecec;color:var(--red)}.st.done{background:#eceff2;color:#47525c}
  table{width:100%;border-collapse:collapse}
  td{padding:8px 0;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
  tr:last-child td{border-bottom:0}
  td:first-child{color:var(--muted);width:38%;padding-right:10px}
  label.f{display:block;font-weight:700;font-size:13px;margin:12px 0 5px;color:#33434f}
  input,textarea,select{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1.5px solid var(--line2);border-radius:10px;background:#fff;color:var(--ink)}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(13,42,63,.1)}
  textarea{min-height:76px;resize:vertical}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:10px}
  @media (max-width:520px){.row3{grid-template-columns:1fr 1fr}.row3>:first-child{grid-column:1/-1}}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-size:15px;font-weight:800;background:var(--accent);color:#fff;margin-top:10px;text-align:center;text-decoration:none;cursor:pointer}
  .btn:hover{background:var(--accent2)}.btn:disabled{opacity:.6;cursor:default}
  .btn.sec{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}.btn.sec:hover{background:#f2f6f9}
  .btn.gray{background:#eceff2;color:#47525c}.btn.gray:hover{background:#e2e7eb}
  .btn.red{background:#fff;color:var(--red);border:1.5px solid #f0c4c0}.btn.red:hover{background:#fff6f5}
  .btn.sm{width:auto;padding:8px 14px;font-size:13.5px;margin:0;border-radius:10px}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
  .chips button{white-space:nowrap;border:1px solid var(--line2);background:#fff;border-radius:999px;padding:7px 13px;font:inherit;font-size:13px;font-weight:600;color:var(--navy);cursor:pointer}
  .chips button.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .chips.ltf{padding-top:0;margin-top:-4px}.chips.ltf button{font-size:12px;padding:5px 10px;border-style:dashed}.chips.ltf button.on{border-style:solid}
  .tag.lt{background:#eef0fb;color:#3d3fa8}
  .cphi{position:relative}.cphi button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(13,42,63,.75);color:#fff;font-size:12px;cursor:pointer}
  .aibox{margin-top:12px;background:#f4f7fb;border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px;font-size:14px}.aibox small{display:block;color:var(--muted);font-size:11.5px;font-weight:700}.aih{font-size:15px}
  .ctab{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}.ctab td{padding:7px 0;border-top:1px solid var(--line);vertical-align:top}.ctab td:first-child{color:var(--muted);width:38%;padding-right:10px}.ctab td:last-child{white-space:pre-wrap;word-break:break-word}
  .cex{display:flex;flex-wrap:wrap;gap:6px}.cex label{display:flex;flex:none;max-width:100%;white-space:nowrap;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:10px;padding:6px 10px;font-size:13.5px;font-weight:600;cursor:pointer}
  .cedit{margin-top:12px;padding-top:4px;border-top:1px solid var(--line)}
  .selbox{position:absolute;left:2px;right:2px;background:rgba(255,122,26,.18);border:2px dashed var(--accent);border-radius:8px;z-index:3;font-size:12px;font-weight:800;color:#a34500;padding:2px 6px;pointer-events:none}
  .wk-col{touch-action:pan-y}
  .card.qn{max-width:560px;width:100%;max-height:92vh;overflow:auto}.qn .btns{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:8px}.qn .btns .btn{margin:0}.qn .seg{margin-bottom:6px}
  .qn_crew{display:flex;flex-wrap:wrap;gap:6px}.qn_crew label{display:flex;align-items:center;gap:6px;border:1px solid var(--line2);border-left:4px solid var(--c);border-radius:10px;padding:6px 10px;font-size:13.5px;font-weight:600;cursor:pointer}
  .nbtns{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:8px;margin-top:6px}@media (max-width:640px){.nbtns{grid-template-columns:1fr 1fr}.nbtns #n_send{grid-column:1/-1;order:-1}}
  .ostat{display:flex;gap:6px 16px;flex-wrap:wrap;align-items:baseline;margin:0 2px 12px;font-size:13.5px;color:#47525c}.ostat b{color:var(--navy);font-size:15px}.ostat small{color:var(--muted);margin-left:auto}
  .selbar{display:flex;gap:8px;align-items:center;margin:0 0 10px;flex-wrap:wrap}
  .item.sel{position:relative;padding-left:44px}.item.sel::before{content:"";position:absolute;left:14px;top:50%;width:20px;height:20px;margin-top:-10px;border:2px solid var(--line2);border-radius:6px;background:#fff}
  .item.sel.on{border-color:var(--accent);background:#fff8f2}.item.sel.on::before{content:"✓";color:#fff;background:var(--accent);border-color:var(--accent);font-weight:900;font-size:14px;line-height:20px;text-align:center}
  .bulkbar{position:sticky;bottom:12px;z-index:8;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--navy);color:#fff;border-radius:14px;padding:10px 12px;margin-top:12px;box-shadow:var(--sh2)}
  .bulkbar b{margin-right:auto}.bulkbar.dim{opacity:.6}
  @media (max-width:899px){ .bulkbar{bottom:78px} }
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:#eef2f5;color:#4a5a67}
  .tag.seen{background:#e8f1fb;color:#1d5fa8}.tag.ok{background:#e6f5ec;color:var(--green)}.tag.no{background:#fdecec;color:var(--red)}.tag.wn{background:#fff4e5;color:#8a4b00}
  .who{white-space:nowrap;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:2px 9px 2px 7px;border-radius:999px;background:color-mix(in srgb,var(--c) 12%,#fff);color:color-mix(in srgb,var(--c) 80%,#000)}
  .who::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
  .who.v{border-radius:6px}.who.v::before{border-radius:2px}
  .warn{background:#fff4e5;border:1px solid #ffd6a8;color:#8a4b00;border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}
  .okmsg{background:#e6f5ec;border:1px solid #bfe5cf;color:var(--green);border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0;font-weight:600}
  .err{color:var(--red);font-weight:600;font-size:14px;margin-top:8px}
  .empty{text-align:center;color:var(--muted);padding:34px 10px}
  .back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--navy);font:inherit;font-weight:700;font-size:14px;padding:0 0 12px;cursor:pointer}
  .dbox{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;background:#fafcfd}
  .xrow{display:flex;gap:6px;margin:6px 0}.xrow input:first-child{flex:1;min-width:0}.xrow input[type=number]{width:100px}.xrow button{border:1px solid var(--line);background:#fff;border-radius:10px;width:42px;color:var(--red);cursor:pointer}
  .sugg{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:6px}.sugg button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:#fff;padding:9px 12px;font:inherit;cursor:pointer}.sugg small{display:block;color:var(--muted);font-size:12px}
  a.hist{display:block;padding:8px 0;border-bottom:1px solid var(--line);color:var(--navy);text-decoration:none}
  .acw{position:relative}.acl{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh2);z-index:6;overflow:hidden}
  .acl button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:#fff;padding:9px 12px;font:inherit;cursor:pointer}.acl small{display:block;color:var(--muted);font-size:12px}
  .hist div{font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line)}
  .srch{display:flex;gap:8px;margin-bottom:12px}.srch input{flex:1;min-width:0}.srch select{width:auto;flex:0 0 auto}
  .login{max-width:400px;margin:0 auto;padding:12vh 16px 40px}
  .login .logo{display:flex;justify-content:center;margin-bottom:22px}.login .logo img{height:44px}

  /* ---------- booking rows ---------- */
  .item{display:grid;grid-template-columns:minmax(0,1fr) 170px 110px 128px;gap:14px;align-items:center;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 16px;margin-bottom:8px;color:inherit;font:inherit;cursor:pointer;box-shadow:var(--sh);transition:border-color .12s,box-shadow .12s}
  .item:hover{border-color:#b9c8d4;box-shadow:0 4px 14px rgba(13,42,63,.08)}
  .item b{font-size:15.5px}
  .item .when{font-size:13.5px;font-weight:600;color:#33434f}.item .when small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
  .item .price{font-weight:800;text-align:right;white-space:nowrap}
  .item .crew{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  /* rows switch to a compact layout whenever their column is narrow (half-width columns, phones) */
  .cols>div,#items{container-type:inline-size;min-width:0}
  @container (max-width:720px){
    .item{grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:12px 14px}
    .item .when{grid-row:2;grid-column:1/-1}.item .when small{display:inline;margin-left:6px}
    .item .price{grid-row:3;grid-column:1;text-align:left;font-weight:700;font-size:14px}
    .item .st{grid-row:1;grid-column:2}
  }

  /* ---------- today ---------- */
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
  @media (max-width:899px){.kpis{grid-template-columns:1fr 1fr;gap:8px}}
  .kpi{border-radius:16px;padding:14px 16px;color:#fff;text-decoration:none;display:block}.kpi small{display:block;font-size:12.5px;opacity:.92;font-weight:600}.kpi b{font-size:26px;line-height:1.25}
  .kpi.lt{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:var(--sh)}.kpi.lt small{color:var(--muted);opacity:1}
  .kpi.alert{border-color:#ffd6a8;background:#fff8f0}.kpi.alert b{color:#c2560a}

  /* ---------- today: to-do and staff ---------- */
  .todo-g{margin-bottom:12px}.todo-g:last-child{margin-bottom:0}
  .todo-h{font-weight:800;font-size:13.5px;color:#33434f;margin:2px 0 4px;display:flex;align-items:center;gap:8px}
  .todo{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
  .todo a{flex:1;min-width:0;text-decoration:none;color:var(--ink)}.todo a b{display:block;font-size:14.5px}.todo a small{display:block;color:var(--muted);font-size:12.5px}
  .crewday{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
  .crewday>div{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:8px 10px}
  .crewday b{display:block;font-size:14px}.crewday small{color:var(--green);font-weight:700;font-size:12.5px}
  .crewday a{display:block;font-size:12.5px;color:var(--ink);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.crewday a:hover{text-decoration:underline}

  .phgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;margin-top:10px}
  .phgrid>div{position:relative;aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:#eef2f5}
  .phgrid img{width:100%;height:100%;object-fit:cover;display:block}
  .phgrid span{position:absolute;left:4px;bottom:4px;background:rgba(13,42,63,.8);color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px}
  .phgrid span.damage{background:var(--red)}

    <button class="ib" id="bell" aria-label="Notiser"><svg class="i" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span id="bellN" hidden></span></button>

<script>
(function(){
  const $=(s,el=document)=>el.querySelector(s);
  const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  // Formatters are made once – creating one per call made long lists slow on phones.
  const NF=new Intl.NumberFormat('sv-SE'), DF=new Intl.DateTimeFormat('sv-SE',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'}), DFM=new Map();
  const kr=(n)=>n==null?'–':NF.format(Math.round(n))+' kr';
  const CAP=10;
  const ST={new:'Ny',sent:'Offert skickad',signed:'Signerad',declined:'Nekad',done:'Klar',cancelled:'Avbokad'};
  const ago=(t)=>{ if(!t) return ''; const m=Math.round((Date.now()-t)/6e4); if(m<2) return 'just nu'; if(m<60) return m+' min sedan'; const h=Math.round(m/60); if(h<24) return h+' tim sedan'; const d=Math.round(h/24); return d===1?'i går':d+' dagar sedan'; };
  const fmtDate=(d)=>{ if(!/^\d{4}-\d{2}-\d{2}$/.test(d||'')) return 'Inget datum'; let v=DFM.get(d); if(!v){ v=DF.format(new Date(d+'T12:00:00Z')); DFM.set(d,v); } return v; };
  const TIMES=[];for(let h=7;h<=18;h++){TIMES.push(String(h).padStart(2,'0')+':00');if(h<18)TIMES.push(String(h).padStart(2,'0')+':30');}
  const timeOpts=(cur)=>'<option value="">Ingen tid</option>'+TIMES.map(t=>`<option${t===cur?' selected':''}>${t}</option>`).join('')+(cur&&!TIMES.includes(cur)?`<option selected>${cur}</option>`:'');
  const fmtTs=(t)=>t?new Date(t).toLocaleString('sv-SE',{dateStyle:'short',timeStyle:'short'}):'';
  let todayC=['',0]; const today=()=>{ const n=Date.now(); if(n-todayC[1]>30000) todayC=[new Date(n).toLocaleDateString('sv-SE'),n]; return todayC[0]; };
  const addDays=(d,n)=>{ const x=new Date(d+'T12:00:00Z'); x.setUTCDate(x.getUTCDate()+n); return x.toISOString().slice(0,10); };
  const resById=(id)=>res.find(r=>r.id===id);
  const whoChip=(r)=>`<span class="who${r.kind==='vehicle'?' v':''}" style="--c:${esc(r.color)}">${esc(r.name)}</span>`;
  const crewChips=(b)=>(b.crew||[]).map(resById).filter(Boolean).sort((x,y)=>x.kind.localeCompare(y.kind)).map(whoChip).join('');
  const whenTxt=(b)=>{ const s=S.span(b); return !s?'':s.allDay?'Ingen starttid':S.fmtMin(s.start)+'–'+S.fmtMin(s.end); };
  const fmtH=(h)=>String(h).replace('.',',')+' tim';
  const tel=(p)=>'tel:'+String(p||'').replace(/[^\d+]/g,'').replace(/^0/,'+46');
  const root=$('#root');
  const S=window.FXSchedule;
  let newPrefill=null, lastNav='', me=null, repriceAsk=false;
  function applyRole(){
    document.body.classList.toggle('office',!!me&&me.role!=='owner');
    $('#whoami').innerHTML=me?`<b style="color:#fff">${esc(me.name)}</b> · ${me.role==='owner'?'Ägare':'Kontor'}`:'';
  }
  let absAll=[], fleet={fleet:{v:{},log:[]},due:[],year:{},month:{}}, dmgAll=[], vehOpen=null;
  let res=[], teamKind='person', teamEdit=null, showArch=false, openRes=null;
  let all=[], view='today', filter='active', calMonth=today().slice(0,7), calDay=null, q='', sortBy='created', statPeriod='12';

  async function api(path,opt={}){
    const r=await fetch(path,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});
    const j=await r.json().catch(()=>({}));
    if(r.status===401){ showLogin(); throw new Error('Logga in igen'); }
    if(!r.ok) { const e=new Error(j.error||('Fel '+r.status)); e.data=j; throw e; }
    return j;
  }

  // ---------- login ----------
  async function start(){
    const s=await fetch('/api/admin/login').then(r=>r.json()).catch(()=>({}));
    if(s.admin){ me=s.user; document.body.classList.remove('out'); applyRole(); await load(); route(); startNotices(); healPush(); Promise.all([loadMail(),loadKlag(),loadTeam()]).catch(()=>{}).then(()=>autoSyncMail()); }
    else showLogin(s.setup);
  }
  function showLogin(setup){
    document.body.classList.add('out'); view='login';
    const miss=setup?[!setup.password&&'Lösenord (ADMIN_PASSWORD)',!setup.storage&&'Lagring (Upstash Redis)',!setup.mail&&'E-post (SMTP)'].filter(Boolean):[];
    root.innerHTML=`<div class="login"><div class="logo"><img src="/fxflytt-logo.svg" alt="FX Flytt"></div><div class="card"><h3 style="font-size:20px">Logga in i admin</h3>
      ${miss.length?`<div class="warn">Saknas i Vercel: ${esc(miss.join(', '))}</div>`:''}
      <label class="f" for="un">E-post <span class="muted" style="font-weight:500">(eller användarnamn för personal)</span></label><input id="un" type="text" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="info@fxflytt.se">
      <label class="f" for="pw">Lösenord</label><input id="pw" type="password" autocomplete="current-password">
      <button class="btn" id="go">Logga in</button><div class="err" id="err"></div></div></div>`;
    const go=async()=>{ $('#err').textContent='';
      const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#un').value,password:$('#pw').value})});
      const j=await r.json().catch(()=>({}));
      if(r.ok){ start(); } else $('#err').textContent=j.error||'Fel';
    };
    $('#go').onclick=go; $('#pw').onkeydown=(e)=>{ if(e.key==='Enter') go(); }; $('#un').onkeydown=(e)=>{ if(e.key==='Enter') $('#pw').focus(); };
  }
  const logout=async()=>{ await fetch('/api/admin/login',{method:'DELETE'}); location.hash=''; showLogin(); };
  $('#logout').onclick=logout; $('#mlogout').onclick=()=>{ if(confirm('Logga ut?')) logout(); };

  // First time: every booking. After that (every 30 s): only bookings changed since the last time.
  let syncedAt=0;
  async function load(){
    const [j,t,ab,fl_,dm_,nt_]=await Promise.all([api('/api/admin/bookings'+(syncedAt?'?since='+syncedAt:'')),api('/api/admin/team').catch(()=>({resources:res})),api('/api/admin/absence').catch(()=>({absences:absAll})),api('/api/admin/fleet').catch(()=>fleet),api('/api/admin/damage').catch(()=>({damages:dmgAll})),api('/api/admin/notes').catch(()=>feed)]);
    feed=nt_||feed;
    absAll=ab.absences||[]; fleet=fl_; dmgAll=dm_.damages||[];
    if(j.partial){ for(const b of j.bookings||[]){ const i=all.findIndex(x=>x.id===b.id); if(i>=0) all[i]=b; else all.unshift(b); }
      if(j.deleted?.length) all=all.filter(b=>!j.deleted.includes(b.id)); }
    else all=j.bookings||[];
    load.changed=!!(j.partial&&((j.bookings||[]).length||(j.deleted||[]).length));
    syncedAt=j.now||Date.now(); res=t.resources||[]; updateBell(); updateCounts();
  }
  // Sidebar badges: new requests, and booked jobs in the next 14 days that have nobody assigned.
  const needsCrew=(b)=>b.status==='signed'&&b.date&&b.date>=today()&&b.date<=addDays(today(),14)&&!(b.crew||[]).length;
  function updateCounts(){
    const set=(id,n)=>{ const e=$(id); e.hidden=!n; e.textContent=n>99?'99+':String(n); };
    set('#ctNew',all.filter(b=>b.status==='new').length);
    set('#ctCrew',all.filter(needsCrew).length+absAll.filter(a=>a.status==='pending').length+dmgAll.filter(d=>d.status==='new').length+(fleet.due||[]).filter(x=>x.late).length);
  }

  // ---------- notices: the same as the push notifications, kept on the server (fx:notes) ----------
  // Read state is per user on the server, so the phone and the computer agree.
  let feed={notes:[],read:{all:0,ids:[]}};
  // A short two-tone sound for new notices (only when the user turned it on).
  function beep(){ try{ const C=window.AudioContext||window.webkitAudioContext; const c=beep.c||(beep.c=new C()); const t=c.currentTime;
    [[880,0],[1320,0.16]].forEach(([f,d])=>{ const o=c.createOscillator(), g=c.createGain(); o.frequency.value=f; o.type='sine'; g.gain.setValueAtTime(0.0001,t+d); g.gain.exponentialRampToValueAtTime(0.25,t+d+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+d+0.14); o.connect(g).connect(c.destination); o.start(t+d); o.stop(t+d+0.16); }); }catch(_){} }
  const hashOf=(url)=>{ const u=String(url||''); return u.startsWith('/admin')?(u.split('#')[1]||''):null; };
  function events(){ return (feed.notes||[]).map(n=>({t:n.at,id:n.id,url:n.url,txt:n.title,body:n.body})); }
  let newestSeenInSession=0;
  const isUnread=(e)=>e.t>(feed.read.all||0)&&!(feed.read.ids||[]).includes(e.id);
  const markNote=async(body)=>{ try{ feed.read=(await api('/api/admin/notes',{method:'POST',body:JSON.stringify(body)})).read; }catch(_){} updateBell(); };
  function updateBell(){
    const bell=$('#bell'); if(!bell) return;
    const n=events().filter(isUnread).length, c=$('#bellN');
    c.hidden=!n; c.textContent=n>9?'9+':String(n);
    document.title=(n?`(${n}) `:'')+'Admin – FX Flytt';
    try{ if(navigator.setAppBadge) n?navigator.setAppBadge(n):navigator.clearAppBadge(); }catch(_){}
  }
  function toast(msg,id){
    const t=$('#toast'); t.textContent=msg; t.hidden=false; t.onclick=()=>{ t.hidden=true; if(id) location.hash=id; };
    clearTimeout(toast.h); toast.h=setTimeout(()=>{ t.hidden=true; },8000);
  }
  function startNotices(){
    if(startNotices.on) return; startNotices.on=true;
    newestSeenInSession=Math.max(0,...events().map(e=>e.t));
    const drawPanel=()=>{
      const p=$('#npanel'), ev=events(), n=ev.filter(isUnread).length;
      p.innerHTML=ev.length?`<div class="nhead"><b>Notiser</b>${n?`<span>${n} olästa</span><button id="nall">Markera alla som lästa</button>`:'<span>Allt är läst ✓</span>'}</div>`
        +ev.map(e=>{ const u=isUnread(e); return `<button class="ev${u?' unread':' read'}" data-n="${esc(e.id)}">${u?'<i class="ndot"></i>':''}${esc(e.txt)}${e.body?`<span class="nb">${esc(e.body)}</span>`:''}<small>${esc(ago(e.t))}${u?'':' · Öppnad ✓'}</small></button>`; }).join('')
        :'<div class="empty">Inga notiser än.</div>';
      p.querySelectorAll('.ev').forEach(x=>x.onclick=()=>{ const e=ev.find(y=>y.id===x.dataset.n); p.hidden=true; if(isUnread(e)){ feed.read.ids=[...(feed.read.ids||[]),e.id]; updateBell(); markNote({id:e.id}); }
        const h=hashOf(e.url); if(h!==null) location.hash=h; else if(e.url) location.href=e.url; });
      if($('#nall')) $('#nall').onclick=async(e)=>{ e.stopPropagation(); feed.read={all:Date.now(),ids:[]}; updateBell(); drawPanel(); await markNote({all:true}); };
    };
    $('#bell').onclick=()=>{
      const p=$('#npanel'); if(!p.hidden){ p.hidden=true; return; }
      drawPanel(); p.hidden=false;
    };
    document.addEventListener('click',(e)=>{ const p=$('#npanel'); if(!p.hidden&&!p.contains(e.target)&&e.target.id!=='bell'&&!$('#bell').contains(e.target)) p.hidden=true; });
    // Check for news every 30 seconds while the page is open and visible – and at once when the app is opened again.
    let lastTick=0;
    const tick=async()=>{
      if(document.visibilityState!=='visible'||Date.now()-lastTick<5000) return; lastTick=Date.now();
      try{ await load(); }catch(_){ return; }
      autoSyncMail();
      const fresh=events().filter(e=>e.t>newestSeenInSession);
      if(fresh.length&&feed.prefs?.sound) beep();
      if(fresh.length){ newestSeenInSession=fresh[0].t; toast(`${fresh[0].txt}${fresh.length>1?` (+${fresh.length-1} till)`:''}`,hashOf(fresh[0].url)); }
      if(fresh.length||load.changed){ if((view==='list'||view==='offers')&&document.activeElement?.id!=='q') showList(); else if(view==='today') showToday(); else if(view==='cal'&&!dragging) showCal(); }
      if(!$('#npanel').hidden) drawPanel();
    };
    setInterval(tick,30000);
    document.addEventListener('visibilitychange',tick); window.addEventListener('focus',tick);
  }
  const signedOn=(d)=>all.filter(b=>(b.status==='signed'||b.status==='done')&&b.date===d);

  // ---------- routing ----------
  function route(){
    const id=location.hash.slice(1);
    if(/^FX\d{6}-[0-9A-F]{6}$/.test(id)) return showDetail(id);
    if(id==='ny'){ newMode='offer'; return showNew(); }
    if(id==='ny-bokning'){ newMode='booking'; return showNew(); }
    if(id==='offerter'){ listSec='offers'; return showList(); }
    if(id==='ai'){ inboxTab='team'; return showInbox(); }
    if(id==='rapporter'){ inboxTab='nils'; return showInbox(); }
    // Coming from the menu or a link: show the list, not the e-mail/complaint that was open last time (unless a button asked for it).
    if(id==='inkorg'){ inboxTab='mail'; if(!ibKeep) mailOpen=null; ibKeep=false; return showInbox(); }
    if(id==='klagomal'){ inboxTab='klag'; if(!ibKeep){ klagOpen=null; klagNew=false; } ibKeep=false; return showInbox(); }
    if(id==='saljaren'){ inboxTab='sales'; return showInbox(); }
    if(id==='kalender') return showCal();
    if(id==='statistik'&&isOwner()) return showStats();
    if(id==='personal') return showTeam();
    if(id==='franvaro'){ teamKind='abs'; return showTeam(); }
    if(id==='fordon'){ teamKind='vehicle'; return showTeam(); }
    if(id==='skador'){ teamKind='dmg'; return showTeam(); }
    if(id==='installningar') return showSettings();
    if(id==='statistik'&&!isOwner()) return showToday();
    if(id==='bokningar'){ listSec='bookings'; return showList(); }
    return showToday();
  }
  window.addEventListener('hashchange',()=>{ Promise.resolve().then(route).catch(()=>{}); });
  // Marks the menu item and sets the page title. Returns '' so the views can keep `navBar(x)+…`.
  const TITLES={today:'Idag',offers:'Offerter',inbox:'AI-team',list:'Bokningar',cal:'Kalender',team:'Personal och fordon',stat:'Statistik',new:'Ny offert',newb:'Ny bokning',set:'Inställningar'};
  function navBar(active,title){
    document.querySelectorAll('#side a.nav').forEach(a=>a.classList.toggle('on',a.dataset.v===active));
    $('#title').textContent=title||TITLES[active]||'';
    document.body.className=(title?'v-detail':'v-'+active)+(me&&me.role!=='owner'?' office':'');
    const key=active+'|'+(title||''); if(key!==lastNav){ window.scrollTo(0,0); lastNav=key; }
    return '';
  }
  function bindNav(){}

  // ---------- list ----------
  // An offer that was sent but not answered counts as expired ("förfallen") after 14 days, or when the moving day has come.
  const EXPIRE_DAYS=14;
  // Chance to win an open offer – a rough guide for whom to call first (not a promise).
  // Built from what the customer did: opened the offer, how often and how lately, what the last call said.
  function winChance(b){
    if(!['new','sent'].includes(b.status)||b.signedAt) return null;
    if(b.date&&b.date<today()) return 5;
    const last=(b.calls||[]).slice(-1)[0], day=864e5, now=Date.now();
    if(last&&last.outcome==='notinterested') return 5;
    let p=b.status==='sent'?25:15;
    if(b.views){ p=50; if(b.views>=3) p+=10; if(b.lastViewAt&&now-b.lastViewAt<2*day) p+=10; }
    else if(b.sentAt&&now-b.sentAt>10*day) p-=10;
    if(last&&(last.outcome==='answered'||last.outcome==='callback')) p+=10;
    if(b.referral) p+=10;
    if(b.lead==='calc'&&b.status==='new') p=Math.max(p,20);
    const back=samePerson(b).some(x=>(x.status==='done'||x.status==='signed')&&digits((x.data||{}).phone)===digits((b.data||{}).phone));
    if(back) p+=10;
    if(b.sentAt&&now-b.sentAt>21*day&&!(b.lastViewAt&&now-b.lastViewAt<7*day)) p=Math.min(p,15);
    return Math.max(5,Math.min(90,Math.round(p/5)*5));
  }
  const chanceTag=(b)=>{ const c=winChance(b); return c==null?'':`<span class="tag ${c>=60?'ok':c>=30?'wn':''}" title="Chans att vinna – räknas från om kunden öppnat offerten, hur ofta och senaste samtalet">🎯 ${c}%</span>`; };
  const isExpired=(b)=>b.status==='sent'&&((b.sentAt&&Date.now()-b.sentAt>EXPIRE_DAYS*864e5)||(b.date&&b.date<=today()));
  const boxesLeft=(b)=>b.boxes?b.boxes.qty-b.boxes.returned:0;
  const rentsBoxes=(b)=>(b.offer?.lines||[]).some(l=>/kartong.*hyr/i.test(l.label))||(b.extras||[]).some(e=>b.extrasChosen?.includes(e.id)&&/kartong.*hyr/i.test(e.label))||(b.data?.extras||[]).some(x=>/kartong/i.test(x));
  // Offerter: requests and offers that are not booked yet. Bokningar: what the customer has said yes to.
  const OFFER_FILTERS={active:['Aktiva',b=>['new','sent'].includes(b.status)&&!isExpired(b)],new:['Nya',b=>b.status==='new'],sent:['Skickade',b=>b.status==='sent'&&!isExpired(b)],expired:['Förfallna',isExpired],declined:['Nekade',b=>b.status==='declined'],all:['Alla offerter',b=>['new','sent','declined'].includes(b.status)]};
  const BOOK_FILTERS={upcoming:['Kommande',b=>b.status==='signed'&&(!b.date||b.date>=today())],todo:['Att avsluta',b=>b.status==='signed'&&b.date&&b.date<today()],done:['Klara',b=>b.status==='done'],cancelled:['Avbokade',b=>b.status==='cancelled'],boxes:['Kartonger ute',b=>boxesLeft(b)>0],all:['Alla bokningar',b=>['signed','done','cancelled'].includes(b.status)]};
  let listShow=100, lastListView='', listSec='offers', bookFilter='upcoming', bookSort='date', newMode='offer', prevHash='', curHash=location.hash.slice(1);
  window.addEventListener('hashchange',()=>{ prevHash=curHash; curHash=location.hash.slice(1); });
  const FL=()=>listSec==='offers'?OFFER_FILTERS:BOOK_FILTERS;
  const curF=()=>listSec==='offers'?filter:bookFilter;
  function itemHtml(b){
    const o=b.offer, d=b.data||{};
    const route=[d.from,d.to].filter(Boolean).map(x=>String(x).split(',')[0]).join(' → ');
    const crew=crewChips(b), w=whenTxt(b);
    const t=tags(b)+(needsCrew(b)?'<div class="tags"><span class="tag wn">Saknar personal</span></div>':'');

        <details style="margin-top:10px"${m.text.length<1200?' open':''}><summary style="cursor:pointer;font-weight:700">Mejlet</summary><div style="white-space:pre-wrap;background:#f6f8fa;border-radius:12px;padding:12px;margin-top:8px;font-size:14px;max-height:420px;overflow:auto">${esc(m.text)||'<i>(tomt)</i>'}</div></details>

  function showKlag(){
    if(klagNew) return showKlagNew();
    if(klagOpen) return showKlagOne(klagOpen);
    const late=(c)=>c.status!=='closed'&&c.deadline<today();
    const F={open:['Öppna',c=>c.status!=='closed'],closed:['Avslutade',c=>c.status==='closed'],all:['Alla',()=>true]};
    const list=klagAll.filter(F[klagFilter][1]).sort((a,b)=>(klagFilter==='open'?(({high:0,medium:1,low:2}[a.severity])-({high:0,medium:1,low:2}[b.severity]))||a.deadline.localeCompare(b.deadline):0)||b.createdAt-a.createdAt);
    root.innerHTML=navBar('inbox','Klagomål')+`<main>${inboxTabs()}
      <div class="ostat"><span>⚠ <b>${klagAll.filter(c=>c.status!=='closed').length}</b> öppna</span><span><b>${klagAll.filter(c=>c.status!=='closed'&&c.severity==='high').length}</b> allvarliga</span>${klagAll.some(late)?`<span style="color:var(--red)"><b>${klagAll.filter(late).length}</b> försenade svar</span>`:''}</div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px"><div class="chips" style="margin:0">${Object.entries(F).map(([k,[l]])=>`<button data-f="${k}" class="${k===klagFilter?'on':''}">${l}</button>`).join('')}</div><button class="btn sm" id="k_new" style="margin-left:auto">+ Nytt klagomål</button></div>
      <div class="card" style="padding:6px 18px">${list.length?list.map(c=>`<div class="todo" data-k="${esc(c.id)}" style="cursor:pointer"><a>
        <b>${esc(c.name||c.email||'Okänd kund')} <span class="tag ${KSEV[c.severity][1]}">${KSEV[c.severity][0]}</span> <span class="tag">${esc(KCAT[c.category]||c.category)}</span>${c.status==='closed'?' <span class="tag ok">Avslutad</span>':c.status==='handling'?' <span class="tag seen">Hanteras</span>':''}</b>
        <small>${esc(c.summary||c.subject)}</small></a>
        <small style="white-space:nowrap;${late(c)?'color:var(--red);font-weight:700':''}" class="muted">${c.status==='closed'?esc(ago(c.updatedAt)):'Svara senast '+esc(fmtDate(c.deadline))}</small></div>`).join(''):'<div class="empty">Inga klagomål här.</div>'}</div>
      <div class="muted" style="margin-top:8px">Klagomål i info@ hamnar här av sig själva. ${esc(nm('maja'))} bedömer hur allvarligt det är och skriver ett svar – men lovar aldrig ersättning. Allvarliga svaras inom en arbetsdag, övriga inom tre.</div></main>`;
    bindInboxTabs();
    root.querySelectorAll('.chips [data-f]').forEach(x=>x.onclick=()=>{ klagFilter=x.dataset.f; showKlag(); });
    root.querySelectorAll('[data-k]').forEach(x=>x.onclick=()=>{ klagOpen=x.dataset.k; showKlag(); });
    $('#k_new').onclick=()=>{ klagNew=true; showKlag(); };
  }
  function showKlagNew(){
    root.innerHTML=navBar('inbox','Nytt klagomål')+`<main style="max-width:760px"><button class="back" id="back">‹ Klagomål</button>
      <div class="card"><h3>Nytt klagomål (t.ex. från ett samtal)</h3>
        <label class="f" for="kn_b">Bokningsnummer (om det finns)</label><input id="kn_b" placeholder="FX…-…">
        <div class="row2"><div><label class="f" for="kn_n">Kundens namn</label><input id="kn_n"></div><div><label class="f" for="kn_p">Telefon</label><input id="kn_p" inputmode="tel"></div></div>
        <label class="f" for="kn_e">E-post</label><input id="kn_e" type="email">
        <label class="f" for="kn_t">Vad klagar kunden på?</label><textarea id="kn_t" rows="6"></textarea>
        <button class="btn" id="kn_go">Spara – ${esc(nm('maja'))} bedömer det</button><div id="kn_msg"></div></div></main>`;
    $('#back').onclick=()=>{ klagNew=false; showKlag(); };
    $('#kn_go').onclick=async(e)=>{ ibBusy(e.target,true,nm('maja')+' bedömer…');
      try{ const c=await api('/api/admin/complaints',{method:'POST',body:JSON.stringify({bookingId:$('#kn_b').value,name:$('#kn_n').value,phone:$('#kn_p').value,email:$('#kn_e').value,text:$('#kn_t').value})});
        klagAll.unshift(c); klagNew=false; klagOpen=c.id; updateMailCount(); showKlag(); }
      catch(er){ ibBusy(e.target,false); ibMsg('#kn_msg',er.message); } };
  }
  function showKlagOne(id){
    const c=klagAll.find(x=>x.id===id); if(!c){ klagOpen=null; return showKlag(); }
    const b=c.bookingId?all.find(x=>x.id===c.bookingId):null;
    root.innerHTML=navBar('inbox','Klagomål')+`<main style="max-width:900px"><button class="back" id="back">‹ Klagomål</button>
      <div class="card"><h3>${esc(c.name||c.email||'Okänd kund')} <span class="tag ${KSEV[c.severity][1]}">${KSEV[c.severity][0]}</span></h3>
        <div class="muted">${esc(KCAT[c.category]||c.category)} · ${c.source==='email'?'via e-post':'registrerat av kontoret'} ${esc(fmtTs(c.createdAt))}${c.email?' · '+esc(c.email):''}${c.phone?` · <a href="${tel(c.phone)}">${esc(c.phone)}</a>`:''}</div>
        ${b?`<div class="muted">Bokning: <a href="#${esc(b.id)}"><b>${esc(b.data.name)}</b> · ${esc(b.id)} · flyttdag ${esc(fmtDate(b.date))}</a></div>`:`<div style="display:flex;gap:6px;margin-top:8px"><input id="k_bid" placeholder="Koppla till bokning: FX…-…" style="flex:1"><button class="btn gray sm" id="k_link">Koppla</button></div>`}
        ${c.summary?`<div class="okmsg" style="background:#eef3fb;border-color:#d3e0f3;color:#1d4f8a">✨ ${esc(c.summary)}</div>`:''}
        ${c.nextStep?`<div class="warn"><b>Nästa steg:</b> ${esc(c.nextStep)}</div>`:''}
        <div class="muted">${c.status==='closed'?'Avslutad':'Svara kunden senast <b>'+esc(fmtDate(c.deadline))+'</b>'}</div>
        <details style="margin-top:10px"><summary style="cursor:pointer;font-weight:700">Kundens klagomål</summary><div style="white-space:pre-wrap;background:#f6f8fa;border-radius:12px;padding:12px;margin-top:8px;font-size:14px;max-height:400px;overflow:auto">${esc(c.text)}</div></details>
      </div>
      ${c.status!=='closed'?`<div class="card"><h3>Svar till kunden</h3>
        <textarea id="k_txt" rows="10" placeholder="Skriv ett svar…">${esc(c.draft||'')}</textarea>
        <div class="muted" style="margin-top:4px">${c.draft?'✨ Utkast från '+esc(nm('maja'))+' – läs igenom. Lova inte ersättning innan ni har bestämt det.':''}</div>
        ${c.email?'<button class="btn" id="k_send">Skicka svar</button>':'<div class="warn">Kunden har ingen e-post – ring kunden.</div>'}
        <div id="k_msg"></div></div>`:''}
      <div class="card"><h3>Hantering</h3>
        <div class="row2"><div><label class="f" for="k_st">Status</label><select id="k_st">${Object.entries(KST).map(([k,l])=>`<option value="${k}"${k===c.status?' selected':''}>${l}</option>`).join('')}</select></div>
          <div><label class="f" for="k_sev">Allvar</label><select id="k_sev">${Object.entries(KSEV).map(([k,[l]])=>`<option value="${k}"${k===c.severity?' selected':''}>${l}</option>`).join('')}</select></div></div>
        <label class="f" for="k_res">Hur löstes det? (krävs för att avsluta)</label><input id="k_res" value="${esc(c.resolution||'')}" placeholder="t.ex. ”Ersatte lampan, 800 kr” eller ”Ingen ersättning – kunden nöjd med förklaringen”">
        <label class="f" for="k_note">Anteckning</label><input id="k_note" placeholder="t.ex. ”Ringde kunden, skickar bilder i kväll”">
        <button class="btn sec" id="k_save">Spara</button>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn gray sm" id="k_ai">✨ Be ${esc(nm('maja'))} bedöma igen</button>${b&&!c.damageId?'<button class="btn gray sm" id="k_dmg">🧾 Skapa skaderapport</button>':''}${c.damageId?'<a class="btn gray sm" href="#skador">Visa skaderapporten</a>':''}${c.mailId?'<button class="btn gray sm" id="k_mail">✉ Visa mejlet</button>':''}${isOwner()?'<button class="btn red sm" id="k_del">Ta bort</button>':''}</div>
        <div id="k_msg2"></div></div>
      <div class="card"><h3>Historik</h3>${c.log.slice().reverse().map(l=>`<div class="muted" style="padding:5px 0;border-top:1px solid var(--line);white-space:pre-wrap">${esc(fmtTs(l.at))} · <b>${esc(l.by)}</b> · ${esc(l.what)}</div>`).join('')}</div></main>`;
    const put=(nc)=>{ const i=klagAll.findIndex(x=>x.id===c.id); if(i>=0) klagAll[i]=nc; updateMailCount(); };
    const post=async(body,btn,label)=>{ ibBusy(btn,true,label); try{ const r=await api('/api/admin/complaints?id='+c.id,{method:'POST',body:JSON.stringify(body)}); put(r); return r; } finally{ ibBusy(btn,false); } };
    const patch=async(body)=>{ const r=await api('/api/admin/complaints?id='+c.id,{method:'PATCH',body:JSON.stringify(body)}); put(r); return r; };
    $('#back').onclick=()=>{ klagOpen=null; showKlag(); };
    if($('#k_link')) $('#k_link').onclick=async()=>{ try{ await patch({bookingId:$('#k_bid').value}); showKlagOne(c.id); }catch(er){ ibMsg('#k_msg2',er.message); } };

    if($('#k_mail')) $('#k_mail').onclick=()=>{ mailOpen=c.mailId; inboxTab='mail'; ibKeep=true; location.hash='inkorg'; };
    if($('#k_del')) $('#k_del').onclick=async()=>{ if(!confirm('Ta bort klagomålet för gott?')) return; try{ await api('/api/admin/complaints?id='+c.id,{method:'DELETE'}); klagAll=klagAll.filter(x=>x.id!==c.id); klagOpen=null; updateMailCount(); showKlag(); }catch(er){ ibMsg('#k_msg2',er.message); } };
  }

  // ---------- Översikt: the AI team as colleagues – who does what, today's plan (Nils) and what they have done ----------
  const AGENT_ICON={elsa:'✉',oskar:'🎯',maja:'🤝',nils:'📊'}, AGENT_TAB={elsa:'mail',oskar:'sales',maja:'klag',nils:'nils'}, AGENT_COLOR={elsa:'#1f5fae',oskar:'#e8650a',maja:'#1f8a4c',nils:'#6b4fbb'};

  async function showTeamAI(){
    root.innerHTML=navBar('inbox')+`<main>${inboxTabs()}<div id="tpane"><div class="empty">Laddar…</div></div></main>`; bindInboxTabs();
    await loadTeam(); const t=aiTeam; if(!t.team?.length){ $('#tpane').innerHTML='<div class="err">Kunde inte läsa AI-teamet.</div>'; return; }
    const A=t.auto||{}, mode=(on)=>on?'<span class="tag ok">Skickar själv</span>':'<span class="tag">Skriver utkast</span>';
    const status={
      elsa:`${mailAll.filter(mailTodo).length} mejl att svara · ${t.inbox?.lastSync?'läste '+esc(ago(t.inbox.lastSync)):'har inte läst än'}${t.inbox?.on===false?' · <b>avstängd</b>':''}`,
      oskar:`${(t.plan?.counts?.sales)||0} kunder att kontakta i dag`,
      maja:`${klagAll.filter(c=>c.status!=='closed').length} öppna klagomål${klagAll.some(c=>c.status!=='closed'&&c.deadline<today())?' · <b style="color:var(--red)">försenat svar</b>':''}`,
      nils:`${(t.plan?.items||[]).length} saker på dagens plan`,
    };
    const modes={elsa:mode(A.reply)+(A.request?' <span class="tag seen">Gör förfrågningar</span>':'')+(A.instant||A.instantSms?' <span class="tag seen">Svarar direkt</span>':''),oskar:mode(['followup','revive','calc','winback','upsell'].some(k=>A[k]))+(A.sms&&t.sms?' <span class="tag seen">📱 SMS</span>':''),maja:mode(A.ack),nils:'<span class="tag ok">Varje morgon</span>'};
    const P=t.plan||{items:[]};
    $('#tpane').innerHTML=`${t.test?`<div class="warn">🧪 <b>Testläge är på.</b> Allt teamet skickar går till ${esc(t.test.to)}${t.test.phone?' och SMS till '+esc(t.test.phone):' (SMS skickas inte)'} – inte till kunderna. Stäng av i Inställningar → AI-teamet.</div>`:''}${!t.ai?'<div class="warn">AI är inte inställt (ANTHROPIC_API_KEY i Vercel) – teamet kan inte läsa eller skriva än.</div>':''}
      <div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(230px,1fr))">${t.team.map(a=>`<a class="kpi lt" href="#" data-ag="${a.id}" style="display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;gap:12px;align-items:center">${avatar(a.id)}<div><b style="font-size:18px;display:block">${esc(a.name)}</b><small>${AGENT_ICON[a.id]} ${esc(a.role)}</small></div></div>

  // In the offer / booking: Oskar writes a sales e-mail of the kind that fits, and a call script.
  function closingKinds(b){
    const k=[], d=b.data||{}, day=864e5, age=b.sentAt?Date.now()-b.sentAt:0;

    if(!d.email) return k;
    if(b.status==='new'&&b.lead==='calc') k.push('calc');
    if(b.status==='declined'&&!b.nextId) k.push('winback');
    if(b.status==='signed') k.push('upsell');
    return k;
  }

  // ---------- calendar ----------
  // Three views on the same jobs:
  //   Månad    – overview, drag a job to another day
  //   Vecka    – hours, drag to move (day + time), drag the bottom edge to change the length
  //   Personal – one day, one row per person/vehicle; drag along the row to change the time,
  //              to another row to swap who does the job, the right edge to change the length
  // Dragging works with the mouse and, on phones, by holding a job for a moment first.
  const lsGet=(k,d)=>{ try{ return localStorage.getItem(k)??d; }catch(_){ return d; } };
  const lsSet=(k,v)=>{ try{ localStorage.setItem(k,v); }catch(_){} };
  let calView=lsGet('fx_calview','week'), calDate=today(), showPre=lsGet('fx_calpre','1')==='1', dragging=false, justDragged=false, lastCalView='';
  const OPEN=S.OPEN, CLOSE=S.CLOSE, HOURS=(CLOSE-OPEN)/60;
  const snap=(m)=>Math.round(m/30)*30;
  const clampStart=(m)=>Math.min(18*60,Math.max(OPEN,m));          // the server accepts 07:00–18:00
  const onCal=(b)=>b.date&&!S.INACTIVE.includes(b.status)&&(booked(b)||showPre);
  const colorOf=(b)=>{ const p=(b.crew||[]).map(resById).find(r=>r&&r.kind==='person'); return p?p.color:'#7a8b99'; };
  const byIdB=(id)=>all.find(x=>x.id===id);
  const weekStart=(d)=>addDays(d,-((new Date(d+'T12:00:00Z').getUTCDay()+6)%7));
  const isoWeek=(d)=>{ const x=new Date(d+'T12:00:00Z'), w=(x.getUTCDay()+6)%7; x.setUTCDate(x.getUTCDate()-w+3); const f=new Date(Date.UTC(x.getUTCFullYear(),0,4)); return 1+Math.round(((x-f)/864e5-3+((f.getUTCDay()+6)%7))/7); };
  const dfmt=(d,o)=>new Date(d+'T12:00:00Z').toLocaleDateString('sv-SE',{timeZone:'UTC',...o});
  const town=(a)=>String(a||'').split(',').pop().replace(/\d/g,'').trim();
  const evInner=(b,s)=>`<b>${s&&!s.allDay?S.fmtMin(s.start)+' ':''}${esc((b.data||{}).name||b.id)}</b><small>${esc([b.data?.from,b.data?.to].filter(Boolean).map(town).join(' → '))}</small>`;
  // Side-by-side columns for overlapping jobs: sets .lane and .n (lanes in its overlap group).
  function lanes(items){
    const out=[]; let group=[], end=-1;
    const flush=()=>{ const cols=[]; for(const it of group){ let i=cols.findIndex(e=>e<=it.s.start); if(i<0){ i=cols.length; cols.push(0); } cols[i]=it.s.end; it.lane=i; } group.forEach(it=>it.n=cols.length); out.push(...group); group=[]; };
    for(const it of items.sort((x,y)=>x.s.start-y.s.start||y.s.end-x.s.end)){ if(group.length&&it.s.start>=end) flush(); group.push(it); end=Math.max(end,it.s.end); }
    if(group.length) flush(); return out;
  }

  function notify(msg,undo){
    const t=$('#toast'); t.innerHTML=`<span>${esc(msg)}</span>${undo?'<button type="button" id="undo">Ångra</button>':''}`; t.hidden=false; t.onclick=()=>{ t.hidden=true; };
    if(undo) $('#undo').onclick=(e)=>{ e.stopPropagation(); t.hidden=true; undo(); };
    clearTimeout(toast.h); toast.h=setTimeout(()=>{ t.hidden=true; },8000);
  }

  // Saves a drag. Shows the result at once, rolls back on error, offers "Ångra".
  async function moveJob(b,changes,what,noAsk){
    const cur=(k)=>k==='crew'?(b.crew||[]):k==='durationH'?(b.durationH??null):(b[k]||'');
    const ch={}; for(const k in changes) if(JSON.stringify(changes[k])!==JSON.stringify(cur(k))) ch[k]=changes[k];
    if(!Object.keys(ch).length){ showCal(); return; }
    if(!noAsk&&b.status==='signed'&&('date' in ch||'time' in ch)&&!confirm(`${(b.data||{}).name} har redan signerat offerten (${fmtDate(b.date)}${b.time?' '+b.time:''}).\n\nFlytta ändå? Prata med kunden.`)){ showCal(); return; }
    const before={}; for(const k in ch) before[k]=cur(k);
    const i=all.findIndex(x=>x.id===b.id), old=all[i], opt={...b};
    for(const k in ch) opt[k]=k==='time'?(ch.time||undefined):k==='durationH'?(ch.durationH??undefined):ch[k];
    all[i]=opt; showCal();
    try{
      const nb=await api('/api/admin/bookings?id='+b.id,{method:'PATCH',body:JSON.stringify(ch)});
      const j=all.findIndex(x=>x.id===b.id); if(j>=0) all[j]=nb; const conflicts=S.conflicts(nb,all,res); updateCounts(); if(view==='cal'&&!dragging) showCal();
      const who=[...new Set((conflicts||[]).map(c=>c.name))];
      notify(who.length?`${what} – men ${who.join(', ')} är dubbelbokad`:`${what} ✓`,()=>moveJob(nb,before,'Ångrat',true));
    }catch(e){ const j=all.findIndex(x=>x.id===b.id); if(j>=0) all[j]=old; if(view==='cal') showCal(); notify(e.message); }
  }

  // Pointer-based drag: mouse starts after a few pixels, touch after holding ~0.3 s (so the page still scrolls).
  document.addEventListener('touchmove',(e)=>{ if(dragging) e.preventDefault(); },{passive:false});
  function enableDrag(scope,h){
    scope.querySelectorAll('[data-drag]').forEach(el=>{
      el.addEventListener('contextmenu',(e)=>e.preventDefault());
      el.addEventListener('pointerdown',(e)=>{
        if(e.button>0) return;
        const touch=e.pointerType!=='mouse', sx=e.clientX, sy=e.clientY, rz=!!e.target.closest('[data-rz]');
        let ctx=null, timer=null, lx=sx, ly=sy;
        if(!touch) e.preventDefault();
        const off=()=>{ clearTimeout(timer); document.removeEventListener('pointermove',mv); document.removeEventListener('pointerup',up); document.removeEventListener('pointercancel',cancel); };
        const begin=()=>{ ctx=h.start(el,{x:sx,y:sy,resize:rz}); if(!ctx) return off(); dragging=true; el.classList.add('lift'); if(touch&&navigator.vibrate) navigator.vibrate(12); h.move(ctx,lx,ly); };
        const mv=(ev)=>{ lx=ev.clientX; ly=ev.clientY;
          if(!ctx){ const d=Math.hypot(lx-sx,ly-sy); if(touch){ if(d>8) off(); } else if(d>4) begin(); return; }
          ev.preventDefault(); edgeScroll(lx,ly); h.move(ctx,lx,ly); };
        const up=()=>{ off(); if(!ctx) return; dragging=false; justDragged=true; setTimeout(()=>{ justDragged=false; },250); h.drop(ctx); };
        const cancel=()=>{ off(); if(!ctx) return; dragging=false; h.cancel(ctx); };
        if(touch) timer=setTimeout(begin,300);
        document.addEventListener('pointermove',mv); document.addEventListener('pointerup',up); document.addEventListener('pointercancel',cancel);
      });
    });
  }
  function edgeScroll(x,y){
    const xs=root.querySelector('.xs');
    if(xs){ const r=xs.getBoundingClientRect(); if(x<r.left+40) xs.scrollLeft-=14; else if(x>r.right-40) xs.scrollLeft+=14; }
    if(y<90) window.scrollBy(0,-14); else if(y>innerHeight-90) window.scrollBy(0,14);
  }
  const clearDrop=()=>{ root.querySelectorAll('.drop').forEach(x=>x.remove()); root.querySelectorAll('.hot').forEach(x=>x.classList.remove('hot')); };
  const dropBox=(parent,style,label)=>{ const d=document.createElement('div'); d.className='drop'; d.style.cssText=style; d.innerHTML=`<span>${esc(label)}</span>`; parent.appendChild(d); };
  const hit=(sel,x,y,useX=true)=>[...root.querySelectorAll(sel)].find(c=>{ const r=c.getBoundingClientRect(); return (!useX||(x>=r.left&&x<r.right))&&y>=r.top&&y<r.bottom; });
  const rangeTxt=(s,dur)=>S.fmtMin(s)+'–'+S.fmtMin(s+dur);

  // Quick new job from the calendar – a small window over the calendar, so a mistake is just "Avbryt".

      <div class="row2"><div><label class="f" for="qn_n">Namn *</label><input id="qn_n" autocomplete="off"></div><div><label class="f" for="qn_p">Telefon *</label><input id="qn_p" type="tel" autocomplete="off"></div></div>
      <div class="row2"><div><label class="f" for="qn_from">Från</label><input id="qn_from" placeholder="Gata och ort"></div><div><label class="f" for="qn_to">Till</label><input id="qn_to" placeholder="Gata och ort"></div></div>
      <div class="row2"><div><label class="f" for="qn_d">Datum</label><input id="qn_d" type="date" value="${esc(p.date)}"></div><div class="row2" style="gap:6px"><div><label class="f" for="qn_tm">Start</label><select id="qn_tm">${times.map(t=>`<option value="${t}"${t===(p.time||'')?' selected':''}>${t||'Ingen tid'}</option>`).join('')}</select></div><div><label class="f" for="qn_h">Timmar</label><input id="qn_h" type="number" min="1" max="14" step="0.5" value="${p.dur||''}" placeholder="4"></div></div></div>
      <label class="f" for="qn_tot">Pris efter RUT (kr, valfritt)</label><input id="qn_tot" type="number" inputmode="numeric">
      ${people.length||cars.length?`<label class="f">Personal och fordon</label><div class="qn_crew">${[...people,...cars].map(r=>`<label style="--c:${esc(r.color)}"><input type="checkbox" value="${esc(r.id)}"${pick.has(r.id)?' checked':''}> ${esc(r.name)}${absOn&&r.kind==='person'&&absOn(r.id,p.date).length?' ⛔':''}</label>`).join('')}</div>`:''}
      <div class="err" id="qn_err"></div>
      <div class="btns"><button class="btn gray" id="qn_x">Avbryt</button><button class="btn sec" id="qn_full">Öppna hela formuläret</button><button class="btn" id="qn_ok">Spara</button></div></div>`;
    document.body.appendChild(box);
    let type='booking'; const v=(id)=>box.querySelector('#'+id).value;
    box.querySelectorAll('#qn_t button').forEach(x=>x.onclick=()=>{ type=x.dataset.t; box.querySelectorAll('#qn_t button').forEach(y=>y.classList.toggle('on',y===x)); box.querySelector('#qn_ok').textContent=type==='offer'?'Spara utkast':'Spara'; });
    const close=()=>{ box.remove(); document.removeEventListener('keydown',esck); };
    const esck=(e)=>{ if(e.key==='Escape') close(); }; document.addEventListener('keydown',esck);
    box.onclick=(e)=>{ if(e.target===box) close(); };
    box.querySelector('#qn_x').onclick=close;
    box.querySelector('#qn_full').onclick=()=>{ newPrefill={origin:'cal',name:v('qn_n'),phone:v('qn_p'),from:v('qn_from'),to:v('qn_to'),date:v('qn_d'),time:v('qn_tm'),dur:v('qn_h'),total:v('qn_tot')};
      close(); location.hash=type==='offer'?'ny':'ny-bokning'; };
    box.querySelector('#qn_ok').onclick=async()=>{ const ok=box.querySelector('#qn_ok'); ok.disabled=true; box.querySelector('#qn_err').textContent='';
      const crew=[...box.querySelectorAll('.qn_crew input:checked')].map(x=>x.value);
      try{ let b=await api('/api/admin/bookings',{method:'POST',body:JSON.stringify({name:v('qn_n'),phone:v('qn_p'),from:v('qn_from'),to:v('qn_to'),date:v('qn_d'),time:v('qn_tm'),
          durationH:v('qn_h')?Number(v('qn_h')):undefined,total:v('qn_tot')||undefined,direct:type==='booking'})});
        if(crew.length) b=await api('/api/admin/bookings?id='+b.id,{method:'PATCH',body:JSON.stringify({crew})});
        all.unshift(b); updateCounts(); close(); calDate=b.date||calDate; showCal();
        toast((type==='offer'?'📄 Offerten':'✅ Bokningen')+' för '+b.data.name+' är sparad – tryck för att öppna',b.id);
      }catch(e){ ok.disabled=false; box.querySelector('#qn_err').textContent=e.message; } };
    setTimeout(()=>box.querySelector('#qn_n').focus(),30);
  }
  function showCal(){
    view='cal';

      const days=[]; for(let i=-startDow;i<42-startDow;i++) days.push(new Date(Date.UTC(y,m-1,1+i)).toISOString().slice(0,10));
      title=first.toLocaleDateString('sv-SE',{month:'long',year:'numeric',timeZone:'UTC'});
      const cells=days.map(d=>{
        const list=all.filter(b=>onCal(b)&&b.date===d).sort(byTime), n=signedOn(d).length, cls=n>=CAP?'full':n>=CAP-3?'mid':'';
        return `<div class="day${d.slice(0,7)!==mk?' out':''}${d===t?' today':''}${d===calDay?' sel':''}" data-d="${d}"><div class="dh"><span class="n">${Number(d.slice(8))}</span>${n?`<span class="c ${cls}">${n}</span>`:''}</div>

      }).join('');

      body=`<div class="card" style="padding:12px"><div class="mon">${['Mån','Tis','Ons','Tor','Fre','Lör','Sön'].map(x=>`<div class="h">${x}</div>`).join('')}${cells}</div>
        <p class="muted" style="margin:10px 2px 0">Siffran = bokade jobb (orange nästan fullt, röd fullt ${CAP}). Streckade = offert ej signerad. Dra ett jobb till en annan dag för att flytta det.</p></div>${dayList}`;
      handlers={
        start(el,p){ const b=byIdB(el.dataset.id); if(!b) return null; const r=el.getBoundingClientRect(); const g=el.cloneNode(true); g.classList.add('mghost'); g.style.width=r.width+'px'; document.body.appendChild(g); return {b,g,ox:p.x-r.left,oy:p.y-r.top}; },
        move(c,x,y){ c.g.style.left=(x-c.ox)+'px'; c.g.style.top=(y-c.oy)+'px'; clearDrop(); const cell=hit('.day',x,y); if(cell) cell.classList.add('hot'); c.to=cell?cell.dataset.d:null; },
        drop(c){ c.g.remove(); clearDrop(); if(!c.to) return showCal(); moveJob(c.b,{date:c.to},'Flyttad till '+dfmt(c.to,{weekday:'short',day:'numeric',month:'short'})); },
        cancel(c){ c.g.remove(); clearDrop(); showCal(); },
      };
    }

    if(calView==='week'){
      const ws=weekStart(calDate), days=[...Array(7)].map((_,i)=>addDays(ws,i)), PX=46;
      title=`v. ${isoWeek(ws)} · ${dfmt(ws,{day:'numeric',month:'short'})} – ${dfmt(days[6],{day:'numeric',month:'short',year:'numeric'})}`;
      const nowMin=new Date().getHours()*60+new Date().getMinutes();

      const ad=days.map(d=>`<div class="wk-ad" data-d="${d}">${all.filter(b=>onCal(b)&&b.date===d&&!b.time).map(b=>`<div class="ev ad${booked(b)?'':' pre'}" data-drag data-id="${esc(b.id)}" style="--c:${esc(colorOf(b))}">${evInner(b,null)}</div>`).join('')}</div>`).join('');

        }).join('')}</div>`;
      }).join('');

      body=`<div class="card" style="padding:12px 12px 16px"><div class="xs"><div class="wk" style="--px:${PX}px">
        <div class="wk-row"><div></div>${head}</div>

        <p class="muted" style="margin:12px 2px 0">Dra ett jobb för att flytta det, dra nederkanten för att ändra längden.${fine?' Klicka på en tom tid för att skapa en ny bokning.':' Håll kvar fingret på ett jobb för att dra det.'} Röd ram = någon är dubbelbokad.</p></div>`;
      handlers={
        start(el,p){ const b=byIdB(el.dataset.id); if(!b) return null; const s=S.span(b), r=el.getBoundingClientRect(); return {b,s,resize:p.resize&&!!b.time,offY:b.time?p.y-r.top:12,dur:Math.round(S.hoursOf(b)*60)}; },
        move(c,x,y){
          clearDrop();
          if(c.resize){ const col=root.querySelector(`.wk-col[data-d="${c.b.date}"]`), r=col.getBoundingClientRect(); const dur=Math.max(60,Math.min(14*60,snap(OPEN+(y-r.top)/PX*60)-c.s.start)); c.res={dur}; dropBox(col,`top:${(c.s.start-OPEN)/60*PX}px;height:${dur/60*PX}px`,rangeTxt(c.s.start,dur)+' · '+fmtH(dur/60)); return; }

      // Empty time: click = new job there; drag down = new job with that length.

    if(calView==='team'){
      const d=calDate, PXH=small?60:Math.max(64,Math.floor((Math.min(1200,innerWidth-236)-64-164)/HOURS)), jobs=all.filter(b=>onCal(b)&&b.date===d);
      title=dfmt(d,{weekday:'long',day:'numeric',month:'long'});

          return {b,s,row,from:row.dataset.r,kind:row.dataset.k,resize:p.resize&&!s.allDay,offX:s.allDay?10:p.x-r.left,dur:Math.round(S.hoursOf(b)*60)}; },

  // ---------- new ----------
  // Customers we already know, one per phone number (latest booking wins).
  const digits=(x)=>String(x||'').replace(/\D/g,'').replace(/^46/,'0');
  function customers(){
    const m=new Map();
    for(const b of all.slice().sort((x,y)=>(y.createdAt||0)-(x.createdAt||0))){ const d=b.data||{}, k=digits(d.phone); if(!k) continue;
      if(!m.has(k)) m.set(k,{name:d.name,phone:d.phone,email:d.email,from:d.from,to:d.to,n:0,ids:[]});
      const c=m.get(k); c.n++; c.ids.push(b.id); if(!c.email&&d.email) c.email=d.email; }
    return [...m.values()];
  }
  const SVC=[['move|bas','Bara flytt – Bas'],['move|premium','Flytt + flyttstäd – Premium, 10 % rabatt'],['move|deluxe','Flytt + flyttstäd + packning – Deluxe, 20 % rabatt'],['hourly|','Flytt per timme'],['cleaning|','Bara flyttstäd'],['other|','Kontorsflytt, piano eller annat']];
  const FLOORS=['Bottenplan','1 tr','2 tr','3 tr','4 tr','5 tr','6 tr','7 tr','8 tr','9 tr','10 tr eller högre'];

  // ---------- sales board (Bokningar → Tavla) ----------
  // Stage is worked out from the booking; only "Kontaktad" and "Förlorad" are set by hand.
  let listMode=(()=>{ try{ return localStorage.getItem('fx_listmode')||'list'; }catch(_){ return 'list'; } })();
  const STAGES=[['new','Ny förfrågan','#c2560a'],['contacted','Kontaktad','#5a52c7'],['sent','Offert skickad','#2f6fb2'],['opened','Kunden har öppnat','#0f8a8a'],['won','Bokad','#1f8a4c'],['lost','Förlorad','#8a96a3']];
  const stageOf=(b)=>b.status==='signed'||b.status==='done'?'won':b.status==='declined'||b.status==='cancelled'||isExpired(b)?'lost':b.status==='sent'?(b.views?'opened':'sent'):(b.contactedAt||(b.calls||[]).length?'contacted':'new');
  const OUT={answered:'Pratade med kunden',noanswer:'Inget svar',callback:'Ringer tillbaka / vill fundera',notinterested:'Inte intresserad',contacted:'Kontaktad'};
  const followDue=(b)=>b.followUp&&b.followUp.at.slice(0,10)<=today();
  const waitMin=(b)=>b.status==='new'&&b.source==='web'&&!b.firstResponseAt?Math.floor((Date.now()-b.createdAt)/6e4):null;
  const waitTxt=(m)=>m<60?m+' min':m<1440?Math.floor(m/60)+' tim':Math.floor(m/1440)+' d';
  function boardCard(b){
    const d=b.data||{}, w=waitMin(b), last=(b.calls||[]).slice(-1)[0];
    return `<div class="bcard" data-drag data-id="${esc(b.id)}"><b>${esc(d.name)}</b>
      <div class="muted">${esc([d.from,d.to].filter(Boolean).map(town).join(' → ')||d.size||'')}</div>
      <div class="bmeta"><span>${b.offer?kr(b.offer.total):''}</span><span class="muted">${esc(fmtDate(b.date))}</span></div>
      <div class="tags">${chanceTag(b)}${b.lead==='calc'&&b.status==='new'?'<span class="tag wn">💡 Prisräknaren</span>':''}${w!=null?`<span class="tag ${w>=60?'no':'wn'}">⏱ obesvarad ${waitTxt(w)}</span>`:''}
        ${b.followUp?`<span class="tag ${followDue(b)?'no':''}">📞 ${esc(b.followUp.at.slice(5,10).replace('-','/'))} ${esc(b.followUp.at.slice(11))}</span>`:''}
        ${last&&stageOf(b)!=='won'?`<span class="tag">${esc(OUT[last.outcome])}</span>`:''}${b.views&&b.status==='sent'?`<span class="tag seen">👁 ${b.views}×</span>`:''}</div></div>`;
  }
  function showBoard(){
    view='list';
    const since=Date.now()-60*864e5;   // won/lost: the last 60 days
    const cols=STAGES.map(([k,l,c])=>{ const list=all.filter(b=>stageOf(b)===k&&(k!=='won'&&k!=='lost'||(b.updatedAt||b.createdAt)>=since)).sort((x,y)=>(followDue(y)?1:0)-(followDue(x)?1:0)||(y.updatedAt||0)-(x.updatedAt||0));
      const sum=list.reduce((a,b)=>a+(b.offer?.total||0),0);
      return `<div class="bcol" data-stage="${k}"><div class="bhead" style="--c:${c}"><b>${l}</b><span>${list.length}</span></div><div class="bsum muted">${sum?kr(sum):''}</div>${list.slice(0,60).map(boardCard).join('')||'<div class="muted bempty">–</div>'}</div>`; }).join('');
    view='offers'; root.innerHTML=navBar('offers')+`<main style="max-width:none">${listToggle()}${offerStats()}
      <div class="xs"><div class="board">${cols}</div></div>
      <p class="muted" style="margin:10px 2px">Dra en kund till <b>Kontaktad</b> eller <b>Förlorad</b>. Resten flyttas av sig själv när du skickar offerten, kunden öppnar den eller signerar. Bokad och Förlorad visar de senaste 60 dagarna.</p></main>`;
    bindListToggle();
    root.querySelectorAll('.bcard').forEach(e=>e.addEventListener('click',()=>{ if(!justDragged) location.hash=e.dataset.id; }));
    enableDrag(root.querySelector('.board'),{
      start(el,p){ const b=byIdB(el.dataset.id); if(!b) return null; const r=el.getBoundingClientRect(); const g=el.cloneNode(true); g.classList.add('mghost'); g.style.width=r.width+'px'; document.body.appendChild(g); return {b,g,ox:p.x-r.left,oy:p.y-r.top}; },
      move(c,x,y){ c.g.style.left=(x-c.ox)+'px'; c.g.style.top=(y-c.oy)+'px'; root.querySelectorAll('.bcol.hot').forEach(e=>e.classList.remove('hot')); const col=[...root.querySelectorAll('.bcol')].find(e=>{ const r=e.getBoundingClientRect(); return x>=r.left&&x<r.right; }); if(col) col.classList.add('hot'); c.to=col?.dataset.stage; },
      async drop(c){ c.g.remove(); root.querySelectorAll('.bcol.hot').forEach(e=>e.classList.remove('hot'));
        const from=stageOf(c.b); if(!c.to||c.to===from) return showBoard();
        if(c.to==='contacted'&&c.b.status==='new') await salesAct(c.b,{stage:'contacted'},'Kontaktad ✓');
        else if(c.to==='lost') lostDialog(c.b);
        else { notify(c.to==='won'?'Bokad blir den när kunden signerar offerten.':'Öppna bokningen och skicka offerten.'); showBoard(); } },
      cancel(c){ c.g.remove(); showBoard(); },
    });
  }
  // Offers: the last 30 days at a glance.
  function offerStats(){
    const from=Date.now()-30*864e5, sent=all.filter(b=>b.sentAt&&b.sentAt>=from), opened=sent.filter(b=>b.views), won=sent.filter(b=>b.signedAt);
    const nw=all.filter(b=>b.status==='new').length, rate=sent.length?Math.round(won.length*100/sent.length):0;
    return `<div class="ostat"><span><b>${nw}</b> nya</span><span><b>${sent.length}</b> skickade</span><span><b>${opened.length}</b> öppnade</span><span><b>${won.length}</b> signerade</span><span><b>${rate} %</b> acceptansgrad</span><small>senaste 30 dagarna</small></div>`;
  }
  const listToggle=()=>`<div class="seg" id="lmode" style="margin-bottom:12px"><button data-m="list" class="${listMode==='list'?'on':''}">Lista</button><button data-m="board" class="${listMode==='board'?'on':''}">Försäljningstavla</button></div>`;
  const bindListToggle=()=>root.querySelectorAll('#lmode button').forEach(x=>x.onclick=()=>{ listMode=x.dataset.m; try{ localStorage.setItem('fx_listmode',listMode); }catch(_){} showList(); });
  // Same customer (phone or e-mail) with another open request → probably a duplicate.
  const OPENST=['new','sent','declined'];
  // Bookings by phone and e-mail, so the list does not search every booking for every row (it got slow with many).
  let IDX=null;
  const custIdx=()=>{ if(IDX&&IDX.all===all&&IDX.n===all.length&&Date.now()-IDX.at<3000) return IDX;
    const ph=new Map(), em=new Map(), add=(m,k,b)=>{ if(!k) return; const l=m.get(k); if(l) l.push(b); else m.set(k,[b]); };
    for(const b of all){ const d=b.data||{}, p=digits(d.phone); if(p.length>=6) add(ph,p,b); add(em,(d.email||'').toLowerCase(),b); }
    return IDX={all,n:all.length,at:Date.now(),ph,em}; };
  const samePerson=(b)=>{ const d=b.data||{}, I=custIdx(), p=digits(d.phone), e=(d.email||'').toLowerCase(); const out=new Set([...(p.length>=6?I.ph.get(p)||[]:[]),...(e?I.em.get(e)||[]:[])]); out.delete(b); return [...out]; };
  const dupsOf=(b)=>{ if(!OPENST.includes(b.status)||b.signedAt||b.nextId) return [];
    return samePerson(b).filter(x=>OPENST.includes(x.status)&&!x.signedAt&&!x.nextId&&x.id!==b.prevId&&x.prevId!==b.id); };
  async function salesAct(b,body,ok){
    try{ const nb=await api('/api/admin/sales?id='+b.id,{method:'POST',body:JSON.stringify(body)}); const i=all.findIndex(x=>x.id===b.id); if(i>=0) all[i]=nb; updateCounts(); if(ok) notify(ok); }
    catch(e){ notify(e.message); }
    if(view==='list'||view==='offers') showList(); else if(location.hash.slice(1)===b.id) showDetail(b.id);
  }
  function lostDialog(b){
    const box=document.createElement('div'); box.className='pinbox';
    box.innerHTML=`<div class="card"><h3>Förlorad – ${esc((b.data||{}).name)}</h3><label class="f">Varför?</label><select id="lr">${Object.entries(WHY).map(([k,l])=>`<option value="${k}">${esc(l)}</option>`).join('')}</select>

    document.body.appendChild(box);

    box.querySelector('#lok').onclick=async()=>{ const r=box.querySelector('#lr').value, t=box.querySelector('#lt').value; box.remove(); await salesAct(b,{stage:'lost',reason:r,text:t},'Markerad som förlorad'); };

        <div class="card"><h3>Ny användare</h3>

      if($('#ownc')){

        $('#oe_save').onclick=async()=>{ try{ const r=await api('/api/admin/users?do=owner',{method:'POST',body:JSON.stringify({emails:cur()})}); owner={...owner,...r}; draw(); om('Sparat ✓ – logga in med någon av adresserna.',true); }catch(e){ om(e.message,false); } };
        $('#op_save').onclick=async()=>{ if($('#op_new').value!==$('#op_new2').value) return om('De nya lösenorden är inte lika.',false);
          try{ const r=await api('/api/admin/users?do=owner',{method:'POST',body:JSON.stringify({current:$('#op_cur').value,password:$('#op_new').value})}); owner={...owner,...r}; draw(); om('Lösenordet är bytt ✓',true); }catch(e){ om(e.message,false); } };

  // ---- notifications on this device (all roles) ----
  const pushOk=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
  const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent), standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  const swReg=()=>pushOk()?navigator.serviceWorker.register('/admin-sw.js',{scope:'/admin'}):Promise.resolve(null);
  // Every time the app opens: if notifications are allowed on this device, make sure the phone still has a
  // subscription and that the server knows it (a lost or replaced subscription is why notices stop coming).
  async function healPush(){
    try{
      const reg=await swReg(); if(!reg||Notification.permission!=='granted') return;
      await navigator.serviceWorker.ready; reg.update().catch(()=>{});
      let sub=await reg.pushManager.getSubscription();
      if(!sub){ const info=await api('/api/admin/push'); sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(info.publicKey)}); }
      await api('/api/admin/push',{method:'POST',body:JSON.stringify(sub.toJSON())});

    c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
