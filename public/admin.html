<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0d2a3f">
<title>Admin – FX Flytt</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/admin.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FX Admin">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{--navy:#0d2a3f;--navy2:#16384f;--accent:#ff7a1a;--accent2:#e8650a;--ink:#14212b;--muted:#5d6d7a;--line:#e2e8ee;--line2:#cfd9e2;--bg:#f3f6f9;--card:#fff;--green:#1f8a4c;--red:#b42318;--blue:#1f5fae;--side:236px;
    --sh:0 1px 2px rgba(13,42,63,.06),0 2px 8px rgba(13,42,63,.04);--sh2:0 12px 32px rgba(13,42,63,.16)}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:var(--navy)}
  [hidden]{display:none!important}
  svg.i{width:20px;height:20px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  /* ---------- shell: sidebar (desktop) / bottom bar (mobile) ---------- */
  #side{position:fixed;top:0;bottom:0;left:0;width:var(--side);background:var(--navy);color:#c4d5e2;display:flex;flex-direction:column;padding:20px 12px 16px;z-index:20}
  .brand{display:block;padding:2px 10px 22px}.brand img{height:34px;display:block}
  #side a.nav{position:relative;display:flex;align-items:center;gap:12px;padding:10px 12px;margin:1px 0;border-radius:10px;color:#c4d5e2;text-decoration:none;font-weight:600;font-size:14.5px}
  #side a.nav:hover{background:rgba(255,255,255,.06);color:#fff}
  #side a.nav.on{background:rgba(255,255,255,.13);color:#fff}
  #side a.nav.on::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
  #side .ct{margin-left:auto;background:var(--accent);color:#fff;font-size:11px;font-weight:800;border-radius:999px;min-width:20px;height:20px;line-height:20px;text-align:center;padding:0 6px}
  #side a.newbtn{display:flex;align-items:center;justify-content:center;gap:8px;margin:18px 4px 0;background:var(--accent);color:#fff;text-decoration:none;font-weight:800;border-radius:12px;padding:11px;font-size:14.5px}
  #side a.newbtn:hover{background:var(--accent2)}
  #side .lbl-m{display:none}
  body.office .own{display:none!important}
  .side-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid rgba(255,255,255,.1);font-size:12px;color:#8fa6b8}
  .side-foot button{background:none;border:0;color:#c4d5e2;font:inherit;font-weight:600;padding:6px 0;cursor:pointer;display:flex;align-items:center;gap:8px}
  #wrap{margin-left:var(--side);min-height:100vh}
  #top{position:sticky;top:0;z-index:10;background:rgba(243,246,249,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:flex;align-items:center;gap:10px;padding:14px 32px;border-bottom:1px solid var(--line)}
  #top h1{flex:1;margin:0;font-size:21px;letter-spacing:-.01em;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #top .ib{position:relative;display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--line2);background:#fff;color:var(--navy);cursor:pointer}
  #bellN{position:absolute;top:-6px;right:-6px;background:#e5484d;color:#fff;border-radius:999px;font-size:11px;font-weight:800;min-width:18px;height:18px;line-height:18px;padding:0 4px;text-align:center}
  #mlogout{display:none}
  main{max-width:1200px;margin:0 auto;padding:24px 32px 60px}
  body.out #side,body.out #top{display:none}
  body.out #wrap{margin-left:0}
  @media (max-width:899px){
    #side{top:auto;right:0;width:auto;height:calc(62px + env(safe-area-inset-bottom));flex-direction:row;padding:0 2px env(safe-area-inset-bottom);border-top:1px solid #0a2232;box-shadow:0 -4px 16px rgba(13,42,63,.12)}
    .brand,.side-foot,#side .lbl-long{display:none}#side .lbl-m{display:inline}
    #side a.nav{flex:1;flex-direction:column;justify-content:center;gap:3px;padding:6px 2px;margin:0;font-size:10.5px;border-radius:0}
    #side a.nav.on{background:none;color:#fff}#side a.nav.on::before{left:30%;right:30%;top:0;bottom:auto;width:auto;height:3px;border-radius:0 0 3px 3px}
    #side .ct{position:absolute;top:4px;left:calc(50% + 6px);margin:0;min-width:17px;height:17px;line-height:17px;font-size:10px;padding:0 4px}
    #side a.newbtn{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));margin:0;width:56px;height:56px;border-radius:18px;padding:0;box-shadow:0 8px 22px rgba(232,101,10,.45)}
    #side a.newbtn span{display:none}#side a.newbtn svg{width:26px;height:26px}
    body.v-new #side a.newbtn,body.v-detail #side a.newbtn{display:none}
    #wrap{margin-left:0;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
    #top{padding:10px 16px}#top h1{font-size:18px}
    #mlogout{display:inline-flex}
    main{padding:14px 14px 40px}
  }

  /* ---------- notices ---------- */
  #npanel{position:fixed;top:64px;right:16px;left:16px;max-width:420px;margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh2);z-index:30;max-height:70vh;overflow:auto}
  #npanel .ev{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:#fff;padding:12px 16px;font:inherit;color:var(--ink);cursor:pointer}
  #npanel .ev.unread{background:#fff7ef}#npanel .ev small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
  #toast{display:flex;align-items:center;gap:12px;position:fixed;left:16px;right:16px;bottom:24px;max-width:440px;margin:0 auto;background:var(--navy);color:#fff;border-radius:14px;padding:13px 16px;z-index:40;box-shadow:var(--sh2);font-weight:600;cursor:pointer}
  @media (max-width:899px){#toast{bottom:calc(84px + env(safe-area-inset-bottom))}}

  /* ---------- building blocks ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:var(--sh)}
  .card h3{margin:0 0 12px;font-size:15px;color:var(--navy);display:flex;align-items:center;gap:8px}
  .card h3 .sub{margin-left:auto;font-size:13px;font-weight:600;color:var(--muted)}
  .sec-h{display:flex;align-items:baseline;gap:10px;margin:6px 2px 10px}.sec-h h2{margin:0;font-size:16px;color:var(--navy)}.sec-h .muted{margin-left:auto}
  .cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
  @media (max-width:1099px){.cols{grid-template-columns:minmax(0,1fr)}}
  .muted{color:var(--muted);font-size:13px}
  .st{font-size:11px;font-weight:800;border-radius:999px;padding:4px 10px;white-space:nowrap;text-transform:uppercase;letter-spacing:.02em;justify-self:end}
  .st.new{background:#fff1e6;color:#c2560a}.st.sent{background:#e8f0fb;color:var(--blue)}.st.signed{background:#e6f5ec;color:var(--green)}
  .st.declined,.st.cancelled{background:#fdecec;color:var(--red)}.st.done{background:#eceff2;color:#47525c}
  table{width:100%;border-collapse:collapse}
  td{padding:8px 0;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
  tr:last-child td{border-bottom:0}
  td:first-child{color:var(--muted);width:38%;padding-right:10px}
  label.f{display:block;font-weight:700;font-size:13px;margin:12px 0 5px;color:#33434f}
  input,textarea,select{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1.5px solid var(--line2);border-radius:10px;background:#fff;color:var(--ink)}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(13,42,63,.1)}
  textarea{min-height:76px;resize:vertical}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:10px}
  @media (max-width:520px){.row3{grid-template-columns:1fr 1fr}.row3>:first-child{grid-column:1/-1}}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-size:15px;font-weight:800;background:var(--accent);color:#fff;margin-top:10px;text-align:center;text-decoration:none;cursor:pointer}
  .btn:hover{background:var(--accent2)}.btn:disabled{opacity:.6;cursor:default}
  .btn.sec{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}.btn.sec:hover{background:#f2f6f9}
  .btn.gray{background:#eceff2;color:#47525c}.btn.gray:hover{background:#e2e7eb}
  .btn.red{background:#fff;color:var(--red);border:1.5px solid #f0c4c0}.btn.red:hover{background:#fff6f5}
  .btn.sm{width:auto;padding:8px 14px;font-size:13.5px;margin:0;border-radius:10px}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
  .chips button{white-space:nowrap;border:1px solid var(--line2);background:#fff;border-radius:999px;padding:7px 13px;font:inherit;font-size:13px;font-weight:600;color:var(--navy);cursor:pointer}
  .chips button.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:#eef2f5;color:#4a5a67}
  .tag.seen{background:#e8f1fb;color:#1d5fa8}.tag.ok{background:#e6f5ec;color:var(--green)}.tag.no{background:#fdecec;color:var(--red)}.tag.wn{background:#fff4e5;color:#8a4b00}
  .who{white-space:nowrap;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:2px 9px 2px 7px;border-radius:999px;background:color-mix(in srgb,var(--c) 12%,#fff);color:color-mix(in srgb,var(--c) 80%,#000)}
  .who::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
  .who.v{border-radius:6px}.who.v::before{border-radius:2px}
  .warn{background:#fff4e5;border:1px solid #ffd6a8;color:#8a4b00;border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}
  .okmsg{background:#e6f5ec;border:1px solid #bfe5cf;color:var(--green);border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0;font-weight:600}
  .err{color:var(--red);font-weight:600;font-size:14px;margin-top:8px}
  .empty{text-align:center;color:var(--muted);padding:34px 10px}
  .back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--navy);font:inherit;font-weight:700;font-size:14px;padding:0 0 12px;cursor:pointer}
  .dbox{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;background:#fafcfd}
  .xrow{display:flex;gap:6px;margin:6px 0}.xrow input:first-child{flex:1;min-width:0}.xrow input[type=number]{width:100px}.xrow button{border:1px solid var(--line);background:#fff;border-radius:10px;width:42px;color:var(--red);cursor:pointer}
  .sugg{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:6px}.sugg button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:#fff;padding:9px 12px;font:inherit;cursor:pointer}.sugg small{display:block;color:var(--muted);font-size:12px}
  a.hist{display:block;padding:8px 0;border-bottom:1px solid var(--line);color:var(--navy);text-decoration:none}
  .acw{position:relative}.acl{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh2);z-index:6;overflow:hidden}
  .acl button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:#fff;padding:9px 12px;font:inherit;cursor:pointer}.acl small{display:block;color:var(--muted);font-size:12px}
  .hist div{font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line)}
  .srch{display:flex;gap:8px;margin-bottom:12px}.srch input{flex:1;min-width:0}.srch select{width:auto;flex:0 0 auto}
  .login{max-width:400px;margin:0 auto;padding:12vh 16px 40px}
  .login .logo{display:flex;justify-content:center;margin-bottom:22px}.login .logo img{height:44px}

  /* ---------- booking rows ---------- */
  .item{display:grid;grid-template-columns:minmax(0,1fr) 170px 110px 128px;gap:14px;align-items:center;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 16px;margin-bottom:8px;color:inherit;font:inherit;cursor:pointer;box-shadow:var(--sh);transition:border-color .12s,box-shadow .12s}
  .item:hover{border-color:#b9c8d4;box-shadow:0 4px 14px rgba(13,42,63,.08)}
  .item b{font-size:15.5px}
  .item .when{font-size:13.5px;font-weight:600;color:#33434f}.item .when small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
  .item .price{font-weight:800;text-align:right;white-space:nowrap}
  .item .crew{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  /* rows switch to a compact layout whenever their column is narrow (half-width columns, phones) */
  .cols>div,#items{container-type:inline-size;min-width:0}
  @container (max-width:720px){
    .item{grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:12px 14px}
    .item .when{grid-row:2;grid-column:1/-1}.item .when small{display:inline;margin-left:6px}
    .item .price{grid-row:3;grid-column:1;text-align:left;font-weight:700;font-size:14px}
    .item .st{grid-row:1;grid-column:2}
  }

  /* ---------- today ---------- */
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
  @media (max-width:899px){.kpis{grid-template-columns:1fr 1fr;gap:8px}}
  .kpi{border-radius:16px;padding:14px 16px;color:#fff;text-decoration:none;display:block}.kpi small{display:block;font-size:12.5px;opacity:.92;font-weight:600}.kpi b{font-size:26px;line-height:1.25}
  .kpi.lt{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:var(--sh)}.kpi.lt small{color:var(--muted);opacity:1}
  .kpi.alert{border-color:#ffd6a8;background:#fff8f0}.kpi.alert b{color:#c2560a}

  /* ---------- today: to-do and staff ---------- */
  .todo-g{margin-bottom:12px}.todo-g:last-child{margin-bottom:0}
  .todo-h{font-weight:800;font-size:13.5px;color:#33434f;margin:2px 0 4px;display:flex;align-items:center;gap:8px}
  .todo{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
  .todo a{flex:1;min-width:0;text-decoration:none;color:var(--ink)}.todo a b{display:block;font-size:14.5px}.todo a small{display:block;color:var(--muted);font-size:12.5px}
  .crewday{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
  .crewday>div{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:8px 10px}
  .crewday b{display:block;font-size:14px}.crewday small{color:var(--green);font-weight:700;font-size:12.5px}
  .crewday a{display:block;font-size:12.5px;color:var(--ink);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.crewday a:hover{text-decoration:underline}

  .phgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;margin-top:10px}
  .phgrid>div{position:relative;aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:#eef2f5}
  .phgrid img{width:100%;height:100%;object-fit:cover;display:block}
  .phgrid span{position:absolute;left:4px;bottom:4px;background:rgba(13,42,63,.8);color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px}
  .phgrid span.damage{background:var(--red)}
  .phgrid button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:var(--red);font-weight:800;cursor:pointer}
  .htab th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:10px 8px 6px 0;border-bottom:1px solid var(--line)}
  .htab td{width:auto;padding:10px 8px 10px 0;vertical-align:middle;color:var(--ink)}.htab td:first-child{width:auto}
  .htab a.hist{font-size:13.5px}
  @media (max-width:600px){.htab .hm{display:none}}
  .ptab{width:100%}.ptab th{text-align:left;font-size:12px;color:var(--muted);padding:4px 6px 4px 0}.ptab td{padding:3px 6px 3px 0;border:0;width:auto}
  .ptab input{padding:7px 9px;font-size:15px}.ptab td:last-child{width:44px}
  .chg input,.chg{background:#fff8d6}.chg input{border-color:#e8c547}
  .pdiff{max-height:220px;overflow:auto;margin-bottom:4px}.pdiff>div{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13.5px}.pdiff s{color:var(--muted)}
  /* ---------- planning (booking detail) ---------- */
  .pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
  .pk{display:flex;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line2);background:#fff;border-radius:12px;padding:9px 11px;font:inherit;color:var(--ink);cursor:pointer;min-width:0}
  .pk i{flex:0 0 auto;width:20px;height:20px;border-radius:6px;border:2px solid var(--line2);display:flex;align-items:center;justify-content:center}
  .pk span{min-width:0;font-weight:700;font-size:14px;line-height:1.25}.pk small{display:block;font-weight:500;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pk.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 8%,#fff)}
  .pk.on i{background:var(--c);border-color:var(--c)}.pk.on i::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
  .pk.busy small{color:#a35300}.pk.clash{border-color:var(--red);background:#fff6f5}.pk.clash small{color:var(--red);font-weight:700}
  .pk.arch{opacity:.7}

  /* ---------- staff ---------- */
  .tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:22px}
  .tcard{position:relative;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px 20px;box-shadow:var(--sh);overflow:hidden}
  .tcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
  .tcard .nm{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px}
  .tcard .nm .tag{margin-left:auto}
  .tcard .meta{color:var(--muted);font-size:13px;margin-top:2px}
  .tcard .next{margin-top:10px;font-size:13px;padding-top:10px;border-top:1px solid var(--line)}
  .tcard .acts{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
  .tcard.off{opacity:.65}
  .sw{display:flex;gap:8px;flex-wrap:wrap}.sw button{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line2);background:var(--c);cursor:pointer}.sw button.on{box-shadow:0 0 0 2.5px var(--navy)}
  .seg{display:inline-flex;background:#e8edf2;border-radius:12px;padding:3px;gap:2px}.seg button{border:0;background:none;padding:8px 14px;border-radius:9px;font:inherit;font-weight:700;font-size:14px;color:#47525c;cursor:pointer}.seg button.on{background:#fff;color:var(--navy);box-shadow:var(--sh)}
  .jl{margin-top:10px}.jl a{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px dashed var(--line);font-size:13px;text-decoration:none;color:var(--ink)}

  /* ---------- calendar ---------- */
  .calbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .cnav{display:inline-flex;gap:4px}.cnav button{border:1px solid var(--line2);background:#fff;border-radius:10px;padding:8px 12px;font:inherit;font-weight:700;color:var(--navy);cursor:pointer;min-width:40px}
  .ctitle{font-size:17px;color:var(--navy)}.ctitle::first-letter{text-transform:uppercase}
  .tg{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}.tg input{width:18px;height:18px;margin:0;accent-color:var(--navy)}
  @media (max-width:899px){.ctitle{order:5;width:100%}.tg{margin-left:0}}
  .xs{overflow-x:auto;-webkit-overflow-scrolling:touch}
  /* month */
  .mon{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
  .mon .h{font-size:12px;color:var(--muted);text-align:center;font-weight:700}
  .day{min-height:108px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}
  .day:hover{border-color:#b9c8d4}.day.out{opacity:.45}.day.sel{border:2px solid var(--navy)}.day.hot{background:#fff4e9;border:2px dashed var(--accent)}
  .day .dh{display:flex;justify-content:space-between;align-items:center;gap:2px}
  .day .n{font-size:13px;font-weight:700}.day.today .n{background:var(--navy);color:#fff;border-radius:999px;padding:0 7px}
  .day .c{font-size:11px;font-weight:800;border-radius:999px;padding:1px 7px;background:#e6f5ec;color:var(--green)}
  .day .c.mid{background:#fff4e5;color:#8a4b00}.day .c.full{background:#fdecec;color:var(--red)}
  .mev{font-size:11.5px;font-weight:600;padding:2px 6px;border-radius:6px;background:color-mix(in srgb,var(--c) 14%,#fff);border-left:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  .mev.pre{background:#fff;border:1px dashed var(--c);border-left:3px solid var(--c)}
  .mev.lift{opacity:.3}
  .more{font-size:11px;color:var(--muted);font-weight:600;padding-left:2px}
  @media (max-width:599px){.mon{gap:3px}.day{min-height:54px;padding:4px 2px;align-items:center}.mev,.more{display:none}.day .dh{flex-direction:column}}
  /* week */
  .wk{min-width:700px}
  .wk-row{display:grid;grid-template-columns:44px repeat(7,minmax(0,1fr))}
  .wk-h{text-align:center;padding:2px 0 8px;color:var(--muted);font-size:12px;font-weight:600}.wk-h b{display:block;font-size:19px;color:var(--ink);width:34px;height:34px;line-height:34px;margin:1px auto 0;border-radius:999px}
  .wk-h.today b{color:#fff;background:var(--navy)}.wk-n{display:block;font-size:11px;color:var(--green);font-weight:700}
  .wk-g{font-size:11px;color:var(--muted);text-align:right;padding-right:6px;line-height:1.1}
  .wk-ad{border-left:1px solid var(--line);border-top:1px solid var(--line);border-bottom:2px solid var(--line);min-height:38px;padding:3px;display:flex;flex-direction:column;gap:3px;min-width:0}
  .wk-ad.hot{background:#fff4e9}
  .wk-times div{position:relative;top:-7px}.wk-times div:first-child{top:0}
  .wk-col{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--px));min-width:0}
  .wk-col.today{background-color:#f7fafd}
  @media (pointer:fine){.wk-col{cursor:cell}}
  .ev{position:absolute;border-radius:8px;padding:3px 7px;background:color-mix(in srgb,var(--c) 15%,#fff);border-left:4px solid var(--c);color:var(--ink);font-size:12px;line-height:1.25;overflow:hidden;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;box-shadow:0 1px 2px rgba(13,42,63,.12);z-index:2}
  .ev:hover{z-index:3;box-shadow:0 3px 10px rgba(13,42,63,.18)}
  .ev b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ev small{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ev .ec{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}.ev .ec .who{font-size:10.5px;padding:1px 6px}
  .ev.pre{background:#fff;border:1.5px dashed var(--c);border-left:4px solid var(--c)}
  .ev.clash{box-shadow:0 0 0 2px var(--red)}
  .ev.ad{position:relative;padding:3px 6px}
  .ev.allday{background-image:repeating-linear-gradient(135deg,transparent 0 6px,rgba(13,42,63,.06) 6px 12px)}
  .ev.lift{opacity:.3}
  .ev .rz{position:absolute;left:0;right:0;bottom:0;height:9px;cursor:ns-resize}
  .ev.tl .rz{left:auto;top:0;width:10px;height:auto;cursor:ew-resize}
  .ev.ad .rz,.ev.allday .rz{display:none}
  .drop{position:absolute;left:2px;right:2px;border:2px dashed var(--accent);background:rgba(255,122,26,.13);border-radius:8px;pointer-events:none;z-index:5}
  .drop span{position:absolute;top:2px;left:4px;font-size:11px;font-weight:800;color:#a34500;background:#fff;border-radius:4px;padding:0 4px;white-space:nowrap}
  .now{position:absolute;left:0;right:0;height:2px;background:#e5484d;z-index:4;pointer-events:none}.now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:#e5484d}
  .mghost{position:fixed;z-index:50;pointer-events:none;box-shadow:var(--sh2);transform:rotate(-2deg);opacity:.95}
  /* staff timeline */
  .tl{width:max-content;min-width:100%}
  .tl-row{display:grid;grid-template-columns:160px var(--w);border-bottom:1px solid var(--line)}
  .tl-name{position:sticky;left:0;z-index:6;background:#fff;padding:9px 10px 9px 12px;border-right:1px solid var(--line);box-shadow:inset 4px 0 0 var(--c,transparent);min-width:0}
  .tl-name b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tl-name small{color:var(--muted);font-size:11.5px;white-space:nowrap}
  .tl-track{position:relative;background-image:repeating-linear-gradient(to right,var(--line) 0 1px,transparent 1px var(--pxh));min-height:50px}
  .tl-head .tl-track{height:28px;min-height:0;background:none}.tl-head span{position:absolute;top:6px;font-size:11px;color:var(--muted);transform:translateX(-50%)}.tl-head span:first-child{transform:none;padding-left:3px}
  .tl-row.un .tl-name{background:#fafbfc}.tl-row.un{background:#fafbfc}
  .ev.tl{padding:3px 8px}
  @media (max-width:899px){.tl-row{grid-template-columns:108px var(--w)}.tl-name{padding:8px 6px 8px 10px}}
  #toast button{margin-left:auto;flex:0 0 auto;background:none;border:1px solid #47637a;color:#ffb27a;border-radius:999px;padding:5px 12px;font:inherit;font-weight:800;cursor:pointer}
  /* ---------- statistics ---------- */
  .bars{display:flex;align-items:flex-end;gap:6px;height:160px;border-bottom:1px solid var(--line);padding-top:6px}
  .bars .m{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:2px;height:100%}
  .bars .m i{display:block;width:30%;border-radius:4px 4px 0 0;min-height:1px}
  .blab{display:flex;gap:6px}.blab span{flex:1;text-align:center;font-size:11px;color:var(--muted);padding-top:4px}
  .leg{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
  .hbar{height:8px;border-radius:4px;background:#eef2f5;overflow:hidden;margin:4px 0 10px}.hbar i{display:block;height:100%;background:var(--accent)}
</style>

  <a class="nav" href="#installningar" data-v="set"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span class="lbl-m">Mer</span><span class="lbl-long">Inställningar</span></a>

    <button class="ib" id="bell" aria-label="Notiser"><svg class="i" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span id="bellN" hidden></span></button>
    <button class="ib" id="mlogout" aria-label="Logga ut"><svg class="i" viewBox="0 0 24 24"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h11"/></svg></button>

<div id="npanel" hidden></div><div id="toast" hidden></div>

<script src="/fx-prices.js" defer></script>
<script>
(function(){
  const $=(s,el=document)=>el.querySelector(s);
  const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const kr=(n)=>n==null?'–':Math.round(n).toLocaleString('sv-SE')+' kr';
  const CAP=10;
  const ST={new:'Ny',sent:'Offert skickad',signed:'Signerad',declined:'Nekad',done:'Klar',cancelled:'Avbokad'};
  const ago=(t)=>{ if(!t) return ''; const m=Math.round((Date.now()-t)/6e4); if(m<2) return 'just nu'; if(m<60) return m+' min sedan'; const h=Math.round(m/60); if(h<24) return h+' tim sedan'; const d=Math.round(h/24); return d===1?'i går':d+' dagar sedan'; };
  const fmtDate=(d)=>/^\d{4}-\d{2}-\d{2}$/.test(d||'')?new Date(d+'T12:00:00Z').toLocaleDateString('sv-SE',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'}):'Inget datum';
  const TIMES=[];for(let h=7;h<=18;h++){TIMES.push(String(h).padStart(2,'0')+':00');if(h<18)TIMES.push(String(h).padStart(2,'0')+':30');}
  const timeOpts=(cur)=>'<option value="">Ingen tid</option>'+TIMES.map(t=>`<option${t===cur?' selected':''}>${t}</option>`).join('')+(cur&&!TIMES.includes(cur)?`<option selected>${cur}</option>`:'');
  const fmtTs=(t)=>t?new Date(t).toLocaleString('sv-SE',{dateStyle:'short',timeStyle:'short'}):'';
  const today=()=>new Date().toLocaleDateString('sv-SE');
  const addDays=(d,n)=>{ const x=new Date(d+'T12:00:00Z'); x.setUTCDate(x.getUTCDate()+n); return x.toISOString().slice(0,10); };
  const resById=(id)=>res.find(r=>r.id===id);
  const whoChip=(r)=>`<span class="who${r.kind==='vehicle'?' v':''}" style="--c:${esc(r.color)}">${esc(r.name)}</span>`;
  const crewChips=(b)=>(b.crew||[]).map(resById).filter(Boolean).sort((x,y)=>x.kind.localeCompare(y.kind)).map(whoChip).join('');
  const whenTxt=(b)=>{ const s=S.span(b); return !s?'':s.allDay?'Ingen starttid':S.fmtMin(s.start)+'–'+S.fmtMin(s.end); };
  const fmtH=(h)=>String(h).replace('.',',')+' tim';
  const tel=(p)=>'tel:'+String(p||'').replace(/[^\d+]/g,'').replace(/^0/,'+46');
  const root=$('#root');
  const S=window.FXSchedule;
  let newPrefill=null, lastNav='', me=null;
  function applyRole(){
    document.body.classList.toggle('office',!!me&&me.role!=='owner');
    $('#whoami').innerHTML=me?`<b style="color:#fff">${esc(me.name)}</b> · ${me.role==='owner'?'Ägare':'Kontor'}`:'';
  }
  let res=[], teamKind='person', teamEdit=null, showArch=false, openRes=null;
  let all=[], view='today', filter='active', calMonth=today().slice(0,7), calDay=null, q='', sortBy='created', statPeriod='12';

  async function api(path,opt={}){
    const r=await fetch(path,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});
    const j=await r.json().catch(()=>({}));
    if(r.status===401){ showLogin(); throw new Error('Logga in igen'); }
    if(!r.ok) { const e=new Error(j.error||('Fel '+r.status)); e.data=j; throw e; }
    return j;
  }

  // ---------- login ----------
  async function start(){
    const s=await fetch('/api/admin/login').then(r=>r.json()).catch(()=>({}));
    if(s.admin){ me=s.user; document.body.classList.remove('out'); applyRole(); await load(); route(); startNotices(); swReg().catch(()=>{}); }
    else showLogin(s.setup);
  }
  function showLogin(setup){
    document.body.classList.add('out'); view='login';
    const miss=setup?[!setup.password&&'Lösenord (ADMIN_PASSWORD)',!setup.storage&&'Lagring (Upstash Redis)',!setup.mail&&'E-post (SMTP)'].filter(Boolean):[];
    root.innerHTML=`<div class="login"><div class="logo"><img src="/fxflytt-logo.svg" alt="FX Flytt"></div><div class="card"><h3 style="font-size:20px">Logga in i admin</h3>
      ${miss.length?`<div class="warn">Saknas i Vercel: ${esc(miss.join(', '))}</div>`:''}
      <label class="f" for="un">Användarnamn <span class="muted" style="font-weight:500">(tomt = ägarlösenordet)</span></label><input id="un" autocomplete="username" autocapitalize="none" spellcheck="false">
      <label class="f" for="pw">Lösenord</label><input id="pw" type="password" autocomplete="current-password">
      <button class="btn" id="go">Logga in</button><div class="err" id="err"></div></div></div>`;
    const go=async()=>{ $('#err').textContent='';
      const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#un').value,password:$('#pw').value})});
      const j=await r.json().catch(()=>({}));
      if(r.ok){ start(); } else $('#err').textContent=j.error||'Fel';
    };
    $('#go').onclick=go; $('#pw').onkeydown=(e)=>{ if(e.key==='Enter') go(); };
  }
  const logout=async()=>{ await fetch('/api/admin/login',{method:'DELETE'}); location.hash=''; showLogin(); };
  $('#logout').onclick=logout; $('#mlogout').onclick=()=>{ if(confirm('Logga ut?')) logout(); };

  // First time: every booking. After that (every 30 s): only bookings changed since the last time.
  let syncedAt=0;
  async function load(){
    const [j,t]=await Promise.all([api('/api/admin/bookings'+(syncedAt?'?since='+syncedAt:'')),api('/api/admin/team').catch(()=>({resources:res}))]);
    if(j.partial){ for(const b of j.bookings||[]){ const i=all.findIndex(x=>x.id===b.id); if(i>=0) all[i]=b; else all.unshift(b); } }
    else all=j.bookings||[];
    syncedAt=j.now||Date.now(); res=t.resources||[]; updateBell(); updateCounts();
  }
  // Sidebar badges: new requests, and booked jobs in the next 14 days that have nobody assigned.
  const needsCrew=(b)=>b.status==='signed'&&b.date&&b.date>=today()&&b.date<=addDays(today(),14)&&!(b.crew||[]).length;
  function updateCounts(){
    const set=(id,n)=>{ const e=$(id); e.hidden=!n; e.textContent=n>99?'99+':String(n); };
    set('#ctNew',all.filter(b=>b.status==='new').length);
    set('#ctCrew',all.filter(needsCrew).length);
  }

  // ---------- notices (only inside this page) ----------
  // Built from the bookings themselves: the customer opened, signed or declined the offer.
  function events(){
    const ev=[];
    for(const b of all){ const n=(b.data||{}).name||b.id;
      if(b.lastViewAt) ev.push({t:b.lastViewAt,id:b.id,ic:'👁',txt:`${n} öppnade offerten`+(b.views>1?` (${b.views}:e gången)`:'')});
      if(b.signedAt) ev.push({t:b.signedAt,id:b.id,ic:'✅',txt:`${n} signerade – flytten är bokad`});
      if(b.declinedAt&&b.status==='declined') ev.push({t:b.declinedAt,id:b.id,ic:'❌',txt:`${n} tackade nej`+(b.decline?` – ${WHY[b.decline.reason]||''}`:'')});
    }
    return ev.sort((a,b)=>b.t-a.t).slice(0,40);
  }
  const seenKey='fx_seen_at';
  const getSeen=()=>{ try{ return Number(localStorage.getItem(seenKey))||0; }catch(_){ return 0; } };
  const setSeen=(t)=>{ try{ localStorage.setItem(seenKey,String(t)); }catch(_){} };
  let newestSeenInSession=0;
  function updateBell(){
    const bell=$('#bell'); if(!bell) return;
    const n=events().filter(e=>e.t>getSeen()).length, c=$('#bellN');
    c.hidden=!n; c.textContent=n>9?'9+':String(n);
    document.title=(n?`(${n}) `:'')+'Admin – FX Flytt';
  }
  function toast(msg,id){
    const t=$('#toast'); t.textContent=msg; t.hidden=false; t.onclick=()=>{ t.hidden=true; if(id) location.hash=id; };
    clearTimeout(toast.h); toast.h=setTimeout(()=>{ t.hidden=true; },8000);
  }
  function startNotices(){
    if(startNotices.on) return; startNotices.on=true;
    newestSeenInSession=Math.max(0,...events().map(e=>e.t));
    $('#bell').onclick=()=>{
      const p=$('#npanel'); if(!p.hidden){ p.hidden=true; return; }
      const seen=getSeen(), ev=events();
      p.innerHTML=ev.length?ev.map(e=>`<button class="ev${e.t>seen?' unread':''}" data-id="${esc(e.id)}">${e.ic} ${esc(e.txt)}<small>${esc(ago(e.t))}</small></button>`).join(''):'<div class="empty">Inga notiser än.</div>';
      p.hidden=false; setSeen(Date.now()); updateBell();
      p.querySelectorAll('.ev').forEach(x=>x.onclick=()=>{ p.hidden=true; location.hash=x.dataset.id; });
    };
    document.addEventListener('click',(e)=>{ const p=$('#npanel'); if(!p.hidden&&!p.contains(e.target)&&e.target.id!=='bell'&&!$('#bell').contains(e.target)) p.hidden=true; });
    // Check for news every 30 seconds while the page is open and visible.
    setInterval(async()=>{
      if(document.visibilityState!=='visible') return;
      try{ await load(); }catch(_){ return; }
      const fresh=events().filter(e=>e.t>newestSeenInSession);
      if(fresh.length){ newestSeenInSession=fresh[0].t; toast(`${fresh[0].ic} ${fresh[0].txt}${fresh.length>1?` (+${fresh.length-1} till)`:''}`,fresh[0].id);
        if(view==='list'&&document.activeElement?.id!=='q') showList(); else if(view==='today') showToday(); else if(view==='cal'&&!dragging) showCal(); }
    },30000);
  }
  const signedOn=(d)=>all.filter(b=>(b.status==='signed'||b.status==='done')&&b.date===d);

  // ---------- routing ----------
  function route(){
    const id=location.hash.slice(1);
    if(/^FX\d{6}-[0-9A-F]{6}$/.test(id)) return showDetail(id);
    if(id==='ny') return showNew();
    if(id==='kalender') return showCal();
    if(id==='statistik'&&isOwner()) return showStats();
    if(id==='personal') return showTeam();
    if(id==='installningar') return showSettings();
    if(id==='statistik'&&!isOwner()) return showToday();
    if(id==='bokningar') return showList();
    return showToday();
  }
  window.addEventListener('hashchange',()=>{ Promise.resolve().then(route).catch(()=>{}); });
  // Marks the menu item and sets the page title. Returns '' so the views can keep `navBar(x)+…`.
  const TITLES={today:'Idag',list:'Bokningar',cal:'Kalender',team:'Personal och fordon',stat:'Statistik',new:'Ny bokning',set:'Inställningar'};
  function navBar(active,title){
    document.querySelectorAll('#side a.nav').forEach(a=>a.classList.toggle('on',a.dataset.v===active));

        <p class="muted" style="margin:10px 2px 0">Siffran = bokade jobb (orange nästan fullt, röd fullt ${CAP}). Streckade = offert ej signerad. Dra ett jobb till en annan dag för att flytta det.</p></div>${dayList}`;
      handlers={
        start(el,p){ const b=byIdB(el.dataset.id); if(!b) return null; const r=el.getBoundingClientRect(); const g=el.cloneNode(true); g.classList.add('mghost'); g.style.width=r.width+'px'; document.body.appendChild(g); return {b,g,ox:p.x-r.left,oy:p.y-r.top}; },
        move(c,x,y){ c.g.style.left=(x-c.ox)+'px'; c.g.style.top=(y-c.oy)+'px'; clearDrop(); const cell=hit('.day',x,y); if(cell) cell.classList.add('hot'); c.to=cell?cell.dataset.d:null; },
        drop(c){ c.g.remove(); clearDrop(); if(!c.to) return showCal(); moveJob(c.b,{date:c.to},'Flyttad till '+dfmt(c.to,{weekday:'short',day:'numeric',month:'short'})); },
        cancel(c){ c.g.remove(); clearDrop(); showCal(); },
      };
    }

    if(calView==='week'){
      const ws=weekStart(calDate), days=[...Array(7)].map((_,i)=>addDays(ws,i)), PX=46;
      title=`v. ${isoWeek(ws)} · ${dfmt(ws,{day:'numeric',month:'short'})} – ${dfmt(days[6],{day:'numeric',month:'short',year:'numeric'})}`;
      const nowMin=new Date().getHours()*60+new Date().getMinutes();
      const head=days.map(d=>{ const n=signedOn(d).length; return `<div class="wk-h${d===t?' today':''}"><small>${esc(dfmt(d,{weekday:'short'}))}</small><b>${Number(d.slice(8))}</b>${n?`<small class="wk-n">${n} jobb</small>`:''}</div>`; }).join('');
      const ad=days.map(d=>`<div class="wk-ad" data-d="${d}">${all.filter(b=>onCal(b)&&b.date===d&&!b.time).map(b=>`<div class="ev ad${booked(b)?'':' pre'}" data-drag data-id="${esc(b.id)}" style="--c:${esc(colorOf(b))}">${evInner(b,null)}</div>`).join('')}</div>`).join('');
      const cols=days.map(d=>{
        const items=lanes(all.filter(b=>onCal(b)&&b.date===d&&b.time).map(b=>({b,s:S.span(b)})));
        return `<div class="wk-col${d===t?' today':''}" data-d="${d}" style="height:${HOURS*PX}px">${d===t&&nowMin>OPEN&&nowMin<CLOSE?`<div class="now" style="top:${(nowMin-OPEN)/60*PX}px"></div>`:''}${items.map(({b,s,lane,n})=>{
          const top=(s.start-OPEN)/60*PX, h=Math.max(24,(Math.min(s.end,CLOSE)-s.start)/60*PX), clash=S.conflicts(b,all,res).length;
          return `<div class="ev${booked(b)?'':' pre'}${clash?' clash':''}" data-drag data-id="${esc(b.id)}" title="${clash?'Dubbelbokad personal/fordon':''}" style="top:${top}px;height:${h}px;left:calc(${lane*100/n}% + 2px);width:calc(${100/n}% - 4px);--c:${esc(colorOf(b))}">${evInner(b,s)}${h>58?`<div class="ec">${crewChips(b)}</div>`:''}<i class="rz" data-rz></i></div>`;
        }).join('')}</div>`;
      }).join('');
      const gut=[...Array(HOURS)].map((_,i)=>`<div style="height:${PX}px">${String(OPEN/60+i).padStart(2,'0')}</div>`).join('');
      body=`<div class="card" style="padding:12px 12px 16px"><div class="xs"><div class="wk" style="--px:${PX}px">
        <div class="wk-row"><div></div>${head}</div>
        <div class="wk-row"><div class="wk-g" style="padding-top:8px">Ingen tid</div>${ad}</div>
        <div class="wk-row"><div class="wk-g wk-times">${gut}</div>${cols}</div></div></div>
        <p class="muted" style="margin:12px 2px 0">Dra ett jobb för att flytta det, dra nederkanten för att ändra längden.${fine?' Klicka på en tom tid för att skapa en ny bokning.':' Håll kvar fingret på ett jobb för att dra det.'} Röd ram = någon är dubbelbokad.</p></div>`;
      handlers={
        start(el,p){ const b=byIdB(el.dataset.id); if(!b) return null; const s=S.span(b), r=el.getBoundingClientRect(); return {b,s,resize:p.resize&&!!b.time,offY:b.time?p.y-r.top:12,dur:Math.round(S.hoursOf(b)*60)}; },
        move(c,x,y){
          clearDrop();
          if(c.resize){ const col=root.querySelector(`.wk-col[data-d="${c.b.date}"]`), r=col.getBoundingClientRect(); const dur=Math.max(60,Math.min(14*60,snap(OPEN+(y-r.top)/PX*60)-c.s.start)); c.res={dur}; dropBox(col,`top:${(c.s.start-OPEN)/60*PX}px;height:${dur/60*PX}px`,rangeTxt(c.s.start,dur)+' · '+fmtH(dur/60)); return; }
          const tg=hit('.wk-col,.wk-ad',x,y); if(!tg){ c.res=null; return; }
          if(tg.classList.contains('wk-ad')){ tg.classList.add('hot'); c.res={date:tg.dataset.d}; return; }
          const r=tg.getBoundingClientRect(), start=clampStart(snap(OPEN+(y-c.offY-r.top)/PX*60));
          c.res={date:tg.dataset.d,start}; dropBox(tg,`top:${(start-OPEN)/60*PX}px;height:${Math.max(24,c.dur/60*PX)}px`,rangeTxt(start,c.dur));
        },
        drop(c){ clearDrop(); const r=c.res; if(!r) return showCal();
          if(c.resize) return moveJob(c.b,{durationH:r.dur/60},'Längd '+fmtH(r.dur/60));
          const ch={date:r.date}; if(r.start!=null) ch.time=S.fmtMin(r.start);
          moveJob(c.b,ch,'Flyttad till '+dfmt(r.date,{weekday:'short',day:'numeric',month:'short'})+((ch.time||c.b.time)?' '+(ch.time||c.b.time):''));
        },
        cancel(){ clearDrop(); showCal(); },
      };
      if(fine) setTimeout(()=>root.querySelectorAll('.wk-col').forEach(col=>col.addEventListener('click',(e)=>{
        if(e.target!==col||justDragged) return; const r=col.getBoundingClientRect();
        newPrefill={date:col.dataset.d,time:S.fmtMin(clampStart(Math.floor((OPEN+(e.clientY-r.top)/PX*60)/30)*30))}; location.hash='ny';
      })),0);
    }

    if(calView==='team'){
      const d=calDate, PXH=small?60:Math.max(64,Math.floor((Math.min(1200,innerWidth-236)-64-164)/HOURS)), jobs=all.filter(b=>onCal(b)&&b.date===d);
      title=dfmt(d,{weekday:'long',day:'numeric',month:'long'});
      const used=new Set(jobs.flatMap(b=>b.crew||[]));
      const rows=[...res.filter(r=>r.kind==='person'&&(r.active||used.has(r.id))),...res.filter(r=>r.kind==='vehicle'&&(r.active||used.has(r.id)))];
      const row=(rid,kind,name,sub,color,list,cls)=>{
        const items=lanes(list.map(b=>({b,s:S.span(b)}))), L=Math.max(1,...items.map(i=>i.n));
        return `<div class="tl-row${cls||''}" data-r="${esc(rid)}" data-k="${kind}"><div class="tl-name" style="--c:${esc(color)}"><b>${esc(name)}</b><small>${esc(sub)}</small></div>
          <div class="tl-track" style="height:${L*42+8}px">${items.map(({b,s,lane,n})=>{
            const left=(s.start-OPEN)/60*PXH, w=Math.max(44,(Math.min(s.end,CLOSE)-s.start)/60*PXH);
            return `<div class="ev tl${booked(b)?'':' pre'}${n>1&&rid?' clash':''}${s.allDay?' allday':''}" data-drag data-id="${esc(b.id)}" style="left:${left}px;width:${w}px;top:${4+lane*42}px;height:38px;--c:${esc(rid?color:colorOf(b))}">${evInner(b,s)}<i class="rz" data-rz></i></div>`;
          }).join('')}</div></div>`;
      };
      const sub=(list)=>list.length?`${list.length} jobb · ${fmtH(list.reduce((a,b)=>a+S.hoursOf(b),0))}`:'Ledig';
      const un=jobs.filter(b=>!(b.crew||[]).some(id=>resById(id)?.kind==='person'));
      const ticks=[...Array(HOURS+1)].map((_,i)=>`<span style="left:${i*PXH}px">${String(OPEN/60+i).padStart(2,'0')}</span>`).join('');
      body=rows.length?`<div class="card" style="padding:0;overflow:hidden"><div class="xs"><div class="tl" style="--w:${HOURS*PXH}px;--pxh:${PXH}px">
          <div class="tl-row tl-head"><div class="tl-name"></div><div class="tl-track">${ticks}</div></div>
          ${un.length?row('','','Ej tilldelade',un.length+' jobb utan personal','#9aa8b4',un,' un'):''}
          ${rows.map(r=>{ const l=jobs.filter(b=>(b.crew||[]).includes(r.id)); return row(r.id,r.kind,r.name+(r.active?'':' (arkiverad)'),sub(l),r.color,l); }).join('')}
        </div></div></div>
        <p class="muted" style="margin:12px 2px 0">Dra längs raden för att ändra tid, till en annan rad för att byta vem som gör jobbet, högerkanten för att ändra längden.${fine?'':' Håll kvar fingret på ett jobb för att dra det.'} Röd ram = samma person/fordon på två jobb samtidigt.</p>`
        :`<div class="card empty">Lägg till personal och fordon först – <a href="#personal">Personal och fordon</a>.</div>`;
      handlers={
        start(el,p){ const b=byIdB(el.dataset.id); if(!b) return null; const row=el.closest('.tl-row'), s=S.span(b), r=el.getBoundingClientRect();
          return {b,s,row,from:row.dataset.r,kind:row.dataset.k,resize:p.resize&&!s.allDay,offX:s.allDay?10:p.x-r.left,dur:Math.round(S.hoursOf(b)*60)}; },
        move(c,x,y){
          clearDrop();
          let row=hit('.tl-row[data-r]',x,y,false)||c.row;
          const track=()=>row.querySelector('.tl-track');
          if(c.resize){ row=c.row; const r=track().getBoundingClientRect(); const dur=Math.max(60,Math.min(14*60,snap(OPEN+(x-r.left)/PXH*60)-c.s.start)); c.res={dur}; dropBox(track(),`left:${(c.s.start-OPEN)/60*PXH}px;width:${dur/60*PXH}px;top:4px;height:38px`,fmtH(dur/60)); return; }
          if(row.dataset.r&&c.kind&&row.dataset.k!==c.kind) row=c.row;       // a person can't become a vehicle
          const r=track().getBoundingClientRect(), start=clampStart(snap(OPEN+(x-c.offX-r.left)/PXH*60));
          const to=row.dataset.r, nm=to?resById(to)?.name:'Ej tilldelad';
          c.res={to,start}; dropBox(track(),`left:${(start-OPEN)/60*PXH}px;width:${Math.max(44,c.dur/60*PXH)}px;top:4px;height:38px`,rangeTxt(start,c.dur)+(to!==c.from?' → '+nm:''));
        },
        drop(c){ clearDrop(); const r=c.res; if(!r) return showCal();
          if(c.resize) return moveJob(c.b,{durationH:r.dur/60},'Längd '+fmtH(r.dur/60));
          const ch={}, parts=[];
          if(r.start!==c.s.start||c.s.allDay){ ch.time=S.fmtMin(r.start); parts.push('kl. '+ch.time); }
          if(r.to!==c.from){ const crew=(c.b.crew||[]).filter(id=>id!==c.from); if(r.to&&!crew.includes(r.to)) crew.push(r.to); ch.crew=crew;
            parts.unshift((c.from?resById(c.from)?.name:'Ej tilldelad')+' → '+(r.to?resById(r.to)?.name:'ingen')); }
          moveJob(c.b,ch,((c.b.data||{}).name||'')+': '+parts.join(', '));
        },
        cancel(){ clearDrop(); showCal(); },
      };
    }

    root.innerHTML=navBar('cal')+`<main><div class="calbar">
        <div class="seg" id="cv">${[['month','Månad'],['week','Vecka'],['team','Personal']].map(([k,l])=>`<button data-k="${k}" class="${calView===k?'on':''}">${l}</button>`).join('')}</div>
        <div class="cnav"><button id="prev" aria-label="Föregående">‹</button><button id="tdy">Idag</button><button id="next" aria-label="Nästa">›</button></div>
        <b class="ctitle">${esc(title)}</b>
        <label class="tg"><input type="checkbox" id="pre"${showPre?' checked':''}> Visa ej signerade offerter</label></div>
      ${body}</main>`;
    lastCalView=calView;
    const xs=root.querySelector('.xs');
    if(xs&&keepX!=null) xs.scrollLeft=keepX;
    else if(xs&&calView==='team'){ const first=Math.min(...[...root.querySelectorAll('.tl-track .ev')].map(e=>e.offsetLeft)); if(isFinite(first)) xs.scrollLeft=Math.max(0,first-40); }
    root.querySelectorAll('#cv button').forEach(x=>x.onclick=()=>{ calView=x.dataset.k; lsSet('fx_calview',calView); showCal(); });
    const step=(k)=>{ if(calView==='month'){ const [y,m]=calDate.split('-').map(Number); calDate=new Date(Date.UTC(y,m-1+k,1)).toISOString().slice(0,10); calDay=null; } else calDate=addDays(calDate,calView==='week'?7*k:k); showCal(); };
    $('#prev').onclick=()=>step(-1); $('#next').onclick=()=>step(1); $('#tdy').onclick=()=>{ calDate=today(); calDay=null; showCal(); };
    $('#pre').onchange=()=>{ showPre=$('#pre').checked; lsSet('fx_calpre',showPre?'1':'0'); showCal(); };
    root.querySelectorAll('.day').forEach(c=>c.onclick=()=>{ if(justDragged) return; calDay=c.dataset.d; showCal(); });
    root.querySelectorAll('[data-id]').forEach(e=>e.addEventListener('click',(ev)=>{ ev.stopPropagation(); if(justDragged) return; location.hash=e.dataset.id; }));
    if(handlers) enableDrag(root.querySelector('main'),handlers);
  }

  // ---------- detail ----------
  async function showDetail(id){
    let b=all.find(x=>x.id===id);
    try{ b=await api('/api/admin/bookings?id='+id); const i=all.findIndex(x=>x.id===id); if(i>=0) all[i]=b; else all.unshift(b); }catch(e){ if(!b){ root.innerHTML=navBar('list')+`<main><div class="empty">Bokningen hittades inte.</div></main>`; bindNav(); return; } }
    const d=b.data||{}, o=b.offer;
    const rows=[['Tjänst',d.size],['Från',d.from],['Till',d.to],['Avstånd',d.distanceKm?'ca '+d.distanceKm+' km':''],['Önskat datum',d.date],['Boyta',d.areaM2?d.areaM2+' m²':''],['Bostad',d.home],['Våning (från)',d.floorFrom],['Våning (till)',d.floorTo],['Tillval',(d.extras||[]).join(', ')],['Volym',d.volume?String(d.volume.m3).replace('.',',')+' m³':''],['Meddelande',d.message]];
    const locked=b.status==='signed'||b.status==='done';
    const DURS=[];for(let h=1;h<=14;h+=.5)DURS.push(h);
    const est=S.estimateHours(b);
    root.innerHTML=navBar('list',d.name||b.id)+`<main><button class="back" id="back">‹ Tillbaka</button>
    <div class="cols"><div>
      <div class="card"><div class="top" style="display:flex;justify-content:space-between;gap:8px;align-items:center"><b style="font-size:20px">${esc(d.name)}</b><span class="st ${b.status}">${ST[b.status]}</span></div>
        <div class="muted">${esc(b.id)} · skapad ${esc(fmtTs(b.createdAt))} · ${b.source==='web'?'från hemsidan':'manuell'}</div>
        <div class="btns" style="margin-top:6px"><a class="btn sec" href="${esc(tel(d.phone))}">Ring ${esc(d.phone)}</a><a class="btn sec" href="sms:${esc(String(d.phone||'').replace(/\s/g,''))}">SMS</a></div>
        ${d.email?`<div class="muted" style="margin-top:8px">E-post: <a href="mailto:${esc(d.email)}">${esc(d.email)}</a></div>`:'<div class="warn">Kunden har ingen e-post – skicka länken via SMS.</div>'}
      </div>
      ${b.signature?`<div class="okmsg">Signerad av "${esc(b.signature.name)}"${b.signature.pnr?` · Personnr ${esc(b.signature.pnr)}`:''}${b.signature.orgnr?` · Org.nr ${esc(b.signature.orgnr)} (företag)`:''} ${esc(fmtTs(b.signature.at))} (IP ${esc(b.signature.ip)})</div>`:''}
      <div class="card" id="plan"><h3>Planering</h3>
        ${locked?'<div class="warn">Offerten är signerad. Flyttar du datum eller tid – prata med kunden först.</div>':''}
        <div class="row3"><div><label class="f" for="dt">Flyttdatum</label><input id="dt" type="date" value="${esc(b.date||'')}"></div>
        <div><label class="f" for="tm">Starttid</label><select id="tm">${timeOpts(b.time)}</select></div>
        <div><label class="f" for="du">Längd</label><select id="du"><option value="">Auto (${esc(fmtH(est))})</option>${DURS.map(h=>`<option value="${h}"${b.durationH===h?' selected':''}>${esc(fmtH(h))}</option>`).join('')}</select></div></div>
        <div class="muted" id="planinfo" style="margin-top:8px"></div>
        <div id="daywarn"></div>
        ${res.length?`<label class="f">Personal</label><div class="pick" id="pickP"></div><label class="f">Fordon</label><div class="pick" id="pickV"></div>`
          :`<div class="dbox" style="margin-top:12px"><b>Ingen personal inlagd än.</b><div class="muted">Lägg till personal och fordon så kan du välja dem här och se krockar direkt.</div><a class="btn sec sm" style="margin-top:10px;display:inline-flex" href="#personal">Lägg till personal</a></div>`}
        <div id="clash"></div>
        <button class="btn" id="psave">Spara planering</button><div id="msgp"></div></div>
      <div class="card" id="wo"><h3>Arbetsorder för personalen</h3>
        <div class="muted">En sida med adresser, tid, kundens telefon, våning och hiss – utan pris. Skriv ut den eller skicka länken till personalen.</div>
        <label class="f" for="cw">Att tänka på (syns för personalen)</label><textarea id="cw" style="min-height:64px" placeholder="T.ex. portkod 1234, pianot står i källaren, ring kunden 30 min innan">${esc(b.crewNote||'')}</textarea>
        <div class="btns"><button class="btn" id="woopen">🖨 Öppna / skriv ut</button><button class="btn sec" id="wolink">Kopiera länk</button></div>
        <div id="wosms" class="tags" style="margin-top:10px"></div><div id="msgw"></div>
        <button class="back" id="worenew"${b.workToken?'':' hidden'} style="padding:10px 0 0;font-size:13px;font-weight:600;color:var(--muted)">Gör en ny länk (den gamla slutar fungera)</button></div>
      ${['declined','cancelled'].includes(b.status)&&!b.boxes?'':`<div class="card" id="bx"><h3>Hyrkartonger ${boxesLeft(b)?`<span class="sub">${boxesLeft(b)} ute</span>`:''}</h3>
        ${!b.boxes?`${rentsBoxes(b)?'<div class="warn" style="margin-top:0">Kunden har valt flyttkartonger – registrera dem när de lämnas ut.</div>':'<div class="muted">Inga hyrkartonger.</div>'}<button class="btn sec" id="bx_new">+ Lämna ut kartonger</button>`
        :`${boxesLeft(b)===0?`<div class="okmsg" style="margin-top:0">Alla ${b.boxes.qty} kartonger är tillbaka${b.boxes.returnedDate?' ('+esc(fmtDate(b.boxes.returnedDate))+')':''}.</div>`
          :b.boxes.dueDate<today()?`<div class="warn" style="margin-top:0"><b>Försenade:</b> ${boxesLeft(b)} kartonger skulle varit tillbaka ${esc(fmtDate(b.boxes.dueDate))}</div>`
          :`<div class="muted">${boxesLeft(b)} av ${b.boxes.qty} ute · tillbaka senast <b>${esc(fmtDate(b.boxes.dueDate))}</b></div>`}`}
        <div id="bx_form"${b.boxes?'':' hidden'}>
          <div class="row2"><div><label class="f" for="bx_qty">Antal utlämnade</label><input id="bx_qty" type="number" inputmode="numeric" min="1" value="${b.boxes?b.boxes.qty:((window.FX_PRICES||{}).boxes||{}).qty||50}"></div>
            <div><label class="f" for="bx_ret">Tillbaka hittills</label><input id="bx_ret" type="number" inputmode="numeric" min="0" value="${b.boxes?b.boxes.returned:0}"></div></div>
          <div class="row2"><div><label class="f" for="bx_out">Utlämnade</label><input id="bx_out" type="date" value="${esc(b.boxes?.outDate||today())}"></div>
            <div><label class="f" for="bx_due">Tillbaka senast</label><input id="bx_due" type="date" value="${esc(b.boxes?.dueDate||addDays(b.date&&b.date>today()?b.date:today(),30))}"></div></div>
          <label class="f" for="bx_note">Anteckning</label><input id="bx_note" value="${esc(b.boxes?.note||'')}" placeholder="T.ex. hämtas vid trapphuset">
          <div class="btns"><button class="btn sec" id="bx_save">Spara</button>${b.boxes&&boxesLeft(b)?'<button class="btn gray" id="bx_all">Alla tillbaka</button>':''}</div>
          ${b.boxes&&boxesLeft(b)&&d.email?`<button class="btn sec" id="bx_mail">Mejla påminnelse till kunden</button>${b.boxes.remindedAt?`<div class="muted" style="margin-top:6px">Påminnelse skickad ${esc(fmtTs(b.boxes.remindedAt))}</div>`:''}`:''}
          ${b.boxes?'<button class="back" id="bx_del" style="padding:10px 0 0;font-size:13px;font-weight:600;color:var(--muted)">Ta bort registreringen</button>':''}
        </div><div id="bx_msg"></div></div>`}
      <div class="card"><h3>Pris</h3>
        ${locked?'<div class="warn">Offerten är signerad. Ändrar du priset nu gäller det inte automatiskt – prata med kunden först.</div>':''}
        <label class="f" for="tot">Pris efter RUT (kr)</label><input id="tot" type="number" inputmode="numeric" value="${o?esc(o.total):''}">
        ${o&&!o.custom&&o.lines?.length?`<div class="muted" style="margin-top:6px">${o.lines.map(l=>esc(l.label)+': '+kr(l.amount)).join('<br>')}</div>`:''}
        ${o?.notIncluded?.length?`<div class="warn"><b>Ingår inte i priset:</b><br>${o.notIncluded.map(esc).join('<br>')}</div>`:''}
        <label class="f" for="cn">Text till kunden (syns i offerten)</label><textarea id="cn" placeholder="T.ex. Inkl. 4 timmar montering">${esc(o?.customerNote||'')}</textarea>
        <label class="f" for="an">Intern anteckning (syns bara här)</label><textarea id="an">${esc(b.adminNote||'')}</textarea>
        <button class="btn sec" id="save">Spara</button><div id="msg"></div></div>
      <div class="card"><h3>Offert</h3>

  // ---------- new ----------
  // Customers we already know, one per phone number (latest booking wins).
  const digits=(x)=>String(x||'').replace(/\D/g,'').replace(/^46/,'0');
  function customers(){
    const m=new Map();
    for(const b of all.slice().sort((x,y)=>(y.createdAt||0)-(x.createdAt||0))){ const d=b.data||{}, k=digits(d.phone); if(!k) continue;
      if(!m.has(k)) m.set(k,{name:d.name,phone:d.phone,email:d.email,from:d.from,to:d.to,n:0,ids:[]});
      const c=m.get(k); c.n++; c.ids.push(b.id); if(!c.email&&d.email) c.email=d.email; }
    return [...m.values()];
  }
  const SVC=[['move|bas','Bara flytt – Bas'],['move|premium','Flytt + flyttstäd – Premium, 10 % rabatt'],['move|deluxe','Flytt + flyttstäd + packning – Deluxe, 20 % rabatt'],['hourly|','Flytt per timme'],['cleaning|','Bara flyttstäd'],['other|','Kontorsflytt, piano eller annat']];

  async function photon(q){

    const j=await r.json(), seen=new Set();
    return j.features.filter(f=>f.properties.countrycode==='SE').map(f=>{ const p=f.properties;
      const qn=(q.match(/\b(\d+\s?[a-zA-Z]?)\b/)||[])[1];

        <button class="btn sec sm" data-addrow="${key}" style="margin-top:8px">+ Rad</button>`; };
    const draw=()=>{
      const d=diff(), c=cur, fld=(label,path,val,old)=>`<div><label class="f">${label}</label><div class="${ch(old,val)}" style="border-radius:10px">${inp(path,val)}</div></div>`;
      el.innerHTML=`<div class="card"><h3>Prislista <span class="sub">${c.changedAt?'ändrad '+esc(fmtTs(c.changedAt))+(c.changedBy?' av '+esc(c.changedBy):''):'standardpriserna'}</span></h3>
          <div class="muted">Alla priser inkl. moms <b>efter RUT-avdrag</b>. Nya priser gäller direkt i prisräknaren på hemsidan, på alla sidor med priser, i chatten och i nya offerter. <b>Skickade och signerade offerter behåller sitt pris.</b> Paketrabatterna (Premium −${c.packages.premium.discountPct} %, Deluxe −${c.packages.deluxe.discountPct} %) ändras inte här.</div></div>
        <div class="cols"><div>
          <div class="card"><h3>Flytt per timme</h3><div class="row2">${fld('2 personer + bil','hourly.2',f.hourly['2'],c.hourly['2'])}${fld('3 personer + bil','hourly.3',f.hourly['3'],c.hourly['3'])}</div>
            <div class="row2">${fld('4 personer + 2 bilar','hourly.4',f.hourly['4'],c.hourly['4'])}${fld('Minst antal timmar','hourly.minHours',f.hourly.minHours,c.hourly.minHours)}</div></div>
          <div class="card"><h3>Körsträcka (fast pris)</h3><div class="row2">${fld('Kr per km','km.pricePerKm',f.km.pricePerKm,c.km.pricePerKm)}${fld('Gratis under (km)','km.freeBelowKm',f.km.freeBelowKm,c.km.freeBelowKm)}</div></div>
          <div class="card"><h3>Flyttkartonger</h3><div class="row3">${fld('Antal','boxes.qty',f.boxes.qty,c.boxes.qty)}${fld('Köpa (kr)','boxes.buy',f.boxes.buy,c.boxes.buy)}${fld('Hyra (kr)','boxes.rent',f.boxes.rent,c.boxes.rent)}</div></div>
          <div class="card"><h3>Flyttstäd – fast pris efter boyta</h3>${tblHtml('cleaning',f.cleaning,false)}</div>
        </div><div>
          <div class="card"><h3>Flytt – fast pris efter boyta</h3><div class="muted" style="margin-bottom:6px">Boytan avrundas uppåt till närmaste rad. Över sista raden: offert.</div>${tblHtml('moveFixed',f.moveFixed,true)}</div>
        </div></div>
        <div class="card" id="pchg" style="position:sticky;bottom:${matchMedia('(max-width:899px)').matches?'76':'12'}px;z-index:5;box-shadow:var(--sh2)">
          ${d.length?`<h3>${d.length} ändring${d.length>1?'ar':''} – inte sparade än</h3><div class="pdiff">${d.slice(0,12).map(x=>`<div><span>${esc(x[0])}</span><span><s>${esc(typeof x[1]==='number'?String(x[1]):x[1])}</s> → <b>${esc(typeof x[2]==='number'?String(x[2]):x[2])}</b></span></div>`).join('')}${d.length>12?`<div class="muted">+${d.length-12} till</div>`:''}</div>
            <div class="btns"><button class="btn gray" id="p_reset">Ångra ändringarna</button><button class="btn" id="p_save">Spara nya priser</button></div>`
          :'<div class="muted">Inga ändringar. Ändra ett pris ovan – ändrade fält blir gula.</div>'}<div id="p_msg"></div></div>
        <div class="card"><h3>Tidigare prislistor</h3>${data.log.length?data.log.map((p,i)=>`<div class="todo"><a><b>${p.changedAt?esc(fmtTs(p.changedAt)):'Standardpriserna'}${p.changedBy?' · '+esc(p.changedBy):''}</b><small>2 pers ${p.hourly['2']} kr/tim · ${p.km.pricePerKm} kr/km · flytt från ${kr(p.moveFixed[0][1])} · städ från ${kr(p.cleaning[0][1])}</small></a><button class="btn sec sm" data-load="${i}">Ladda in</button></div>`).join(''):'<div class="muted">Inga tidigare ändringar.</div>'}
          <button class="btn sec sm" id="p_default" style="margin-top:10px">Ladda in standardpriserna</button></div>`;
      el.querySelectorAll('.pin').forEach(x=>x.onchange=()=>{ const p=x.dataset.p.split('.'); let o=f; while(p.length>1) o=o[p.shift()]; o[p[0]]=n(x.value); draw(); });
      el.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>{ const [k,i]=x.dataset.del.split('.'); if(f[k].length<=1) return; f[k].splice(Number(i),1); draw(); });
      el.querySelectorAll('[data-addrow]').forEach(x=>x.onclick=()=>{ const k=x.dataset.addrow, last=f[k][f[k].length-1]; f[k].push(k==='moveFixed'?[last[0]+20,last[1]+1000,last[2]]:[last[0]+20,last[1]+500]); draw(); });
      el.querySelectorAll('[data-load]').forEach(x=>x.onclick=()=>{ f=clone(data.log[Number(x.dataset.load)]); draw(); $('#pchg').scrollIntoView({block:'end',behavior:'smooth'}); });
      $('#p_default').onclick=()=>{ f=clone(data.default); draw(); };
      if($('#p_reset')) $('#p_reset').onclick=()=>{ f=clone(cur); draw(); };
      if($('#p_save')) $('#p_save').onclick=async()=>{
        if(!confirm(`Spara ${d.length} prisändring${d.length>1?'ar':''}? De gäller direkt på hemsidan och i nya offerter.`)) return;
        try{ cur=await api('/api/admin/prices',{method:'PUT',body:JSON.stringify(f)}); data=await api('/api/admin/prices'); cur=data.current; f=clone(cur); window.FX_PRICES={...window.FX_PRICES,...cur}; draw(); notify('Nya priser sparade ✓ – hemsidan visar dem inom en minut'); }
        catch(e){ $('#p_msg').innerHTML=`<div class="err">${esc(e.message)}</div>`; }
      };
    };
    draw();
  };

  // ---- backups (owner) ----
  SET_TABS.push(['backup','Säkerhetskopior',true]);
  SETTINGS.backup=async(el)=>{
    let info; try{ info=await api('/api/admin/backup'); }catch(e){ el.innerHTML=`<div class="err">${esc(e.message)}</div>`; return; }
    const size=(n)=>n>1e6?(n/1e6).toFixed(1).replace('.',',')+' MB':Math.max(1,Math.round(n/1e3))+' kB';
    const restore=async(url,body,label)=>{
      if(!confirm(`Lägga tillbaka det som saknas från ${label}?\n\nInget som finns nu skrivs över.`)) return;
      try{ const r=await api(url,{method:'POST',body,headers:body?{'Content-Type':'application/octet-stream'}:{}});
        $('#b_msg').innerHTML=r.keys?`<div class="okmsg">Klart: ${r.bookings} bokningar och ${r.keys} poster lades tillbaka.</div>`:'<div class="okmsg">Inget saknades – allt i kopian finns redan.</div>';
        syncedAt=0; await load(); }
      catch(e){ $('#b_msg').innerHTML=`<div class="err">${esc(e.message)}</div>`; }
    };
    el.innerHTML=`<div class="card"><h3>Automatiska kopior varje dag</h3>
        ${info.blob?`<div class="muted">Varje morgon sparas en krypterad kopia av allt i bokningssystemet (bokningar, personal, användare, inställningar, priser). De 30 senaste behålls. Fotona ligger redan i Vercel Blob.</div>
          ${info.backups.length?info.backups.map(b=>`<div class="todo"><a><b>${esc(new Date(b.uploadedAt).toLocaleString('sv-SE',{dateStyle:'medium',timeStyle:'short'}))}</b><small>${esc(size(b.size))}</small></a>
            <a class="btn sec sm" style="flex:0 0 auto" href="/api/admin/backup?file=${encodeURIComponent(b.pathname)}">Ladda ner</a><button class="btn gray sm" data-rs="${esc(b.pathname)}">Återställ saknade</button></div>`).join(''):'<div class="warn">Ingen kopia än – den första görs i morgon bitti, eller tryck nedan.</div>'}
          <button class="btn sec" id="b_run">Gör en kopia nu</button>`
        :`<div class="warn"><b>Vercel Blob är inte kopplat.</b> Då kan kopiorna inte sparas automatiskt. Gör så här: Vercel → projektet → <b>Storage</b> → <b>Create</b> → <b>Blob</b> → koppla till projektet (samma som för personalens foton). Sedan görs en kopia varje morgon.</div>`}</div>
      <div class="card"><h3>Ladda ner</h3>
        <div class="muted">Spara gärna en kopia på datorn ibland. <b>Filen innehåller kunduppgifter</b> – förvara den säkert.</div>
        <div class="btns"><a class="btn sec" href="/api/admin/backup?file=now">⬇ Full kopia (.json.gz)</a><a class="btn sec" href="/api/admin/backup?file=excel">⬇ Alla bokningar i Excel</a></div></div>
      <div class="card"><h3>Återställ från en fil</h3>
        <div class="muted">Välj en kopia du har laddat ner. <b>Bara det som saknas läggs tillbaka</b> (t.ex. bokningar som försvunnit) – inget som finns nu ändras eller skrivs över.</div>
        <input type="file" id="b_file" accept=".gz,.json,.fxb,application/gzip,application/json" style="margin-top:10px">
        <button class="btn sec" id="b_up">Återställ saknade från filen</button></div>
      <div id="b_msg"></div>`;
    if($('#b_run')) $('#b_run').onclick=async()=>{ const x=$('#b_run'); x.disabled=true; x.textContent='Sparar…';
      try{ await api('/api/admin/backup?do=run',{method:'POST'}); notify('Kopian är sparad ✓'); SETTINGS.backup(el); }catch(e){ x.disabled=false; x.textContent='Gör en kopia nu'; $('#b_msg').innerHTML=`<div class="err">${esc(e.message)}</div>`; } };
    el.querySelectorAll('[data-rs]').forEach(x=>x.onclick=()=>restore('/api/admin/backup?do=restore&from='+encodeURIComponent(x.dataset.rs),null,'kopian'));
    $('#b_up').onclick=async()=>{ const f=$('#b_file').files[0]; if(!f) return $('#b_msg').innerHTML='<div class="err">Välj en fil först.</div>'; restore('/api/admin/backup?do=restore',await f.arrayBuffer(),f.name); };
  };

  // ---------- staff and vehicles ----------
  const ROLES={person:['Flyttledare','Flyttare','Städare','Chaufför','Montör'],vehicle:['Lastbil','Skåpbil','Släp']};
  const COLORS=['#2f6fb2','#1f8a4c','#c2560a','#a2479b','#0f8a8a','#b42318','#5a52c7','#8a6d1f','#3d5a6c','#d6457a'];
  async function teamSave(id,body){
    const r=await api('/api/admin/team'+(id?'?id='+encodeURIComponent(id):''),{method:id?'PATCH':'POST',body:JSON.stringify(body)});
    const i=res.findIndex(x=>x.id===r.id); if(i>=0) res[i]=r; else res.push(r);
    updateCounts(); return r;
  }
  function showTeam(){
    view='team';
    const t=today(), horizon=addDays(t,30);
    const upcoming=(r)=>all.filter(b=>!S.INACTIVE.includes(b.status)&&b.date&&b.date>=t&&(b.crew||[]).includes(r.id)).sort(byTime);
    const list=res.filter(r=>r.kind===teamKind), act=list.filter(r=>r.active), arch=list.filter(r=>!r.active);
    const card=(r)=>{
      const up=upcoming(r), soon=up.filter(b=>b.date<=horizon), nx=up[0];
      return `<div class="tcard${r.active?'':' off'}" style="--c:${esc(r.color)}">
        <div class="nm">${esc(r.name)}${r.active?'':'<span class="tag">Arkiverad</span>'}</div>
        <div class="meta">${esc(r.role||(r.kind==='vehicle'?'Fordon':'Personal'))}${r.phone?` · <a href="${esc(tel(r.phone))}">${esc(r.phone)}</a>`:''}</div>
        ${r.note?`<div class="meta" style="margin-top:4px">${esc(r.note)}</div>`:''}
        <div class="next">${nx?`Nästa: <b>${esc(fmtDate(nx.date))}</b> ${esc(whenTxt(nx))} · ${esc((nx.data||{}).name||'')}<div class="muted">${soon.length} jobb kommande 30 dagar</div>`:'<span class="muted">Inga kommande jobb</span>'}</div>
        ${openRes===r.id&&up.length?`<div class="jl">${up.slice(0,12).map(b=>`<a href="#${esc(b.id)}"><span>${esc(fmtDate(b.date))} · ${esc(whenTxt(b))}</span><b>${esc((b.data||{}).name||b.id)}</b></a>`).join('')}</div>`:''}
        <div class="acts">${up.length?`<button class="btn gray sm" data-open="${esc(r.id)}">${openRes===r.id?'Dölj jobb':'Visa jobb'}</button>`:''}
          <button class="btn sec sm" data-edit="${esc(r.id)}">Ändra</button>
          ${r.active?`<button class="btn red sm" data-arch="${esc(r.id)}">Arkivera</button>`:`<button class="btn sec sm" data-restore="${esc(r.id)}">Återställ</button>`}</div></div>`;
    };
    const e=teamEdit, editing=e&&(e.id?res.find(x=>x.id===e.id):null);
    const f=editing||{kind:teamKind,name:'',phone:'',role:'',note:'',color:COLORS.find(c=>!res.some(r=>r.active&&r.color===c))||COLORS[0]};
    const form=e?`<div class="card" id="tform"><h3>${editing?'Ändra '+esc(editing.name):teamKind==='person'?'Ny person':'Nytt fordon'}</h3>
        <div class="row2"><div><label class="f" for="t_name">${teamKind==='person'?'Namn':'Namn / reg.nr'} *</label><input id="t_name" value="${esc(f.name)}" placeholder="${teamKind==='person'?'T.ex. Ahmad':'T.ex. Lastbil 1 – ABC 123'}" autocomplete="off"></div>
        <div><label class="f" for="t_role">${teamKind==='person'?'Roll':'Typ'}</label><input id="t_role" value="${esc(f.role||'')}" list="t_roles" placeholder="${ROLES[teamKind][0]}"><datalist id="t_roles">${ROLES[teamKind].map(x=>`<option value="${x}">`).join('')}</datalist></div></div>
        ${teamKind==='person'?`<label class="f" for="t_phone">Telefon</label><input id="t_phone" type="tel" value="${esc(f.phone||'')}">`:''}
        <label class="f">Färg i kalendern</label><div class="sw" id="t_sw">${COLORS.map(c=>`<button type="button" data-c="${c}" class="${c===f.color?'on':''}" style="--c:${c}" aria-label="Färg ${c}"></button>`).join('')}</div>
        <label class="f" for="t_note">Anteckning</label><textarea id="t_note" style="min-height:56px" placeholder="${teamKind==='person'?'T.ex. har B-körkort, jobbar inte söndagar':'T.ex. 20 m³, bakgavellyft'}">${esc(f.note||'')}</textarea>
        <div class="btns"><button class="btn gray" id="t_cancel">Avbryt</button><button class="btn" id="t_save">Spara</button></div><div class="err" id="t_err"></div></div>`:'';
    root.innerHTML=navBar('team')+`<main>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px">
        <div class="seg"><button data-k="person" class="${teamKind==='person'?'on':''}">Personal (${res.filter(r=>r.kind==='person'&&r.active).length})</button><button data-k="vehicle" class="${teamKind==='vehicle'?'on':''}">Fordon (${res.filter(r=>r.kind==='vehicle'&&r.active).length})</button></div>
        <button class="btn sm" id="t_add" style="margin-left:auto">+ ${teamKind==='person'?'Ny person':'Nytt fordon'}</button></div>
      ${form}
      ${act.length?`<div class="tgrid">${act.map(card).join('')}</div>`:`<div class="card empty">${teamKind==='person'?'Ingen personal inlagd än. Lägg till dina flyttare – sedan väljer du vem som gör vilket jobb inne i bokningen.':'Inga fordon inlagda än.'}</div>`}
      ${arch.length?`<button class="btn gray sm" id="t_arch">${showArch?'Dölj':'Visa'} arkiverade (${arch.length})</button>${showArch?`<div class="tgrid" style="margin-top:12px">${arch.map(card).join('')}</div>`:''}`:''}
    </main>`;
    root.querySelectorAll('.seg button').forEach(x=>x.onclick=()=>{ teamKind=x.dataset.k; teamEdit=null; openRes=null; showTeam(); });
    $('#t_add').onclick=()=>{ teamEdit={}; showTeam(); $('#t_name').focus(); };
    if($('#t_arch')) $('#t_arch').onclick=()=>{ showArch=!showArch; showTeam(); };
    root.querySelectorAll('[data-open]').forEach(x=>x.onclick=()=>{ openRes=openRes===x.dataset.open?null:x.dataset.open; showTeam(); });
    root.querySelectorAll('[data-edit]').forEach(x=>x.onclick=()=>{ teamEdit={id:x.dataset.edit}; showTeam(); $('#tform').scrollIntoView({block:'start',behavior:'smooth'}); });
    root.querySelectorAll('[data-arch]').forEach(x=>x.onclick=async()=>{
      const r=resById(x.dataset.arch), n=upcoming(r).length;
      if(!confirm(`Arkivera ${r.name}?`+(n?`\n\n${r.kind==='vehicle'?'Fordonet':'Personen'} står kvar på ${n} kommande jobb – byt ut ${r.kind==='vehicle'?'det':'personen'} där.`:''))) return;
      try{ await teamSave(r.id,{active:false}); showTeam(); }catch(err){ alert(err.message); }
    });
    root.querySelectorAll('[data-restore]').forEach(x=>x.onclick=async()=>{ try{ await teamSave(x.dataset.restore,{active:true}); showTeam(); }catch(err){ alert(err.message); } });
    if(e){
      let color=f.color;
      root.querySelectorAll('#t_sw button').forEach(x=>x.onclick=()=>{ color=x.dataset.c; root.querySelectorAll('#t_sw button').forEach(y=>y.classList.toggle('on',y===x)); });
      $('#t_cancel').onclick=()=>{ teamEdit=null; showTeam(); };
      $('#t_save').onclick=async()=>{
        const body={kind:teamKind,name:$('#t_name').value,role:$('#t_role').value,note:$('#t_note').value,color};
        if($('#t_phone')) body.phone=$('#t_phone').value;
        const btn=$('#t_save'); btn.disabled=true;
        try{ await teamSave(editing?editing.id:null,body); teamEdit=null; showTeam(); }
        catch(err){ $('#t_err').textContent=err.message; btn.disabled=false; }
      };
    }
  }

  start().catch(e=>{ root.innerHTML=`<main><div class="err">${esc(e.message)}</div></main>`; });
})();
</script>
</body>
</html>
