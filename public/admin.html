<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Bokningar – FX Flytt</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root{--navy:#0d2a3f;--accent:#ff7a1a;--ink:#14212b;--muted:#5b6b78;--line:#e3e8ed;--bg:#f2f5f8;--green:#1f8a4c;--red:#b42318}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{background:var(--navy);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
  .logo{background:#fff;color:var(--navy);font-weight:900;font-style:italic;padding:3px 8px;border-radius:7px;border-left:4px solid var(--accent)}
  header b{flex:1;font-size:17px}
  #bell{position:relative;font-size:16px;padding:5px 10px}
  #bellN{position:absolute;top:-6px;right:-6px;background:#e5484d;color:#fff;border-radius:999px;font-size:11px;font-weight:800;min-width:18px;height:18px;line-height:18px;padding:0 4px}
  #npanel{position:fixed;top:56px;right:8px;left:8px;max-width:420px;margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.18);z-index:9;max-height:70vh;overflow:auto}
  #npanel .ev{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:#fff;padding:11px 14px;font:inherit;color:var(--ink,#16202a)}
  #npanel .ev.unread{background:#fff7ef}#npanel .ev small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
  #toast{position:fixed;left:12px;right:12px;bottom:16px;max-width:440px;margin:0 auto;background:var(--navy);color:#fff;border-radius:14px;padding:13px 16px;z-index:10;box-shadow:0 10px 30px rgba(0,0,0,.25);font-weight:600}
  header button{background:none;border:1px solid #47637a;color:#cfe0ec;border-radius:999px;padding:6px 12px;font-size:13px}
  nav{display:flex;gap:6px;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:52px;z-index:4}
  nav button{flex:1;border:1px solid #cfd9e2;background:#fff;border-radius:10px;padding:10px 4px;font-weight:700;font-size:13px;color:var(--navy)}
  nav button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  main{max-width:760px;margin:0 auto;padding:12px 12px 90px}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px}
  .chips button{white-space:nowrap;border:1px solid #cfd9e2;background:#fff;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--navy)}
  .chips button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .item{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;color:inherit;font:inherit}
  .item .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
  .item b{font-size:16px}
  .muted{color:var(--muted);font-size:13px}
  .st{font-size:11px;font-weight:800;border-radius:999px;padding:3px 9px;white-space:nowrap;text-transform:uppercase}
  .st.new{background:#fff1e6;color:#c2560a}.st.sent{background:#e8f0fb;color:#1f5fae}.st.signed{background:#e6f5ec;color:var(--green)}
  .st.declined,.st.cancelled{background:#fdecec;color:var(--red)}.st.done{background:#eceff2;color:#47525c}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .card h3{margin:0 0 8px;font-size:15px;color:var(--navy)}
  table{width:100%;border-collapse:collapse}
  td{padding:6px 0;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
  td:first-child{color:var(--muted);width:36%}
  label.f{display:block;font-weight:700;font-size:13px;margin:10px 0 4px}
  input,textarea,select{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1.5px solid #c9d5df;border-radius:10px;background:#fff}
  textarea{min-height:70px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .btn{display:block;width:100%;border:0;border-radius:999px;padding:13px;font-size:15px;font-weight:800;background:var(--accent);color:#fff;margin-top:8px;text-align:center;text-decoration:none}
  .btn.sec{background:#fff;color:var(--navy);border:2px solid var(--navy)}
  .btn.gray{background:#eceff2;color:#47525c}
  .btn.red{background:#fff;color:var(--red);border:2px solid #f0c4c0}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:#eef2f5;color:#4a5a67}
  .tag.seen{background:#e8f1fb;color:#1d5fa8}.tag.ok{background:#e6f5ec;color:var(--green)}.tag.no{background:#fdecec;color:#b42318}
  .xrow{display:flex;gap:6px;margin:6px 0}.xrow input:first-child{flex:1;min-width:0}.xrow input[type=number]{width:96px}.xrow button{border:1px solid var(--line);background:#fff;border-radius:10px;width:40px;color:#b42318}
  .sugg{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:6px}.sugg button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:#fff;padding:9px 12px;font:inherit}.sugg small{display:block;color:var(--muted);font-size:12px}
  a.hist{display:block;padding:7px 0;border-bottom:1px solid var(--line);color:var(--navy);text-decoration:none}
  [hidden]{display:none!important}
  .dbox{border:1px solid var(--line,#e3e8ed);border-radius:12px;padding:12px;margin-top:8px}
  .warn{background:#fff4e5;border:1px solid #ffd6a8;color:#8a4b00;border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0}
  .okmsg{background:#e6f5ec;border:1px solid #bfe5cf;color:var(--green);border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0;font-weight:600}
  .err{color:var(--red);font-weight:600;font-size:14px;margin-top:8px}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal .h{font-size:11px;color:var(--muted);text-align:center;font-weight:700}
  .cal button{aspect-ratio:1/1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px;font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:space-between;color:var(--ink)}
  .cal button.out{opacity:.35}.cal button.today{border:2px solid var(--navy)}
  .cal button .n{font-size:13px;font-weight:700}
  .cal button .c{font-size:11px;font-weight:800;border-radius:999px;padding:1px 6px;background:#e6f5ec;color:var(--green)}
  .cal button .c.mid{background:#fff4e5;color:#8a4b00}.cal button .c.full{background:#fdecec;color:var(--red)}
  .cal button .p{font-size:10px;color:#1f5fae}
  .calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .calhead button{border:1px solid #cfd9e2;background:#fff;border-radius:10px;padding:8px 14px;font-size:16px}
  .back{background:none;border:0;color:var(--navy);font-weight:700;font-size:15px;padding:4px 0 10px}
  .hist div{font-size:13px;padding:4px 0;border-bottom:1px dashed var(--line)}
  .srch{display:flex;gap:8px;margin-bottom:10px}.srch input{flex:1;min-width:0}.srch select{width:auto;flex:0 0 auto}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  .kpi{border-radius:14px;padding:12px;color:#fff}.kpi small{display:block;font-size:12px;opacity:.9;font-weight:600}.kpi b{font-size:22px}
  .bars{display:flex;align-items:flex-end;gap:6px;height:150px;border-bottom:1px solid var(--line);padding-top:6px}
  .bars .m{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:2px;height:100%}
  .bars .m i{display:block;width:30%;border-radius:4px 4px 0 0;min-height:1px}
  .blab{display:flex;gap:6px}.blab span{flex:1;text-align:center;font-size:11px;color:var(--muted);padding-top:4px}
  .leg{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
  .hbar{height:8px;border-radius:4px;background:#eef2f5;overflow:hidden;margin:4px 0 10px}.hbar i{display:block;height:100%;background:var(--accent)}
  .empty{text-align:center;color:var(--muted);padding:30px 10px}
  .login{max-width:380px;margin:60px auto;padding:0 14px}
  a{color:var(--navy)}
</style>
</head>
<body>
<header><span class="logo">FX</span><b>Bokningar</b><button id="bell" hidden aria-label="Notiser">🔔<span id="bellN" hidden></span></button><button id="logout" hidden>Logga ut</button></header>
<div id="npanel" hidden></div><div id="toast" hidden></div>
<div id="root"></div>
<script src="/price-calc.js"></script>
<script>
(function(){
  const $=(s,el=document)=>el.querySelector(s);
  const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const kr=(n)=>n==null?'–':Math.round(n).toLocaleString('sv-SE')+' kr';
  const CAP=10;
  const ST={new:'Ny',sent:'Offert skickad',signed:'Signerad',declined:'Nekad',done:'Klar',cancelled:'Avbokad'};
  const ago=(t)=>{ if(!t) return ''; const m=Math.round((Date.now()-t)/6e4); if(m<2) return 'just nu'; if(m<60) return m+' min sedan'; const h=Math.round(m/60); if(h<24) return h+' tim sedan'; const d=Math.round(h/24); return d===1?'i går':d+' dagar sedan'; };
  const fmtDate=(d)=>/^\d{4}-\d{2}-\d{2}$/.test(d||'')?new Date(d+'T12:00:00Z').toLocaleDateString('sv-SE',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'}):'Inget datum';
  const TIMES=[];for(let h=7;h<=18;h++){TIMES.push(String(h).padStart(2,'0')+':00');if(h<18)TIMES.push(String(h).padStart(2,'0')+':30');}
  const timeOpts=(cur)=>'<option value="">Ingen tid</option>'+TIMES.map(t=>`<option${t===cur?' selected':''}>${t}</option>`).join('')+(cur&&!TIMES.includes(cur)?`<option selected>${cur}</option>`:'');
  const fmtTs=(t)=>t?new Date(t).toLocaleString('sv-SE',{dateStyle:'short',timeStyle:'short'}):'';
  const today=()=>new Date().toLocaleDateString('sv-SE');
  const tel=(p)=>'tel:'+String(p||'').replace(/[^\d+]/g,'').replace(/^0/,'+46');
  const root=$('#root');
  let all=[], view='list', filter='active', calMonth=today().slice(0,7), calDay=null, q='', sortBy='created', statPeriod='12';

  async function api(path,opt={}){
    const r=await fetch(path,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});
    const j=await r.json().catch(()=>({}));
    if(r.status===401){ showLogin(); throw new Error('Logga in igen'); }
    if(!r.ok) { const e=new Error(j.error||('Fel '+r.status)); e.data=j; throw e; }
    return j;
  }

  // ---------- login ----------
  async function start(){
    const s=await fetch('/api/admin/login').then(r=>r.json()).catch(()=>({}));
    if(s.admin){ $('#logout').hidden=false; $('#bell').hidden=false; await load(); route(); startNotices(); }
    else showLogin(s.setup);
  }
  function showLogin(setup){
    $('#logout').hidden=true; if($('#bell')) $('#bell').hidden=true;
    const miss=setup?[!setup.password&&'Lösenord (ADMIN_PASSWORD)',!setup.storage&&'Lagring (Upstash Redis)',!setup.mail&&'E-post (SMTP)'].filter(Boolean):[];
    root.innerHTML=`<div class="login"><div class="card"><h3 style="font-size:20px">Logga in</h3>
      ${miss.length?`<div class="warn">Saknas i Vercel: ${esc(miss.join(', '))}</div>`:''}
      <label class="f" for="pw">Lösenord</label><input id="pw" type="password" autocomplete="current-password">
      <button class="btn" id="go">Logga in</button><div class="err" id="err"></div></div></div>`;
    const go=async()=>{ $('#err').textContent='';
      const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#pw').value})});
      const j=await r.json().catch(()=>({}));
      if(r.ok){ start(); } else $('#err').textContent=j.error||'Fel';
    };
    $('#go').onclick=go; $('#pw').onkeydown=(e)=>{ if(e.key==='Enter') go(); };
  }
  $('#logout').onclick=async()=>{ await fetch('/api/admin/login',{method:'DELETE'}); location.hash=''; showLogin(); };

  async function load(){ const j=await api('/api/admin/bookings'); all=j.bookings||[]; updateBell(); }

  // ---------- notices (only inside this page) ----------
  // Built from the bookings themselves: the customer opened, signed or declined the offer.
  function events(){
    const ev=[];
    for(const b of all){ const n=(b.data||{}).name||b.id;
      if(b.lastViewAt) ev.push({t:b.lastViewAt,id:b.id,ic:'👁',txt:`${n} öppnade offerten`+(b.views>1?` (${b.views}:e gången)`:'')});
      if(b.signedAt) ev.push({t:b.signedAt,id:b.id,ic:'✅',txt:`${n} signerade – flytten är bokad`});
      if(b.declinedAt&&b.status==='declined') ev.push({t:b.declinedAt,id:b.id,ic:'❌',txt:`${n} tackade nej`+(b.decline?` – ${WHY[b.decline.reason]||''}`:'')});
    }
    return ev.sort((a,b)=>b.t-a.t).slice(0,40);
  }
  const seenKey='fx_seen_at';
  const getSeen=()=>{ try{ return Number(localStorage.getItem(seenKey))||0; }catch(_){ return 0; } };
  const setSeen=(t)=>{ try{ localStorage.setItem(seenKey,String(t)); }catch(_){} };
  let newestSeenInSession=0;
  function updateBell(){
    const bell=$('#bell'); if(!bell) return;
    const n=events().filter(e=>e.t>getSeen()).length, c=$('#bellN');
    c.hidden=!n; c.textContent=n>9?'9+':String(n);
    document.title=(n?`(${n}) `:'')+'Bokningar – FX Flytt';
  }
  function toast(msg,id){
    const t=$('#toast'); t.textContent=msg; t.hidden=false; t.onclick=()=>{ t.hidden=true; if(id) location.hash=id; };
    clearTimeout(toast.h); toast.h=setTimeout(()=>{ t.hidden=true; },8000);
  }
  function startNotices(){
    if(startNotices.on) return; startNotices.on=true;
    newestSeenInSession=Math.max(0,...events().map(e=>e.t));
    $('#bell').onclick=()=>{
      const p=$('#npanel'); if(!p.hidden){ p.hidden=true; return; }
      const seen=getSeen(), ev=events();
      p.innerHTML=ev.length?ev.map(e=>`<button class="ev${e.t>seen?' unread':''}" data-id="${esc(e.id)}">${e.ic} ${esc(e.txt)}<small>${esc(ago(e.t))}</small></button>`).join(''):'<div class="empty">Inga notiser än.</div>';
      p.hidden=false; setSeen(Date.now()); updateBell();
      p.querySelectorAll('.ev').forEach(x=>x.onclick=()=>{ p.hidden=true; location.hash=x.dataset.id; });
    };
    document.addEventListener('click',(e)=>{ const p=$('#npanel'); if(!p.hidden&&!p.contains(e.target)&&e.target.id!=='bell'&&!$('#bell').contains(e.target)) p.hidden=true; });
    // Check for news every 30 seconds while the page is open and visible.
    setInterval(async()=>{
      if(document.visibilityState!=='visible') return;
      try{ await load(); }catch(_){ return; }
      const fresh=events().filter(e=>e.t>newestSeenInSession);
      if(fresh.length){ newestSeenInSession=fresh[0].t; toast(`${fresh[0].ic} ${fresh[0].txt}${fresh.length>1?` (+${fresh.length-1} till)`:''}`,fresh[0].id);
        if(view==='list'&&document.activeElement?.id!=='q') showList(); }
    },30000);
  }
  const signedOn=(d)=>all.filter(b=>(b.status==='signed'||b.status==='done')&&b.date===d);

  // ---------- routing ----------
  function route(){
    const id=location.hash.slice(1);
    if(/^FX\d{6}-[0-9A-F]{6}$/.test(id)) return showDetail(id);
    if(id==='ny') return showNew();
    if(id==='kalender') return showCal();
    if(id==='statistik') return showStats();
    return showList();
  }
  window.addEventListener('hashchange',()=>{ Promise.resolve().then(route).catch(()=>{}); });
  function navBar(active){
    return `<nav><button data-v="" class="${active==='list'?'on':''}">Förfrågningar</button><button data-v="kalender" class="${active==='cal'?'on':''}">Kalender</button><button data-v="statistik" class="${active==='stat'?'on':''}">Statistik</button><button data-v="ny" class="${active==='new'?'on':''}">+ Ny</button></nav>`;
  }
  function bindNav(){ root.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{ location.hash=b.dataset.v; }); }

  // ---------- list ----------
  // An offer that was sent but not answered counts as expired ("förfallen") after 14 days, or when the moving day has come.
  const EXPIRE_DAYS=14;
  const isExpired=(b)=>b.status==='sent'&&((b.sentAt&&Date.now()-b.sentAt>EXPIRE_DAYS*864e5)||(b.date&&b.date<=today()));
  const FILTERS={active:['Aktiva',b=>['new','sent','signed'].includes(b.status)&&!isExpired(b)],new:['Nya',b=>b.status==='new'],sent:['Skickade',b=>b.status==='sent'&&!isExpired(b)],expired:['Förfallna',isExpired],signed:['Bokade',b=>b.status==='signed'],done:['Klara',b=>b.status==='done'],closed:['Nekade/avbokade',b=>['declined','cancelled'].includes(b.status)],all:['Alla',()=>true]};
  function itemHtml(b){
    const o=b.offer, d=b.data||{};
    const route=[d.from,d.to].filter(Boolean).map(x=>String(x).split(',')[0]).join(' → ');
    return `<button class="item" data-id="${esc(b.id)}"><div class="top"><b>${esc(d.name)}</b><span class="st ${b.status}">${ST[b.status]}</span></div>
      <div class="muted">${esc(fmtDate(b.date))}${b.time?' '+esc(b.time):''} · ${esc(route||d.size||'')}</div>
      <div class="muted">${o?kr(o.total):'Inget pris'} · ${esc(b.id)} · ${b.source==='web'?'Hemsidan':'Manuell'}</div>${tags(b)}</button>`;
  }
  const WHY={price:'Priset är för högt',other_company:'Valt en annan flyttfirma',date:'Datumet passar inte',no_move:'Flyttar inte längre',other:'Annat'};
  function tags(b){
    const t=[];
    if(['sent','declined'].includes(b.status)||b.views) t.push(b.views?`<span class="tag seen">👁 ${b.views}× · ${esc(ago(b.lastViewAt))}</span>`:(b.status==='sent'?'<span class="tag">Ej öppnad</span>':''));
    if(b.reminders?.length) t.push(`<span class="tag">🔔 ${b.reminders.length} påminnelse${b.reminders.length>1?'r':''}</span>`);
    if(isExpired(b)) t.push(`<span class="tag no">⏰ Förfallen${b.date&&b.date<=today()?(b.date<today()?' – flyttdagen har passerat':' – flyttdagen är i dag'):' – inget svar på '+Math.floor((Date.now()-b.sentAt)/864e5)+' dagar'}</span>`);
    if(b.discount) t.push(`<span class="tag ok">−${b.discount.pct} %</span>`);
    if(b.status==='declined'&&b.decline) t.push(`<span class="tag no">${esc(WHY[b.decline.reason]||'')}</span>`);
    const s=t.filter(Boolean).join('');
    return s?`<div class="tags">${s}</div>`:'';
  }
  function showList(){
    view='list';
    root.innerHTML=navBar('list')+`<main><div class="srch"><input id="q" type="search" placeholder="Sök namn, telefon, ort, bokningsnr…" value="${esc(q)}"><select id="sort"><option value="created"${sortBy==='created'?' selected':''}>Senaste</option><option value="date"${sortBy==='date'?' selected':''}>Flyttdatum</option><option value="price"${sortBy==='price'?' selected':''}>Pris</option></select></div>
      <div class="chips">${Object.entries(FILTERS).map(([k,v])=>`<button data-f="${k}" class="${k===filter?'on':''}">${v[0]} (${all.filter(v[1]).length})</button>`).join('')}</div>
      <div id="items"></div>
      <button class="btn gray" id="reload">Uppdatera</button></main>`;
    bindNav();
    const fill=()=>{
      const f=FILTERS[filter]||FILTERS.active;
      const words=q.toLowerCase().split(/\s+/).filter(Boolean);
      const hay=(b)=>{const d=b.data||{};return [d.name,d.phone,String(d.phone||'').replace(/\D/g,''),d.email,b.id,d.from,d.to,d.size,b.signature?.name].filter(Boolean).join(' ').toLowerCase();};
      // A search looks through all bookings, whatever filter is chosen.
      let list=words.length?all.filter(b=>{const h=hay(b);return words.every(w=>h.includes(w));}):all.filter(f[1]);
      const by={created:(a,b)=>(b.createdAt||0)-(a.createdAt||0),date:(a,b)=>(a.date||'9999').localeCompare(b.date||'9999'),price:(a,b)=>(b.offer?.total||0)-(a.offer?.total||0)};
      list=list.slice().sort(by[sortBy]||by.created);
      root.querySelector('.chips').style.opacity=words.length?'.45':'';
      $('#items').innerHTML=(words.length?`<div class="muted" style="margin:0 0 8px">${list.length} träff${list.length===1?'':'ar'} bland alla bokningar</div>`:'')+
        (list.length?list.map(itemHtml).join(''):`<div class="empty">${words.length?'Ingen bokning matchar sökningen.':'Inga bokningar här ännu.'}</div>`);
      root.querySelectorAll('.item').forEach(b=>b.onclick=()=>{ location.hash=b.dataset.id; });
    };
    fill();
    root.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{ filter=b.dataset.f; q=''; showList(); });
    $('#q').oninput=()=>{ q=$('#q').value; fill(); };

  // ---------- statistics ----------
  function showStats(){
    view='stat';
    const now=Date.now(), months=statPeriod==='all'?null:Number(statPeriod);
    const from=months?new Date(new Date().getFullYear(),new Date().getMonth()-months+1,1).getTime():0;
    const inP=all.filter(b=>(b.createdAt||0)>=from);
    const won=inP.filter(b=>b.status==='signed'||b.status==='done');
    const lost=inP.filter(b=>b.status==='declined'||isExpired(b));
    const open=inP.filter(b=>b.status==='sent'&&!isExpired(b));
    const sum=(l)=>l.reduce((a,b)=>a+(b.offer?.total||0),0);
    const decided=won.length+lost.length;
    const rate=decided?Math.round(won.length*100/decided):null;
    const times=won.filter(b=>b.signedAt&&b.sentAt&&b.signedAt>=b.sentAt).map(b=>(b.signedAt-b.sentAt)/36e5).sort((a,b)=>a-b);
    const med=times.length?times[Math.floor(times.length/2)]:null;
    const fmtH=(h)=>h==null?'–':h<1?'< 1 h':h<48?Math.round(h)+' h':Math.round(h/24)+' dagar';
    // monthly bars (by request date)
    const nM=months||Math.max(1,Math.min(24,(()=>{const f=all.reduce((a,b)=>Math.min(a,b.createdAt||now),now);const d=new Date(f),n=new Date();return (n.getFullYear()-d.getFullYear())*12+n.getMonth()-d.getMonth()+1;})()));
    const ms=[...Array(Math.min(nM,12))].map((_,i)=>{const d=new Date(new Date().getFullYear(),new Date().getMonth()-Math.min(nM,12)+1+i,1);return {k:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),l:d.toLocaleDateString('sv-SE',{month:'short'})};});
    const mk=(b)=>{const d=new Date(b.createdAt||0);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');};
    const per=ms.map(m=>{const l=all.filter(b=>mk(b)===m.k);return {l:m.l,w:sum(l.filter(b=>b.status==='signed'||b.status==='done')),x:sum(l.filter(b=>b.status==='declined'||isExpired(b))),o:sum(l.filter(b=>b.status==='sent'&&!isExpired(b)))};});
    const max=Math.max(1,...per.map(p=>Math.max(p.w,p.x,p.o)));
    const h=(v)=>Math.round(v*100/max)+'%';
    // reasons + sources
    const dec=inP.filter(b=>b.status==='declined');
    const rc={}; dec.forEach(b=>{const r=b.decline?.reason||'none'; rc[r]=(rc[r]||0)+1;});
    const rl=Object.entries(rc).sort((a,b)=>b[1]-a[1]);
    const src=(s)=>{const l=inP.filter(b=>(b.source==='web'?'web':'manual')===s);const w=l.filter(b=>b.status==='signed'||b.status==='done').length;return {n:l.length,w};};
    const web=src('web'), man=src('manual');
    const disc=inP.filter(b=>b.discount), discWon=disc.filter(b=>b.status==='signed'||b.status==='done');
    root.innerHTML=navBar('stat')+`<main>
      <div class="chips">${[['1','Denna månad'],['3','3 mån'],['12','12 mån'],['all','Allt']].map(([k,l])=>`<button data-p="${k}" class="${k===statPeriod?'on':''}">${l}</button>`).join('')}</div>
      <div class="kpis">
        <div class="kpi" style="background:#1f8a4c"><small>Vunnet (signerat)</small><b>${kr(sum(won))}</b><small>${won.length} bokning${won.length===1?'':'ar'}</small></div>
        <div class="kpi" style="background:#2f6fb2"><small>Vinstandel</small><b>${rate==null?'–':rate+' %'}</b><small>${won.length} av ${decided} avgjorda</small></div>
        <div class="kpi" style="background:#a2479b"><small>Tid till signering</small><b>${fmtH(med)}</b><small>median från skickad offert</small></div>
        <div class="kpi" style="background:#c2560a"><small>Väntar på svar</small><b>${kr(sum(open))}</b><small>${open.length} offert${open.length===1?'':'er'}</small></div>
      </div>
      <div class="card"><h3>Affärsvärde per månad</h3>
        <div class="bars">${per.map(p=>`<div class="m"><i style="height:${h(p.w)};background:#1f8a4c" title="Vunnet ${kr(p.w)}"></i><i style="height:${h(p.x)};background:#f08a24" title="Förlorat ${kr(p.x)}"></i><i style="height:${h(p.o)};background:#c5d0da" title="Väntar ${kr(p.o)}"></i></div>`).join('')}</div>
        <div class="blab">${per.map(p=>`<span>${esc(p.l)}</span>`).join('')}</div>
        <div class="leg"><span><i style="background:#1f8a4c"></i>Vunnet</span><span><i style="background:#f08a24"></i>Nekat/förfallet</span><span><i style="background:#c5d0da"></i>Väntar</span></div>
        <div class="muted" style="margin-top:8px">Snittaffär (vunnen): <b>${won.length?kr(sum(won)/won.length):'–'}</b> · Förfrågningar: <b>${inP.length}</b></div></div>
      <div class="card"><h3>Varför kunder tackar nej</h3>
        ${rl.length?rl.map(([r,n])=>`<div style="display:flex;justify-content:space-between"><span>${esc(r==='none'?'Ingen anledning angiven':WHY[r]||r)}</span><b>${n}</b></div><div class="hbar"><i style="width:${Math.round(n*100/dec.length)}%"></i></div>`).join(''):'<div class="muted">Inga nekade offerter under perioden.</div>'}
        ${disc.length?`<div class="muted">Rabatt gavs på ${disc.length} offert${disc.length===1?'':'er'} – ${discWon.length} blev bokade efteråt.</div>`:''}</div>
      <div class="card"><h3>Var förfrågningarna kommer ifrån</h3>
        <div style="display:flex;justify-content:space-between"><span>Hemsidan</span><b>${web.n} st · ${web.w} bokade</b></div>
        <div style="display:flex;justify-content:space-between;margin-top:6px"><span>Manuellt inlagda</span><b>${man.n} st · ${man.w} bokade</b></div></div>
      <div class="muted" style="margin:4px 2px 20px">Perioden räknas från datumet förfrågan kom in. En offert räknas som förfallen efter ${EXPIRE_DAYS} dagar utan svar eller när flyttdagen har passerat.</div>
    </main>`;
    bindNav();
    root.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{ statPeriod=b.dataset.p; showStats(); });
  }

  // ---------- calendar ----------
  function showCal(){
    view='cal';
    const [y,m]=calMonth.split('-').map(Number);
    const first=new Date(Date.UTC(y,m-1,1)), startDow=(first.getUTCDay()+6)%7;
    const days=[]; for(let i=-startDow;i<42-startDow;i++){ const d=new Date(Date.UTC(y,m-1,1+i)); days.push(d.toISOString().slice(0,10)); }
    const title=first.toLocaleDateString('sv-SE',{month:'long',year:'numeric',timeZone:'UTC'});
    const t=today();
    const cells=days.map(d=>{
      const n=signedOn(d).length, p=all.filter(b=>b.status==='sent'&&b.date===d).length;
      const cls=n>=CAP?'full':n>=CAP-3?'mid':'';
      return `<button data-d="${d}" class="${d.slice(0,7)!==calMonth?'out':''} ${d===t?'today':''}"><span class="n">${Number(d.slice(8))}</span>${n?`<span class="c ${cls}">${n}</span>`:'<span></span>'}${p?`<span class="p">${p} väntar</span>`:'<span></span>'}</button>`;
    }).join('');
    let dayList='';
    if(calDay){
      const list=all.filter(b=>b.date===calDay&&!['declined','cancelled'].includes(b.status)).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
      const n=signedOn(calDay).length;
      dayList=`<div class="card"><h3>${esc(fmtDate(calDay))} – ${n} bokade av max ${CAP}</h3>${n>=CAP?'<div class="warn">Dagen är full.</div>':''}${list.length?list.map(itemHtml).join(''):'<div class="muted">Inga bokningar.</div>'}</div>`;
    }
    root.innerHTML=navBar('cal')+`<main><div class="calhead"><button id="prev">‹</button><b style="text-transform:capitalize">${esc(title)}</b><button id="next">›</button></div>
      <div class="cal">${['Mån','Tis','Ons','Tor','Fre','Lör','Sön'].map(x=>`<div class="h">${x}</div>`).join('')}${cells}</div>
      <p class="muted">Grön siffra = bokade (signerade). Orange = nästan fullt, röd = fullt (${CAP}). Blå = offerter som väntar på signatur.</p>${dayList}</main>`;
    bindNav();
    const shift=(k)=>{ const d=new Date(Date.UTC(y,m-1+k,1)); calMonth=d.toISOString().slice(0,7); calDay=null; showCal(); };
    $('#prev').onclick=()=>shift(-1); $('#next').onclick=()=>shift(1);
    root.querySelectorAll('.cal button').forEach(b=>b.onclick=()=>{ calDay=b.dataset.d; showCal(); });
    root.querySelectorAll('.item').forEach(b=>b.onclick=()=>{ location.hash=b.dataset.id; });
  }

        if(!(p>=1&&p<=50)){ $('#dprev').innerHTML=''; return; }
        const nt=base-Math.round(base*p/100);
        root.querySelectorAll('#pcts .chip').forEach(c=>c.classList.toggle('on',Number(c.dataset.p)===p));
        $('#dprev').innerHTML=`<div class="dbox"><div class="muted">Nuvarande pris ${b.discount?'(före rabatt) ':''}<s>${kr(base)}</s></div><div style="font-size:24px;font-weight:800">${kr(nt)} <span class="tag ok">−${p} %</span></div>
          <div class="muted">Kunden sparar ${kr(base-nt)}.</div>
          ${d.email?`<button class="btn" id="dsend">Skicka nytt pris till ${esc(d.email)}</button>`:''}<button class="btn sec" id="dlink">Spara och kopiera länk (för SMS)</button></div>`;
        const go=async(send)=>{
          if(send&&!confirm(`Skicka nytt pris ${kr(nt)} (−${p} %) till ${d.email}?`)) return;
          try{ const j=await api('/api/admin/discount?id='+b.id,{method:'POST',body:JSON.stringify({pct:p,send})}); await showDetail(b.id);
            if(send) msg('#msg2','Nytt pris skickat ✓',true);
            else { try{ await navigator.clipboard.writeText(j.url); }catch(_){}
              $('#msg2').innerHTML=`<div class="okmsg">Nytt pris sparat. Länken är kopierad.</div><input readonly value="${esc(j.url)}"><a class="btn" href="sms:${esc(String(d.phone||'').replace(/\s/g,''))}?&body=${encodeURIComponent('Hej! Vi har sänkt priset på din flytt med '+p+' %. Se offerten här: '+j.url)}">Öppna SMS med länken</a>`; }
          }catch(e){ msg('#msg3',e.message,false); }
        };
        if($('#dsend')) $('#dsend').onclick=()=>go(true);
        $('#dlink').onclick=()=>go(false);
      };
      root.querySelectorAll('#pcts .chip').forEach(c=>c.onclick=()=>{ $('#pct').value=''; preview(Number(c.dataset.p)); });
      $('#pct').oninput=()=>preview(Math.round(Number($('#pct').value)));
    }
    if(linkBtn) linkBtn.onclick=async()=>{
      const body={date:$('#dt').value,time:$('#tm').value,customerNote:$('#cn').value};
      if($('#tot').value) body.total=Number($('#tot').value);
      if(!(await patch(body))) return;
      try{ const j=await api('/api/admin/send?id='+b.id+'&linkOnly=1',{method:'POST'});
        const text=`Hej! Här är din offert från FX Flytt: ${j.url}`;
        try{ await navigator.clipboard.writeText(j.url); }catch(_){}
        $('#msg2').innerHTML=`<div class="okmsg">Länken är kopierad.</div><input readonly value="${esc(j.url)}"><a class="btn" href="sms:${esc(String(d.phone||'').replace(/\s/g,''))}?&body=${encodeURIComponent(text)}">Öppna SMS med länken</a>`;
      }catch(e){ msg('#msg2',e.message,false); }
    };
  }

  // ---------- new ----------
  // Customers we already know, one per phone number (latest booking wins).
  const digits=(x)=>String(x||'').replace(/\D/g,'').replace(/^46/,'0');
  function customers(){
    const m=new Map();
    for(const b of all.slice().sort((x,y)=>(y.createdAt||0)-(x.createdAt||0))){ const d=b.data||{}, k=digits(d.phone); if(!k) continue;
      if(!m.has(k)) m.set(k,{name:d.name,phone:d.phone,email:d.email,from:d.from,to:d.to,n:0,ids:[]});
      const c=m.get(k); c.n++; c.ids.push(b.id); if(!c.email&&d.email) c.email=d.email; }
    return [...m.values()];
  }
  const SVC=[['move|bas','Bara flytt – Bas'],['move|premium','Flytt + flyttstäd – Premium, 10 % rabatt'],['move|deluxe','Flytt + flyttstäd + packning – Deluxe, 20 % rabatt'],['hourly|','Flytt per timme'],['cleaning|','Bara flyttstäd'],['other|','Kontorsflytt, piano eller annat']];
  const FLOORS=['Bottenplan','1 tr','2 tr','3 tr','4 tr','5 tr','6 tr','7 tr','8 tr','9 tr','10 tr eller högre'];
  const LIFT=['Ingen hiss','Liten hiss','Stor hiss'];
  function showNew(){
    const opt=(l,sel)=>l.map(x=>`<option${x===sel?' selected':''}>${esc(x)}</option>`).join('');
    root.innerHTML=navBar('new')+`<main><div class="card"><h3>Ny bokning (t.ex. från telefon)</h3>
      <label class="f">Namn *</label><input id="n_name" autocomplete="off" placeholder="Skriv namn eller telefon – tidigare kunder visas">
      <div id="sugg"></div>
      <div class="row2"><div><label class="f">Telefon *</label><input id="n_phone" type="tel" autocomplete="off"></div><div><label class="f">E-post</label><input id="n_email" type="email"></div></div>
      <div id="known"></div>
      <label class="f">Från</label><input id="n_from"><label class="f">Till</label><input id="n_to">
      <div class="row2"><div><label class="f">Våning (från)</label><select id="n_ff">${opt(FLOORS)}</select></div><div><label class="f">Hiss (från)</label><select id="n_hf">${opt(LIFT)}</select></div></div>
      <div class="row2"><div><label class="f">Våning (till)</label><select id="n_ft">${opt(FLOORS)}</select></div><div><label class="f">Hiss (till)</label><select id="n_ht">${opt(LIFT)}</select></div></div>
      <div class="row2"><div><label class="f">Datum</label><input id="n_date" type="date"></div><div><label class="f">Starttid</label><select id="n_time">${timeOpts('')}</select></div></div>
    </div>
    <div class="card"><h3>Pris – räknas med samma prislista som hemsidan</h3>
      <label class="f">Tjänst</label><select id="n_svc">${SVC.map(([v,l])=>`<option value="${v}">${esc(l)}</option>`).join('')}</select>
      <div class="row2" id="w_area"><div><label class="f">Boyta (m²)</label><input id="n_m2" type="number" inputmode="numeric" min="1"></div><div id="w_km"><label class="f">Avstånd (km, en väg)</label><input id="n_km" type="number" inputmode="numeric" min="0"></div></div>
      <div class="row2" id="w_hours" hidden><div><label class="f">Antal personer</label><select id="n_crew"><option value="2">2</option><option value="3">3</option><option value="4">4</option></select></div><div><label class="f" id="l_hours">Timmar</label><input id="n_h" type="number" inputmode="numeric" min="1" value="3"></div></div>
      <div class="row2" id="w_more"><div><label class="f">Flyttkartonger</label><select id="n_box"><option value="none">Inga</option><option value="rent">Hyra (50 st)</option><option value="buy">Köpa (50 st)</option></select></div><div id="w_xc"><label class="f">Flyttstäd som tillval</label><select id="n_xc"><option value="">Nej</option><option value="1">Ja</option></select></div></div>
      <div id="calc"></div>
      <label class="f">Pris efter RUT (kr)</label><input id="n_total" type="number" inputmode="numeric">
      <div class="muted" id="totinfo"></div>
      <label class="f">Text till kunden</label><textarea id="n_cn" placeholder="T.ex. Inkl. bärhjälp, 2 flyttare"></textarea>
      <label class="f">Övrigt (internt)</label><textarea id="n_msg"></textarea>
      <button class="btn" id="create">Spara bokning</button><div class="err" id="err"></div></div></main>`;
    bindNav();
    const v=(id)=>$('#'+id).value;
    // --- existing customers ---
    const pickCust=(c)=>{ $('#n_name').value=c.name||''; $('#n_phone').value=c.phone||''; if(c.email) $('#n_email').value=c.email; $('#sugg').innerHTML=''; showKnown(); };
    const suggest=(q)=>{
      const t=q.trim().toLowerCase(), dq=digits(q);
      if(t.length<2){ $('#sugg').innerHTML=''; return; }
      const hits=customers().filter(c=>(c.name||'').toLowerCase().includes(t)||(dq.length>=3&&digits(c.phone).includes(dq))).slice(0,5);
      $('#sugg').innerHTML=hits.length?`<div class="sugg">${hits.map((c,i)=>`<button data-i="${i}"><b>${esc(c.name)}</b> · ${esc(c.phone)}<small>${c.n} tidigare bokning${c.n>1?'ar':''}${c.email?' · '+esc(c.email):''}</small></button>`).join('')}</div>`:'';
      $('#sugg').querySelectorAll('button').forEach(b=>b.onclick=()=>pickCust(hits[b.dataset.i]));
    };
    const showKnown=()=>{
      const k=digits(v('n_phone')); const c=k.length>=6?customers().find(x=>digits(x.phone)===k):null;
      $('#known').innerHTML=c?`<div class="okmsg">Återkommande kund – ${c.n} tidigare bokning${c.n>1?'ar':''}: ${c.ids.slice(0,4).map(id=>`<a href="#${esc(id)}">${esc(id)}</a>`).join(', ')}</div>`:'';
    };
    $('#n_name').oninput=()=>suggest(v('n_name'));
    $('#n_phone').oninput=()=>{ suggest(v('n_phone')); showKnown(); };
    // --- price ---
    let calc=null, manual=false;
    const run=()=>{
      const [svc,pkg]=v('n_svc').split('|');
      $('#w_area').hidden=svc==='hourly'||svc==='other';
      $('#w_km').hidden=svc==='cleaning';
      $('#w_hours').hidden=!(svc==='hourly'||pkg==='deluxe');
      $('#l_hours').textContent=pkg==='deluxe'?'Timmar packning/montering':'Timmar (minst 3)';
      $('#w_more').hidden=svc==='other'||svc==='cleaning';
      $('#w_xc').hidden=!(svc==='move'&&pkg==='bas');
      calc=null; let msg='';
      if(svc!=='other'&&window.fxComputePrice&&window.FX_PRICES){
        const m2=Number(v('n_m2')), km=v('n_km')===''?null:Number(v('n_km'));
        if(svc==='hourly'||m2>0){
          try{
            const r=window.fxComputePrice({service:svc,pkg:pkg||undefined,areaM2:m2||undefined,distanceKm:km,crew:Number(v('n_crew')),hours:Number(v('n_h'))||3,boxes:svc==='cleaning'?'none':v('n_box'),extraCleaning:v('n_xc')==='1'},window.FX_PRICES);
            if(r.onRequest) msg=`<div class="warn">${esc(r.onRequest)} – skriv priset själv.</div>`;
            else { calc=r; msg=`<div class="dbox">${r.lines.map(l=>`<div style="display:flex;justify-content:space-between;gap:8px"><span>${esc(l.label)}</span><b style="white-space:nowrap">${kr(l.amount)}</b></div>`).join('')}<div style="display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:6px;padding-top:6px"><span>Totalt efter RUT</span><b>${kr(r.totalAfterRut)}</b></div>${km==null&&svc==='move'?'<div class="muted">Avstånd saknas – under 15 km är gratis.</div>':''}</div>`; }
          }catch(e){ msg=`<div class="err">${esc(e.message)}</div>`; }
        } else msg='<div class="muted">Fyll i boyta så räknas priset.</div>';
      } else if(svc==='other') msg='<div class="muted">Kontorsflytt, piano m.m. – skriv priset själv.</div>';
      $('#calc').innerHTML=msg;
      if(calc&&!manual) $('#n_total').value=calc.totalAfterRut;
      const t=Number(v('n_total'));
      $('#totinfo').textContent=calc&&t&&t!==calc.totalAfterRut?`Eget pris – kunden ser bara totalen (prislistan ger ${kr(calc.totalAfterRut)}).`:(calc?'Kunden ser raderna ovan i offerten.':'');
    };
    ['n_svc','n_m2','n_km','n_crew','n_h','n_box','n_xc'].forEach(id=>{ $('#'+id).oninput=run; $('#'+id).onchange=run; });
    $('#n_total').oninput=()=>{ manual=$('#n_total').value!==''; run(); };
    run();
    $('#create').onclick=async()=>{
      const [svc,pkg]=v('n_svc').split('|'), t=Number(v('n_total'));
      const useLines=calc&&t===calc.totalAfterRut;
      const flo=(f,h)=>`${v(f)} · ${v(h).toLowerCase()}`;
      const hourlyNote=svc==='hourly'?`Minst ${window.FX_PRICES.hourly.minHours} timmar. Du betalar för den tid flytten faktiskt tar (${window.FX_PRICES.hourly[v('n_crew')]} kr/tim efter RUT).`:'';
      try{ const b=await api('/api/admin/bookings',{method:'POST',body:JSON.stringify({name:v('n_name'),phone:v('n_phone'),email:v('n_email'),from:v('n_from'),to:v('n_to'),
          size:SVC.find(x=>x[0]===v('n_svc'))[1],areaM2:svc==='hourly'||svc==='other'?'':v('n_m2'),distanceKm:v('n_km')===''?undefined:Number(v('n_km')),
          floorFrom:svc==='cleaning'?'':flo('n_ff','n_hf'),floorTo:svc==='cleaning'?'':flo('n_ft','n_ht'),
          date:v('n_date'),time:v('n_time'),total:v('n_total'),lines:useLines?calc.lines:undefined,note:useLines?hourlyNote:'',customerNote:v('n_cn'),message:v('n_msg')})});
        all.unshift(b); location.hash=b.id; }
      catch(e){ $('#err').textContent=e.message; }
    };
  }

  start().catch(e=>{ root.innerHTML=`<main><div class="err">${esc(e.message)}</div></main>`; });
})();
</script>
</body>
</html>
