    const form=n?`<div class="card" id="dform"><h3>Ny skada</h3>
      <div class="seg" id="d_kind"><button data-k="customer" class="${n.kind==='customer'?'on':''}">📦 Kundens saker</button><button data-k="vehicle" class="${n.kind==='vehicle'?'on':''}">🚚 Vårt fordon</button></div>
      <div class="row2"><div>${n.kind==='customer'?`<label class="f" for="d_bk">Jobb</label><select id="d_bk"><option value="">Välj jobb…</option>${jobs.map(b=>`<option value="${esc(b.id)}"${b.id===n.bookingId?' selected':''}>${esc(fmtDate(b.date))} · ${esc((b.data||{}).name||b.id)}</option>`).join('')}</select>`
          :`<label class="f" for="d_v">Fordon</label><select id="d_v"><option value="">Välj fordon…</option>${vehs.map(r=>`<option value="${esc(r.id)}">${esc(r.name)}</option>`).join('')}</select>`}</div>
        <div><label class="f" for="d_date">Datum</label><input id="d_date" type="date" value="${today()}"></div></div>
      <label class="f" for="d_desc">Vad hände?</label><textarea id="d_desc" placeholder="${n.kind==='customer'?'T.ex. repa på byrån i sovrummet, kunden har sett den':'T.ex. backade in i en stolpe, buckla bakre stötfångaren'}"></textarea>
      <label class="f" for="d_ph">Bilder</label><input id="d_ph" type="file" accept="image/*" multiple>
      <div class="btns"><button class="btn gray" id="d_cancel">Avbryt</button><button class="btn" id="d_save">Spara</button></div><div id="d_msg"></div></div>`:'';
    const card=(d)=>{ const o=dmgOpen===d.id;
      return `<div class="card dmg" id="dm_${esc(d.id)}"><div style="display:flex;gap:10px;align-items:flex-start;cursor:pointer" data-dopen="${esc(d.id)}">
        <div style="flex:1;min-width:0"><b>${esc(d.title)}</b><div class="muted">${dmgWho(d)} · ${esc(fmtDate(d.date))} · rapporterad av ${esc(d.createdBy)}${d.photos.length?` · 📷 ${d.photos.length}`:''}</div></div>
        <div style="text-align:right">${d.cost!=null?`<b>${kr(d.cost)}</b><br>`:''}<span class="tag ${DST[d.status][1]}">${DST[d.status][0]}</span></div></div>
        ${o?`<div style="white-space:pre-wrap;margin-top:10px">${esc(d.desc)}</div>
          ${d.photos.length?`<div class="dph">${d.photos.map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="" loading="lazy"></a>`).join('')}</div>`:''}
          <div class="row2" style="margin-top:10px"><div><label class="f">Status</label><select data-f="status">${Object.entries(DST).map(([k,[l]])=>`<option value="${k}"${d.status===k?' selected':''}>${l}</option>`).join('')}</select></div>
            <div><label class="f">Kostnad (kr)</label><input data-f="cost" type="number" inputmode="numeric" value="${d.cost??''}"></div></div>
          <div class="row2"><div><label class="f">Vem betalar?</label><select data-f="paidBy"><option value="">–</option>${Object.entries(PAID).map(([k,l])=>`<option value="${k}"${d.paidBy===k?' selected':''}>${l}</option>`).join('')}</select></div>
            <div><label class="f">Skadenummer (försäkring)</label><input data-f="claimNo" value="${esc(d.claimNo||'')}"></div></div>
          <label class="f">Beslut / lösning</label><textarea data-f="outcome" style="min-height:56px" placeholder="T.ex. kunden får 1 500 kr, överens på telefon">${esc(d.outcome||'')}</textarea>
          <label class="f">Anteckning till loggen</label><input data-f="note" placeholder="T.ex. pratat med kunden">
          <div class="btns"><label class="btn sec" style="cursor:pointer">+ Bild<input type="file" accept="image/*" data-dph="${esc(d.id)}" hidden></label>${isOwner()?`<button class="btn gray" data-ddel="${esc(d.id)}">Ta bort</button>`:''}<button class="btn" data-dsave="${esc(d.id)}">Spara</button></div>
          <div class="calls">${d.log.slice().reverse().map(l=>`<div>${esc(fmtTs(l.at))} · <b>${esc(l.by)}</b> · ${esc(l.what)}</div>`).join('')}</div>`:''}</div>`; };
    root.innerHTML=navBar('team')+`<main>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px">${teamSeg()}<button class="btn sm" id="d_add" style="margin-left:auto">+ Ny skada</button></div>
      ${form}
      <div class="vsum" style="margin-bottom:14px"><div><small>Öppna</small><b>${open.length}</b><span>${open.filter(d=>d.status==='new').length} nya</span></div>
        <div><small>Vi har betalat i år</small><b>${kr(costY)}</b><span>skador där "Vi betalar"</span></div></div>
      <div class="seg" id="d_f" style="margin-bottom:12px">${[['open','Öppna'],['closed','Avslutade'],['all','Alla']].map(([k,l])=>`<button data-k="${k}" class="${dmgFilter===k?'on':''}">${l}</button>`).join('')}</div>
      ${list.length?list.map(card).join(''):`<div class="card empty">${dmgFilter==='open'?'Inga öppna skador 👍':'Inga skador.'}</div>`}</main>`;
    bindTeamSeg();
    root.querySelectorAll('#d_f button').forEach(x=>x.onclick=()=>{ dmgFilter=x.dataset.k; showDmgAdmin(); });
    $('#d_add').onclick=()=>{ dmgNew={kind:'customer'}; showDmgAdmin(); };
    if(n){
      root.querySelectorAll('#d_kind button').forEach(x=>x.onclick=()=>{ dmgNew={...n,kind:x.dataset.k}; showDmgAdmin(); });
      $('#d_cancel').onclick=()=>{ dmgNew=null; showDmgAdmin(); };
      $('#d_save').onclick=async()=>{ const b=$('#d_save'); b.disabled=true;
        try{ const x=await api('/api/admin/damage',{method:'POST',body:JSON.stringify({kind:n.kind,bookingId:$('#d_bk')?.value,vid:$('#d_v')?.value,date:$('#d_date').value,desc:$('#d_desc').value})});
          for(const f of [...$('#d_ph').files].slice(0,8)) await upPhoto('/api/admin/damage?photo=1&id='+x.id,f);
          dmgNew=null; dmgOpen=x.id; dmgFilter='open'; await reloadDmg(); notify('Skadan är sparad ✓'); showDmgAdmin(); }
        catch(e){ b.disabled=false; $('#d_msg').innerHTML=`<div class="err">${esc(e.message)}</div>`; } };
    }
    root.querySelectorAll('[data-dopen]').forEach(x=>x.onclick=(e)=>{ if(e.target.closest('a')) return; dmgOpen=dmgOpen===x.dataset.dopen?null:x.dataset.dopen; showDmgAdmin(); });
    root.querySelectorAll('[data-dsave]').forEach(x=>x.onclick=async()=>{ const box=$('#dm_'+x.dataset.dsave), body={};
      box.querySelectorAll('[data-f]').forEach(i=>body[i.dataset.f]=i.value);
      try{ await api('/api/admin/damage?id='+x.dataset.dsave,{method:'PATCH',body:JSON.stringify(body)}); await reloadDmg(); notify('Sparat ✓'); showDmgAdmin(); }catch(e){ alert(e.message); } });
    root.querySelectorAll('[data-dph]').forEach(x=>x.onchange=async()=>{ const f=x.files[0]; if(!f) return;
      try{ await upPhoto('/api/admin/damage?photo=1&id='+x.dataset.dph,f); await reloadDmg(); showDmgAdmin(); }catch(e){ alert(e.message); } });
    root.querySelectorAll('[data-ddel]').forEach(x=>x.onclick=async()=>{ if(!confirm('Ta bort skadan helt?')) return;
      try{ await api('/api/admin/damage?id='+x.dataset.ddel,{method:'DELETE'}); dmgOpen=null; await reloadDmg(); showDmgAdmin(); }catch(e){ alert(e.message); } });
  }

  // ---------- Tidrapporter: check and approve each person's working day (owner) ----------
  let tsWeek=null, tsFilter='pending', tsWho='', tsData=null;
  const mh=(m)=>{ m=Math.round(m); return Math.floor(m/60)+' h'+(m%60?' '+(m%60)+' min':''); };
  const tMin=(s)=>Number(s.slice(0,2))*60+Number(s.slice(3,5));
  const tLen=(a,b)=>{ const d=tMin(b)-tMin(a); return d>=0?d:d+1440; };
  const FLAG={diff:'🚩 Stämplat skiljer sig från planen',nostamp:'🚩 Ingen stämpling',open:'🚩 Ej utstämplad',nojob:'Stämplat utan jobb'};
  async function showTimesheets(){
    view='stat'; tsWeek=tsWeek||weekStart(today());
    const we=addDays(tsWeek,6);
    root.innerHTML=navBar('stat')+`<main>${statTabs()}
      <div class="calbar"><div class="cnav"><button id="tprev" aria-label="Föregående vecka">‹</button><button id="tnow">Denna vecka</button><button id="tnext" aria-label="Nästa vecka">›</button></div>
        <b class="ctitle">v. ${isoWeek(tsWeek)} · ${esc(dfmt(tsWeek,{day:'numeric',month:'short'}))} – ${esc(dfmt(we,{day:'numeric',month:'short'}))}</b></div>
      <div id="tpane"><div class="empty">Laddar…</div></div></main>`;
    bindStatTabs();
    $('#tprev').onclick=()=>{ tsWeek=addDays(tsWeek,-7); showTimesheets(); }; $('#tnext').onclick=()=>{ tsWeek=addDays(tsWeek,7); showTimesheets(); }; $('#tnow').onclick=()=>{ tsWeek=weekStart(today()); showTimesheets(); };
    try{ tsData=await api(`/api/admin/timesheet?from=${tsWeek}&to=${we}`); }catch(e){ $('#tpane').innerHTML=`<div class="err">${esc(e.message)}</div>`; return; }
    if(view!=='stat'||statTab!=='ts') return;
    drawTimesheets();
  }
  function drawTimesheets(){
    const d=tsData, rule=d.rule, t=today();
    const rows=d.rows.filter(r=>(tsFilter==='all'||(tsFilter==='pending'?!r.approved:!!r.approved))&&(!tsWho||r.rid===tsWho));
    const pend=d.rows.filter(r=>!r.approved), appr=d.rows.filter(r=>r.approved);
    const who=[...new Map(d.rows.map(r=>[r.rid,r.name])).entries()].sort((a,b)=>a[1].localeCompare(b[1]));
    const per=who.map(([rid,name])=>{ const l=d.rows.filter(r=>r.rid===rid); return {rid,name,ok:l.filter(r=>r.approved).reduce((a,r)=>a+r.paidMin,0),wait:l.filter(r=>!r.approved).length}; });
    const val=(r)=>r.approved||r.proposed;
    const card=(r)=>{ const v=val(r), canOk=v.start&&v.end, k=r.rid+'|'+r.date;
      return `<div class="ts${r.approved?' ok':''}" data-k="${esc(k)}">
        <div class="ts-h"><input type="checkbox" class="ts-sel" ${r.approved||!canOk?'disabled':''} aria-label="Välj"><div><b>${esc(r.name)}</b><span>${esc(dfmt(r.date,{weekday:'short',day:'numeric',month:'short'}))}</span></div>
          ${r.approved?`<span class="tag ok">Godkänd ✓</span>`:r.date>t?'<span class="tag">Kommande</span>':'<span class="tag wn">Väntande</span>'}</div>
        <div class="ts-src">
          <div><small>Planerat</small>${r.planned?`<b>${esc(r.planned.start)}–${esc(r.planned.end)}</b> <span class="muted">${r.planned.jobs.length} jobb: ${r.planned.jobs.map(j=>`<a href="#${esc(j.id)}">${esc(j.customer)}</a>`).join(', ')}</span>`:'<span class="muted">Inget jobb</span>'}</div>
          <div><small>Stämpelklocka</small>${r.stamped?`<b>${esc(r.stamped.start)}–${r.stamped.end?esc(r.stamped.end):'?'}</b>`:'<span class="muted">–</span>'}</div>
          ${r.sheet?`<div><small>Arbetsorder</small><b>${esc(r.sheet.start)}–${esc(r.sheet.end)}</b></div>`:''}
        </div>
        ${r.flags.length?`<div class="ts-fl">${r.flags.map(f=>`<span>${FLAG[f]}</span>`).join('')}</div>`:''}
        <div class="ts-in"><label>Start<input type="time" class="ts-s" value="${esc(v.start)}"></label><label>Slut<input type="time" class="ts-e" value="${esc(v.end)}"></label>
          <label>Rast (min)<input type="number" class="ts-b" min="0" max="120" step="5" inputmode="numeric" value="${v.breakMin}"></label>
          <div class="ts-paid"><small>Betald tid</small><b class="ts-p">${canOk?esc(mh(Math.max(0,tLen(v.start,v.end)-v.breakMin))):'–'}</b></div>
          <div class="ts-act">${r.approved?`<button class="btn sec sm ts-save" hidden>Spara ändring</button><button class="btn gray sm ts-undo">Ångra</button>`:`<button class="btn sm ts-ok"${canOk?'':' disabled'}>Godkänn</button>`}</div></div>
        ${r.approved?`<div class="muted" style="font-size:12px;margin-top:6px">Godkänd av ${esc(r.approved.by)} · ${esc(fmtTs(r.approved.at))}${!r.approved.start?'':r.proposed.from==='stamp'&&(r.approved.start!==r.proposed.start||r.approved.end!==r.proposed.end)?' · ändrad från stämplingen':''}</div>`
          :`<div class="muted" style="font-size:12px;margin-top:6px">Förslag från ${r.proposed.from==='stamp'?'stämpelklockan':r.proposed.from==='sheet'?'arbetsordern (Start–Klart)':'planen'}${v.breakMin?` · ${v.breakMin} min rast dras automatiskt (dagen > ${String(rule.breakAfterH).replace('.',',')} h)`:''}</div>`}
      </div>`; };
    $('#tpane').innerHTML=`
      <div class="vsum" style="margin-bottom:12px"><div><small>Väntar på godkännande</small><b>${pend.filter(r=>r.date<=t).length}</b><span>arbetsdagar i veckan</span></div>
        <div><small>Godkänt att betala</small><b>${esc(mh(appr.reduce((a,r)=>a+r.paidMin,0)))}</b><span>${appr.length} arbetsdagar</span></div>
        <div><small>Flaggade</small><b>${d.rows.filter(r=>!r.approved&&r.flags.some(f=>f!=='nojob')).length}</b><span>kolla innan du godkänner</span></div></div>
      ${per.length?`<div class="card" style="padding:10px 16px"><div class="ts-per">${per.map(p=>`<button data-who="${esc(p.rid)}" class="${tsWho===p.rid?'on':''}"><b>${esc(p.name)}</b><span>${esc(mh(p.ok))} godkänt${p.wait?` · ${p.wait} väntar`:''}</span></button>`).join('')}</div></div>`:''}
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0">
        <div class="seg" id="tsf">${[['pending',`Väntande (${pend.length})`],['approved',`Godkända (${appr.length})`],['all','Alla']].map(([k,l])=>`<button data-k="${k}" class="${tsFilter===k?'on':''}">${l}</button>`).join('')}</div>
        ${tsWho?`<button class="btn gray sm" id="tsall">Visa alla personer</button>`:''}
        <label class="tg" style="margin-left:auto"><input type="checkbox" id="tsselall"> Välj alla</label><button class="btn sm" id="tsmany" disabled>Godkänn valda</button></div>
      ${rows.length?rows.map(card).join(''):`<div class="card empty">${tsFilter==='pending'?'Inget väntar på godkännande den här veckan 👍':'Inga arbetsdagar.'}</div>`}
      <div class="card" style="margin-top:14px"><h3>Rast</h3><div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap">
        <div><label class="f" for="rb_min">Obetald rast (min)</label><input id="rb_min" type="number" min="0" max="120" step="5" value="${rule.breakMin}" style="width:120px"></div>
        <div><label class="f" for="rb_h">när dagen är längre än (timmar)</label><input id="rb_h" type="number" min="0" max="12" step="0.5" value="${rule.breakAfterH}" style="width:120px"></div>
        <button class="btn sec sm" id="rb_save">Spara</button></div><div class="muted" style="margin-top:6px">Gäller förslagen. Du kan alltid ändra rasten på en enskild dag innan du godkänner.</div></div>`;
    const item=(el)=>{ const [rid,date]=el.dataset.k.split('|'); return {rid,date,start:el.querySelector('.ts-s').value,end:el.querySelector('.ts-e').value,breakMin:Number(el.querySelector('.ts-b').value||0)}; };
    const send=async(items,msg)=>{ try{ const r=await api('/api/admin/timesheet',{method:'POST',body:JSON.stringify({items})}); notify(r.errors&&r.errors.length?`${r.approved.length} godkända. ${r.errors.join(' ')}`:msg); await showTimesheets(); }catch(e){ alert(e.message); } };
    root.querySelectorAll('.ts').forEach(el=>{
      const r=d.rows.find(x=>x.rid+'|'+x.date===el.dataset.k), upd=()=>{ const v=item(el), ok=v.start&&v.end;
        el.querySelector('.ts-p').textContent=ok?mh(Math.max(0,tLen(v.start,v.end)-v.breakMin)):'–';
        const b=el.querySelector('.ts-ok'); if(b) b.disabled=!ok; const sel=el.querySelector('.ts-sel'); if(!r.approved) sel.disabled=!ok;
        const sv=el.querySelector('.ts-save'); if(sv) sv.hidden=!(v.start!==r.approved.start||v.end!==r.approved.end||v.breakMin!==r.approved.breakMin); };
      el.querySelectorAll('input:not(.ts-sel)').forEach(i=>i.oninput=upd);
      if(el.querySelector('.ts-ok')) el.querySelector('.ts-ok').onclick=()=>send([item(el)],`${r.name} ${dfmt(r.date,{day:'numeric',month:'short'})} godkänd ✓`);
      if(el.querySelector('.ts-save')) el.querySelector('.ts-save').onclick=()=>send([item(el)],'Ändringen är sparad ✓');
      if(el.querySelector('.ts-undo')) el.querySelector('.ts-undo').onclick=async()=>{ if(!confirm('Ta bort godkännandet?')) return; try{ await api(`/api/admin/timesheet?rid=${r.rid}&date=${r.date}`,{method:'DELETE'}); await showTimesheets(); }catch(e){ alert(e.message); } };
    });
    const sels=()=>[...root.querySelectorAll('.ts-sel:checked')];
    const syncMany=()=>{ const n=sels().length, b=$('#tsmany'); b.disabled=!n; b.textContent=n?`Godkänn valda (${n})`:'Godkänn valda'; };
    root.querySelectorAll('.ts-sel').forEach(c=>c.onchange=syncMany);
    $('#tsselall').onchange=()=>{ root.querySelectorAll('.ts-sel:not(:disabled)').forEach(c=>c.checked=$('#tsselall').checked); syncMany(); };
    $('#tsmany').onclick=()=>{ const l=sels().map(c=>item(c.closest('.ts'))); if(l.length&&confirm(`Godkänna ${l.length} arbetsdag${l.length===1?'':'ar'}?`)) send(l,`${l.length} godkända ✓`); };
    root.querySelectorAll('#tsf button').forEach(x=>x.onclick=()=>{ tsFilter=x.dataset.k; drawTimesheets(); });
    root.querySelectorAll('[data-who]').forEach(x=>x.onclick=()=>{ tsWho=tsWho===x.dataset.who?'':x.dataset.who; drawTimesheets(); });
    if($('#tsall')) $('#tsall').onclick=()=>{ tsWho=''; drawTimesheets(); };
    $('#rb_save').onclick=async()=>{ try{ await api('/api/admin/settings',{method:'PATCH',body:JSON.stringify({breakMin:Number($('#rb_min').value),breakAfterH:Number($('#rb_h').value)})}); notify('Rasten är sparad ✓'); await showTimesheets(); }catch(e){ alert(e.message); } };
  }

  start().catch(e=>{ root.innerHTML=`<main><div class="err">${esc(e.message)}</div></main>`; });
})();
</script>
</body>
</html>
