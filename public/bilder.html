<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0d2a3f">
<title>Skicka bilder – FX Flytt</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!-- The customer's own page for sending photos of the home (/bilder?t=…). Photos are made smaller in the
     phone before upload, so it is quick on mobile data. Max 15 photos. -->
<style>
  :root{--navy:#0d2a3f;--accent:#ff7a1a;--accent2:#e8650a;--ink:#14212b;--muted:#5d6d7a;--line:#e2e8ee;--line2:#cfd9e2;--bg:#f3f6f9;--green:#1f8a4c;--red:#b42318}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  [hidden]{display:none!important}
  .top{background:var(--navy);padding:calc(14px + env(safe-area-inset-top)) 18px 14px}.top img{height:32px;display:block}
  main{max-width:560px;margin:0 auto;padding:18px 16px calc(40px + env(safe-area-inset-bottom))}
  h1{font-size:24px;margin:4px 0 6px;color:var(--navy)}
  .muted{color:var(--muted)}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 1px 2px rgba(13,42,63,.06)}
  .tips{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin:8px 0 0;padding:0;list-style:none;font-size:14.5px}
  .tips li::before{content:"✓ ";color:var(--green);font-weight:800}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:16px;font:inherit;font-size:17px;font-weight:800;background:var(--accent);color:#fff;cursor:pointer;text-decoration:none}
  .btn:disabled{opacity:.6}.btn.sec{background:#fff;color:var(--navy);border:2px solid var(--navy)}.btn+.btn{margin-top:10px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .ph{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#e8edf2}.ph img{width:100%;height:100%;object-fit:cover;display:block}
  .ph .st{position:absolute;inset:auto 6px 6px auto;background:rgba(13,42,63,.8);color:#fff;font-size:12px;font-weight:800;border-radius:999px;padding:2px 8px}
  .ph.ok .st{background:var(--green)}.ph.bad .st{background:var(--red)}
  .count{font-weight:800;color:var(--navy);margin-top:10px}
  .err{color:var(--red);font-weight:700;margin-top:10px}
  .done{text-align:center;padding:30px 10px}.done .big{font-size:54px}
</style>
</head>
<body>
<div class="top"><img src="/fxflytt-logo-vit.svg" alt="FX Flytt"></div>
<main id="app"><p class="muted">Laddar…</p></main>
<script>
(function(){
  const $=(s)=>document.querySelector(s), app=$('#app');
  const q=new URLSearchParams(location.search), t=q.get('t')||'', EN=q.get('lang')==='en';
  const L=EN?{hi:'Hi',title:'Send photos of your home',lead:'A few photos make the quote more accurate – and quicker. Take them with the phone or choose from your photos.',tips:['Living room','Bedrooms','Kitchen','Storage / basement','Heavy items (piano, safe)','Stairs and entrance'],pick:'📷 Take or choose photos',done:'Done – send to FX Flytt',more:'Add more photos',of:'of',up:'Sending…',ok:'✓',fail:'!',thanks:'Thank you!',thanksP:'We have your photos and will be in touch with your quote.',gone:'This link no longer works. Call us on +46 76 300 07 23.',none:'Add at least one photo first.',max:'You can send up to'}
    :{hi:'Hej',title:'Skicka bilder på ditt hem',lead:'Några bilder gör offerten säkrare – och snabbare. Ta dem med mobilen eller välj bland dina bilder.',tips:['Vardagsrum','Sovrum','Kök','Förråd / källare','Tunga saker (piano, kassaskåp)','Trappor och entré'],pick:'📷 Ta eller välj bilder',done:'Klar – skicka till FX Flytt',more:'Lägg till fler bilder',of:'av',up:'Skickar…',ok:'✓',fail:'!',thanks:'Tack!',thanksP:'Vi har fått dina bilder och återkommer med offerten.',gone:'Länken fungerar inte längre. Ring oss på 076-300 07 23.',none:'Lägg till minst en bild först.',max:'Du kan skicka högst'};
  if(EN) document.documentElement.lang='en';
  const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let count=0, max=15, busy=0;

  // Smaller photo before upload (max 1600 px, JPEG): quick on mobile data, and enough to see the furniture.
  async function shrink(file){
    const img=await createImageBitmap(file).catch(()=>null); if(!img) return file;
    const k=Math.min(1,1600/Math.max(img.width,img.height)), c=document.createElement('canvas');
    c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',.8));
  }

  async function start(){
    const r=await fetch('/api/bilder?t='+encodeURIComponent(t),{cache:'no-store'}).catch(()=>null);
    const j=r?await r.json().catch(()=>({})):{};
    if(!r||!r.ok){ app.innerHTML=`<div class="card"><b>${esc(j.error||L.gone)}</b></div>`; return; }
    count=j.count; max=j.max;
    app.innerHTML=`<h1>${esc(L.hi)}${j.name?' '+esc(j.name):''}!</h1>
      <div class="muted">${esc(L.title)}. ${esc(L.lead)}</div>
      <div class="card"><ul class="tips">${L.tips.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
      <input id="file" type="file" accept="image/*" multiple hidden>
      <button class="btn" id="pick">${esc(L.pick)}</button>
      <div class="grid" id="grid"></div>
      <div class="count" id="cnt"></div>
      <div class="err" id="err"></div>
      <button class="btn sec" id="done" style="margin-top:16px"${count?'':' hidden'}>${esc(L.done)}</button>`;
    const cnt=()=>{ $('#cnt').textContent=count?`${count} ${L.of} ${max}`:''; $('#done').hidden=!count||busy>0; $('#pick').textContent=count?L.more:L.pick; $('#pick').disabled=count>=max; };
    cnt();
    $('#pick').onclick=()=>$('#file').click();
    $('#file').onchange=async()=>{
      $('#err').textContent='';
      const files=[...$('#file').files].slice(0,Math.max(0,max-count-busy)); $('#file').value='';
      if(!files.length){ $('#err').textContent=`${L.max} ${max}.`; return; }
      for(const f of files){
        const box=document.createElement('div'); box.className='ph'; box.innerHTML=`<img alt=""><span class="st">${esc(L.up)}</span>`; $('#grid').appendChild(box);
        try{ box.querySelector('img').src=URL.createObjectURL(f); }catch(_){}
        busy++; cnt();
        try{
          const body=await shrink(f);
          const r=await fetch('/api/bilder?t='+encodeURIComponent(t),{method:'POST',headers:{'Content-Type':'image/jpeg'},body});
          const j=await r.json().catch(()=>({}));
          if(!r.ok) throw new Error(j.error||'Fel');
          count=j.count; box.classList.add('ok'); box.querySelector('.st').textContent=L.ok;
        }catch(e){ box.classList.add('bad'); box.querySelector('.st').textContent=L.fail; $('#err').textContent=e.message; }
        busy--; cnt();
      }
    };
    $('#done').onclick=async()=>{
      if(!count) return $('#err').textContent=L.none;
      $('#done').disabled=true;
      const r=await fetch('/api/bilder?t='+encodeURIComponent(t)+'&done=1',{method:'POST'}); const j=await r.json().catch(()=>({}));
      if(!r.ok){ $('#done').disabled=false; $('#err').textContent=j.error||'Fel'; return; }
      app.innerHTML=`<div class="done"><div class="big">📷✓</div><h1>${esc(L.thanks)}</h1><p class="muted">${esc(L.thanksP)}</p></div>`;
    };
  }
  start().catch(()=>{ app.innerHTML=`<div class="card"><b>${esc(L.gone)}</b></div>`; });
})();
</script>
</body>
</html>
