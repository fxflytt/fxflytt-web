<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Din offert – FX Flytt</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root{--navy:#0d2a3f;--accent:#ff7a1a;--ink:#14212b;--muted:#5b6b78;--line:#e3e8ed;--bg:#f5f7f9;--green:#1f8a4c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{background:var(--navy);padding:14px 18px;display:flex;align-items:center;gap:10px}
  .logo{background:#fff;color:var(--navy);font-weight:900;font-style:italic;padding:4px 9px;border-radius:7px;border-left:4px solid var(--accent)}
  header b{color:#fff;font-size:18px}
  main{max-width:640px;margin:0 auto;padding:18px 14px 120px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
  h1{font-size:24px;margin:0 0 4px}
  .muted{color:var(--muted);font-size:14px}
  .steps{display:flex;gap:6px;margin:4px 0 14px}
  .steps span{flex:1;font-size:12px;text-align:center;padding:6px 4px;border-radius:999px;background:#e9eef2;color:var(--muted);font-weight:600}
  .steps span.on{background:var(--accent);color:#fff}
  .steps span.done{background:#d7efe1;color:var(--green)}
  table{width:100%;border-collapse:collapse}
  td{padding:8px 0;border-bottom:1px solid var(--line);font-size:15px;vertical-align:top}
  td:first-child{color:var(--muted);width:38%}
  td:last-child{font-weight:600}
  .price{background:var(--navy);color:#fff;border-radius:14px;padding:16px 18px}
  .price .big{font-size:32px;font-weight:800;margin:2px 0 8px}
  .price .row{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:#dbe4ec;padding:2px 0}
  .price .off{font-size:15px;background:#1f8a4c;color:#fff;border-radius:999px;padding:3px 9px;vertical-align:middle}
  .pkgs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
  @media (max-width:520px){.pkgs{grid-template-columns:1fr}}
  .pkg{position:relative;text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px 12px;font:inherit;color:var(--ink);cursor:pointer}
  .pkg b{display:block;font-size:17px}.pkg small{display:block;color:var(--muted);font-size:13px;line-height:1.35;min-height:2.7em}
  .pkg .pp{font-size:20px;font-weight:800;color:var(--navy);margin-top:6px}.pkg .df{font-size:12.5px;font-weight:700;color:var(--muted)}
  .pkg.on{border-color:var(--accent);background:#fff8f2;box-shadow:0 0 0 3px #ff7a1a22}
  .pkg .pop{position:absolute;top:-10px;right:10px;background:var(--green);color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px}
  .ad{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}.ad input{width:22px;height:22px;flex:0 0 auto}.ad span{flex:1}.ad b{white-space:nowrap}
  .nobox{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
  .rs{display:flex;gap:8px;align-items:center;padding:7px 0;font-size:15px}.rs input{width:20px;height:20px}
  .nobox textarea{width:100%;margin:8px 0 10px;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit}
  .btn.gray{background:#5b6b78}
  .price .note{color:#ffb27a;font-weight:700;font-size:14px;margin-top:8px}
  .badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .badges span{font-size:12px;background:#eef3f7;border-radius:999px;padding:5px 10px;color:var(--navy);font-weight:600}
  label.f{display:block;font-weight:700;margin:12px 0 6px}
  input[type=text]{width:100%;font-size:17px;padding:13px 14px;border:1.5px solid #c9d5df;border-radius:12px}
  .kind{display:flex;gap:18px;margin:14px 0 2px;font-size:15px}.kind label{display:flex;gap:6px;align-items:center}.kind input{width:20px;height:20px}
  .trust{background:#f1f8f4;border:1px solid #cfe8d9;border-radius:12px;padding:12px 14px;margin:14px 0 4px;font-size:14px}.trust b{color:#1f6b40}.trust ul{margin:6px 0 0;padding-left:18px}.trust li{margin:2px 0}
  .chk{display:flex;gap:10px;align-items:flex-start;margin:14px 0;font-size:15px}
  .chk input{width:22px;height:22px;margin-top:2px;flex:none}
  .btn{display:block;width:100%;border:0;border-radius:999px;padding:16px;font-size:17px;font-weight:800;background:var(--accent);color:#fff}
  .btn:disabled{opacity:.6}
  .link{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:14px;margin-top:14px;padding:6px}
  .err{color:#b42318;font-weight:600;margin-top:10px}
  .ok{background:#e6f5ec;border-color:#bfe5cf}
  .ok h1{color:var(--green)}
  a{color:var(--navy)}
  /* The seller's greeting, the end date, the customer's photos, questions and the PDF */
  .intro{display:flex;gap:14px;align-items:flex-start}
  .intro .av{width:64px;height:64px;border-radius:50%;object-fit:cover;flex:none;background:#e9eef2;border:3px solid #fff;box-shadow:0 0 0 2px var(--accent)}
  .intro .av.ini{display:flex;align-items:center;justify-content:center;font-weight:900;font-size:24px;color:var(--navy)}
  .intro p{margin:0 0 8px;white-space:pre-wrap;font-size:15.5px}
  .intro .who{font-weight:800;color:var(--navy);font-size:15px}.intro .who small{display:block;font-weight:600;color:var(--muted);font-size:13px}
  .intro .who a{font-weight:700}
  .valid{display:flex;gap:10px;align-items:center;background:#fff8f2;border:1px solid #ffd9bd;border-radius:12px;padding:10px 14px;margin-top:12px;font-size:14.5px}
  .valid b{color:#b5520a}.valid.soon{background:#fff1e6;border-color:#ff7a1a}
  .pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}.pgrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chips span{font-size:13px;background:#eef3f7;border-radius:999px;padding:4px 10px;font-weight:600;color:var(--navy)}
  .qa{display:grid;gap:8px;margin:10px 0}
  .qa .q,.qa .a{border-radius:14px;padding:10px 13px;font-size:15px;white-space:pre-wrap;max-width:88%}
  .qa .q{background:#eef3f7;justify-self:end;border-bottom-right-radius:4px}
  .qa .a{background:#fff3e8;border-bottom-left-radius:4px}.qa small{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:2px}
  .qa .wait{font-size:13px;color:var(--muted);justify-self:end}
  #qtxt{width:100%;padding:12px;border:1.5px solid #c9d5df;border-radius:12px;font:inherit;font-size:16px;resize:vertical}
  .btn.sec{background:#fff;color:var(--navy);border:2px solid var(--navy)}
  .pdfbtn{display:inline-flex;gap:6px;align-items:center;margin-top:12px;font-weight:700;font-size:14.5px;text-decoration:none;border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;background:#fff}
  @media print{header,.steps,#qa-card,#sign-card,.pdfbtn,#pvbar{display:none!important}body{background:#fff}.card{border:0;padding:8px 0;margin:0 0 6px}.price{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<header><span class="logo">FX</span><b>FX Flytt</b></header>
<main id="app"><div class="card"><p class="muted">Hämtar din offert…</p></div></main>
<script>
(function(){
  const $=(s)=>document.querySelector(s);
  const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const kr=(n)=>Math.round(n).toLocaleString('sv-SE')+' kr';
  const fmtDate=(d)=>/^\d{4}-\d{2}-\d{2}$/.test(d||'')?new Date(d+'T12:00:00Z').toLocaleDateString('sv-SE',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}):'Enligt överenskommelse';
  const t=new URLSearchParams(location.search).get('t')||'', PREVIEW=new URLSearchParams(location.search).get('preview')==='1';
  const app=$('#app');
  const COMPANY=`<div class="card"><b>FX Flytt AB</b><div class="muted">Drottninggatan 1, 736 31 Kungsör · <a href="tel:+46763000723">076-300 07 23</a> · <a href="mailto:info@fxflytt.se">info@fxflytt.se</a></div>
    <div class="badges"><span>F-skatt</span><span>Trafiktillstånd</span><span>Försäkrade hos Trygg-Hansa</span><span>7 dagars städgaranti</span></div></div>`;

  function steps(s){const i={sent:1,signed:3}[s]??1;return `<div class="steps"><span class="done">Offert skickad</span><span class="${i===1?'on':'done'}">Granska</span><span class="${i===3?'done':''}">Signera</span><span class="${i===3?'done':''}">Bokad</span></div>`;}
  function details(v){
    const rows=[['Datum',fmtDate(v.date)+(v.time?' kl. '+v.time:'')],['Tjänst',v.size],['Från',v.from],['Till',v.to],['Avstånd',v.distanceKm?'ca '+v.distanceKm+' km':''],['Boyta',v.areaM2?v.areaM2+' m²':''],['Bostad',v.home],['Våning (från)',v.floorFrom],['Våning (till)',v.floorTo],['Tillval',(v.extras||[]).join(', ')],['Valda tillval',(v.addonsChosen||[]).map(a=>a.label+' (+'+kr(a.price)+')').join(', ')]];
    return `<table>${rows.filter(r=>r[1]).map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join('')}</table>`;
  }
  function price(o,disc,chosen){
    if(!o) return '';
    const add=(chosen||[]).reduce((a,x)=>a+x.price,0);
    return `<div class="price"><div style="color:#b9c7d3;font-size:13px">Pris efter RUT, inkl. moms</div>${disc?`<div style="color:#b9c7d3;text-decoration:line-through;font-size:16px;margin-top:4px">${kr(disc.before+add)}</div>`:''}<div class="big"><span id="tot">${kr(o.total)}</span>${disc?` <span class="off">−${disc.pct} %</span>`:''}</div><div id="totadd" class="row" hidden></div>
      ${(o.lines||[]).map(l=>`<div class="row"><span>${esc(l.label)}</span><span>${kr(l.amount)}</span></div>`).join('')}
      ${o.customerNote?`<div class="row" style="color:#fff">${esc(o.customerNote)}</div>`:''}
      ${o.note?`<div class="note">${esc(o.note)}</div>`:''}
      ${(o.notIncluded||[]).length?`<div class="note">Ingår inte i priset:</div>${o.notIncluded.map(x=>`<div class="row">• ${esc(x)}</div>`).join('')}`:''}
      <div style="color:#b9c7d3;font-size:12px;margin-top:10px">Priset efter RUT gäller om du har rätt till RUT-avdrag och utrymme kvar för året.</div></div>`;
  }
  // Countdown to the end of the last valid day (Swedish time).
  function validBox(v){
    if(!v.validUntil) return '';
    const end=new Date(v.validUntil+'T23:59:59+01:00').getTime(), left=end-Date.now(), d=Math.floor(left/864e5), h=Math.floor(left%864e5/36e5);
    const when=new Date(v.validUntil+'T12:00:00Z').toLocaleDateString('sv-SE',{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'});
    const soon=left<2*864e5, rest=left<=0?'':d>=1?` – ${d} ${d===1?'dag':'dagar'}${soon&&h?` och ${h} tim`:''} kvar`:` – ${Math.max(1,h)} tim kvar`;
    return `<div class="valid${soon?' soon':''}"><span style="font-size:20px">⏳</span><span>Priset gäller till och med <b>${esc(when)}</b>${esc(rest)}</span></div>`;
  }
  function introCard(v,first){
    const i=v.intro;
    if(!i) return `<div class="card"><h1>Hej ${first}!</h1><p class="muted">Här är din offert från FX Flytt (${esc(v.id)}). Kontrollera uppgifterna och signera – då är flytten bokad.</p>${validBox(v)}${pdfBtn()}</div>`;
    const ini=esc((i.name||'FX').split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase());
    const tel=i.phone?i.phone.replace(/[^\d+]/g,'').replace(/^0/,'+46'):'';
    return `<div class="card"><div class="intro">${i.photo?`<img class="av" src="${esc(i.photo)}" alt="">`:`<div class="av ini">${ini}</div>`}<div style="min-width:0;flex:1"><p>${esc(i.text)}</p>
      <div class="who">${esc(i.name)}${i.title?`<small>${esc(i.title)}, FX Flytt</small>`:'<small>FX Flytt</small>'}${i.phone?`<a href="tel:${esc(tel)}">📞 ${esc(i.phone)}</a>`:''}</div></div></div>
      <p class="muted" style="margin:12px 0 0">Offert ${esc(v.id)} · kontrollera uppgifterna nedan och signera – då är flytten bokad.</p>${validBox(v)}${pdfBtn()}</div>`;
  }
  const pdfBtn=()=>t?`<a class="pdfbtn" href="/api/offert-pdf?t=${encodeURIComponent(t)}" target="_blank" rel="noopener">📄 Ladda ner som PDF</a>`:'';
  function photosCard(v){
    const p=v.photos; if(!p) return '';
    return `<div class="card"><h2 style="margin:0 0 2px;font-size:20px">📷 Vi har tittat på dina bilder</h2><p class="muted" style="margin:0">Tack för bilderna (${p.n} st). Så här har vi räknat:</p>
      <div class="pgrid">${p.urls.map(u=>`<img src="${esc(u)}" alt="" loading="lazy">`).join('')}</div>
      <div><b>Ca ${esc(p.m3)} m³</b> att flytta</div>
      ${p.heavy.length?`<div class="muted" style="margin-top:8px">Tunga saker vi tar med extra folk eller verktyg för:</div><div class="chips">${p.heavy.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`:''}
      ${p.fragile.length?`<div class="muted" style="margin-top:8px">Ömtåligt som vi skyddar extra:</div><div class="chips">${p.fragile.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`:''}</div>`;
  }
  function qaCard(v){
    const fmt=(t)=>new Date(t).toLocaleString('sv-SE',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
    const list=(v.qa||[]).map(x=>`<div class="q"><small>Du · ${esc(fmt(x.at))}</small>${esc(x.q)}</div>${x.a?`<div class="a"><small>${esc(x.aBy||'FX Flytt')} · ${esc(fmt(x.aAt))}</small>${esc(x.a)}</div>`:'<div class="wait">Vi svarar så snart vi kan – oftast samma dag.</div>'}`).join('');
    return `<div class="card" id="qa-card"><h2 style="margin:0 0 2px;font-size:20px">Har du en fråga?</h2><p class="muted" style="margin:0">Skriv här så svarar vi i offerten${v.intro?'':''} – du får ett mejl när svaret finns.</p>
      ${list?`<div class="qa">${list}</div>`:''}
      <textarea id="qtxt" rows="3" maxlength="1000" placeholder="T.ex. Kan ni ta med en soffa till återvinningen?" style="margin-top:10px"></textarea>
      <button class="btn sec" id="qsend" style="margin-top:8px">Skicka frågan</button><div class="err" id="qerr"></div></div>`;
  }
  function bindQa(){
    const b=$('#qsend'); if(!b) return;
    b.onclick=async()=>{
      if(PREVIEW){ $('#qerr').textContent='Det här är en förhandsgranskning.'; return; }
      const text=$('#qtxt').value.trim(); if(text.length<3){ $('#qerr').textContent='Skriv din fråga.'; return; }
      b.disabled=true; b.textContent='Skickar…'; $('#qerr').textContent='';
      try{ const r=await fetch('/api/booking',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({t,action:'ask',text})}); const j=await r.json().catch(()=>({}));
        if(!r.ok) throw new Error(j.error||'Något gick fel.');
        const y=window.scrollY; render(j.view); window.scrollTo(0,y); const c=$('#qa-card'); if(c) c.scrollIntoView({block:'center'});
      }catch(e){ $('#qerr').textContent=e.message; b.disabled=false; b.textContent='Skicka frågan'; }
    };
  }
  let pkgSel=null;
  // The offer as shown: with the package the customer has picked.
  const curOffer=(v)=>{ const p=(v.packages||[]).find(x=>x.id===pkgSel); return p?{...v.offer,total:p.total,lines:p.lines}:v.offer; };
  function render(v){
    if(PREVIEW&&!document.getElementById('pvbar')){ const d=document.createElement('div'); d.id='pvbar'; d.textContent='👁 Förhandsgranskning – så här ser kunden offerten. Inget har skickats.'; d.style.cssText='position:sticky;top:0;z-index:50;background:#0d2a3f;color:#fff;font-weight:700;text-align:center;padding:10px 14px;font-size:14px'; document.body.prepend(d); }
    const first=esc((v.name||'').split(' ')[0]);
    if(v.packages&&!pkgSel) pkgSel=v.pkg||v.packages[0].id;
    if(v.status==='signed'||v.status==='done'){
      app.innerHTML=`<div class="card ok"><h1>Din flytt är bokad ✓</h1><p>Signerad av <b>${esc(v.signedName)}</b> ${esc(new Date(v.signedAt).toLocaleString('sv-SE',{dateStyle:'long',timeStyle:'short'}))}.</p><p class="muted">Bokningsnummer ${esc(v.id)}. En bekräftelse har skickats till din e-post. Vi hör av oss innan flyttdagen.</p></div>`+
        `<div class="card">${details(v)}</div><div class="card">${price(v.offer,v.discount,v.addonsChosen)}${pdfBtn()}</div>`+COMPANY;
      return;
    }
    if(v.status==='declined'){
      app.innerHTML=`<div class="card"><h1>Tack för ditt svar</h1><p>Du har tackat nej till offerten. Ändrat dig eller vill du ha ett nytt förslag? Ring oss på <a href="tel:+46763000723">076-300 07 23</a>.</p></div>`+COMPANY;
      return;
    }
    if(v.expired){
      app.innerHTML=`<div class="card"><h1>Offerten har gått ut</h1><p>Hej ${first}! Priset gällde till och med ${esc(new Date(v.validUntil+'T12:00:00Z').toLocaleDateString('sv-SE',{day:'numeric',month:'long',timeZone:'UTC'}))}.
        ${v.renewAsked?'<b>Tack – vi har fått din förfrågan och skickar en ny offert så snart vi kan.</b>':'Vill du fortfarande flytta med oss? Tryck nedan så skickar vi en ny offert – oftast samma dag.'}</p>
        ${v.renewAsked?'':'<button class="btn" id="renew">Skicka en ny offert till mig</button><div class="err" id="err"></div>'}
        <p class="muted" style="margin:12px 0 0">Eller ring oss på <a href="tel:+46763000723">076-300 07 23</a>.</p></div>`+
        `<div class="card" style="opacity:.75">${details(v)}</div>`+qaCard(v)+COMPANY;
      bindQa();
      if($('#renew')) $('#renew').onclick=async()=>{ if(PREVIEW){ $('#err').textContent='Det här är en förhandsgranskning.'; return; } $('#renew').disabled=true;
        try{ const r=await fetch('/api/booking',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({t,action:'renew'})}); const j=await r.json(); render(j.view); }catch(_){ $('#renew').disabled=false; $('#err').textContent='Något gick fel – ring oss.'; } };
      return;
    }
    app.innerHTML=steps(v.status)+
      introCard(v,first)+
      `<div class="card">${details(v)}</div>`+photosCard(v)+
      (v.packages?`<div class="card"><h2 style="margin:0 0 2px;font-size:20px">Välj paket</h2><p class="muted" style="margin:0">Du kan byta paket här innan du signerar – priset uppdateras direkt.</p>
        <div class="pkgs">${v.packages.map(p=>`<button type="button" class="pkg${p.id===pkgSel?' on':''}" data-pkg="${esc(p.id)}">${p.id==='premium'?'<span class="pop">Populärast</span>':''}<b>${esc(p.name)}</b><small>${esc(p.desc)}</small><div class="pp">${kr(p.total)}</div><div class="df" data-df="${esc(p.id)}"></div></button>`).join('')}</div></div>`:'')+
      `<div class="card" id="pricecard">${price(curOffer(v),v.discount)}</div>`+
      ((v.addons||[]).length&&v.offer?`<div class="card"><h2 style="margin:0 0 4px;font-size:20px">Lägg till i din flytt</h2><p class="muted" style="margin:0 0 6px">Kryssa i det du vill ha – priset uppdateras direkt. Priserna gäller efter RUT-avdrag.</p>
        ${v.addons.map(a=>`<label class="ad"><input type="checkbox" class="addon" value="${esc(a.id)}" data-p="${a.price}"><span>${esc(a.label)}</span><b>+${kr(a.price)}</b></label>`).join('')}</div>`:'')+
      qaCard(v)+
      `<div class="card" id="sign-card"><h2 style="margin:0 0 4px;font-size:20px">Signera och boka</h2>
        <label class="f" for="nm">Ditt för- och efternamn</label>
        <input id="nm" type="text" autocomplete="name" value="${esc(v.name||'')}">
        <div class="kind"><label><input type="radio" name="kind" value="private" checked> Privatperson</label><label><input type="radio" name="kind" value="company"> Företag</label></div>
        <label class="f" for="pnr" id="pnrL">Personnummer (för RUT-avdraget)</label>
        <input id="pnr" type="text" inputmode="numeric" autocomplete="off" placeholder="ÅÅÅÅMMDD-XXXX" maxlength="13">
        ${v.trust?`<div class="trust"><b>🛡 Trygg affär med FX Flytt AB</b><ul>${v.trust.orgNr?`<li>Organisationsnummer ${esc(v.trust.orgNr)}</li>`:''}${v.trust.fskatt?'<li>Godkänd för F-skatt</li>':''}${v.trust.insured?`<li>Ansvarsförsäkring${v.trust.insurer?' hos '+esc(v.trust.insurer):''} – dina saker är försäkrade under flytten</li>`:''}<li>Flytten följer branschens villkor Bohag 2010</li></ul></div>`:''}
        <label class="chk"><input id="ok" type="checkbox"><span>Jag godkänner offerten och FX Flytts <a href="/villkor" target="_blank" rel="noopener">villkor</a> (inklusive Bohag 2010).</span></label>
        <button class="btn" id="sign">Signera och boka</button>
        <div class="err" id="err"></div>
        <p class="muted" style="font-size:13px;margin:12px 0 0">När du signerar sparar vi ditt namn, ditt person- eller organisationsnummer, tidpunkt och information om din enhet som bekräftelse på avtalet.</p>
        <button class="link" id="no">Jag vill inte ha offerten</button>
        <div id="nobox" class="nobox" hidden>
          <h2 style="margin:0 0 4px;font-size:18px">Tacka nej till offerten</h2>
          <p class="muted" style="margin:0 0 8px">Vill du berätta varför? Det är frivilligt men hjälper oss bli bättre.</p>
          ${[['price','Priset är för högt'],['other_company','Jag har valt en annan flyttfirma'],['date','Datumet passar inte'],['no_move','Jag ska inte flytta längre'],['other','Annat']].map(r=>`<label class="rs"><input type="radio" name="why" value="${r[0]}"> ${r[1]}</label>`).join('')}
          <textarea id="whytxt" rows="3" maxlength="400" placeholder="Skriv gärna mer (frivilligt)"></textarea>
          <button class="btn gray" id="nosend">Tacka nej</button>
          <button class="link" id="nocancel">Avbryt</button>
        </div></div>`+COMPANY;
    document.querySelectorAll('input[name=kind]').forEach(r=>r.onchange=()=>{const c=kind()==='company';$('#pnrL').textContent=c?'Organisationsnummer':'Personnummer (för RUT-avdraget)';$('#pnr').placeholder=c?'XXXXXX-XXXX':'ÅÅÅÅMMDD-XXXX';$('#pnr').value='';});
    $('#sign').onclick=()=>act('sign');
    bindQa();
    const totals=()=>{
      const o=curOffer(v), cleanIn=pkgSel&&pkgSel!=='bas';
      document.querySelectorAll('.addon').forEach(c=>{ const cl=/flyttstäd/i.test(c.parentElement.textContent); c.closest('.ad').hidden=cl&&cleanIn; if(cl&&cleanIn) c.checked=false; });
      const sel=[...document.querySelectorAll('.addon:checked')], add=sel.reduce((a,x)=>a+Number(x.dataset.p),0);
      $('#tot').textContent=kr(o.total+add);
      const t=$('#totadd'); t.hidden=!add; t.innerHTML=add?`<span>varav tillval</span><span>+${kr(add)}</span>`:'';
      $('#sign').textContent=(add||v.packages)?'Signera och boka – '+kr(o.total+add):'Signera och boka';
      (v.packages||[]).forEach(p=>{ const el=document.querySelector(`[data-df="${p.id}"]`), base=(v.packages.find(x=>x.id===pkgSel)||p).total; if(el) el.textContent=p.id===pkgSel?'Vald':(p.total>base?'+':'−')+kr(Math.abs(p.total-base)); });
    };
    document.querySelectorAll('.addon').forEach(c=>c.onchange=totals);
    const SIZES={bas:'Bara flytt – Bas',premium:'Flytt + flyttstäd – Premium, 10 % rabatt',deluxe:'Flytt + flyttstäd + packning – Deluxe, 20 % rabatt'};
    const setSize=()=>{ if(!v.packages) return; document.querySelectorAll('td').forEach(td=>{ if(td.textContent==='Tjänst'&&td.nextElementSibling) td.nextElementSibling.textContent=SIZES[pkgSel]||v.size; }); };
    setSize();
    document.querySelectorAll('.pkg').forEach(b=>b.onclick=()=>{ pkgSel=b.dataset.pkg; setSize(); document.querySelectorAll('.pkg').forEach(x=>x.classList.toggle('on',x===b)); $('#pricecard').innerHTML=price(curOffer(v),v.discount); totals(); });
    totals();
    $('#no').onclick=()=>{ $('#nobox').hidden=false; $('#no').hidden=true; $('#nobox').scrollIntoView({behavior:'smooth',block:'center'}); };
    $('#nocancel').onclick=()=>{ $('#nobox').hidden=true; $('#no').hidden=false; };
    $('#nosend').onclick=()=>act('decline');
  }
  function kind(){const r=document.querySelector('input[name=kind]:checked');return r?r.value:'private';}
  async function act(action){
    if(PREVIEW){ $('#err').textContent='Det här är en förhandsgranskning – kunden signerar i sin egen länk.'; return; }
    const btn=action==='decline'?$('#nosend'):$('#sign'), label=btn.textContent, err=$('#err'); err.textContent=''; btn.disabled=true; btn.textContent=action==='decline'?'Skickar…':'Signerar…';
    try{
      const why=document.querySelector('input[name=why]:checked');
      const body={t,action,name:($('#nm')||{}).value||'',pnr:($('#pnr')||{}).value||'',kind:kind(),extras:[...document.querySelectorAll('.addon:checked')].map(x=>x.value),pkg:pkgSel||undefined,accept:!!($('#ok')||{}).checked,reason:why?why.value:'',reasonText:($('#whytxt')||{}).value||''};
      if(action==='sign'&&!body.accept){ throw new Error('Kryssa i att du godkänner offerten och villkoren.'); }
      const r=await fetch('/api/booking',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      const j=await r.json().catch(()=>({}));
      if(j.view){ render(j.view); window.scrollTo(0,0); return; }
      throw new Error(j.error||'Något gick fel. Ring oss på 076-300 07 23.');
    }catch(e){ err.textContent=e.message; if(action==='decline'){ $('#nobox').insertAdjacentElement('beforeend',err); } btn.disabled=false; btn.textContent=label; }
  }
  fetch('/api/booking?t='+encodeURIComponent(t)).then(r=>r.ok?r.json():Promise.reject(r.status)).then(render).catch(()=>{
    app.innerHTML=`<div class="card"><h1>Offerten hittades inte</h1><p>Länken kan vara felaktig eller så har offerten tagits bort. Ring oss på <a href="tel:+46763000723">076-300 07 23</a> så hjälper vi dig.</p></div>`+COMPANY;
  });
})();
</script>
</body>
</html>
